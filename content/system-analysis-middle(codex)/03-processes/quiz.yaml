pass_score: 70
questions:
  - question: Зачем сначала описывать AS-IS?
    options: ["Чтобы понять реальную проблему и обходные пути", "Чтобы сразу выбрать БД", "Чтобы не обсуждать цель"]
    answer: "Чтобы понять реальную проблему и обходные пути"
    explanation: Иначе TO-BE может автоматизировать лишнее.
  - question: Какой элемент BPMN подходит для выбора «слот свободен?»
    options: ["XOR gateway", "End event", "Pool"]
    answer: "XOR gateway"
    explanation: Это развилка с одним из взаимоисключающих путей.
  - question: Что рисуют между разными pool?
    options: ["Message flow", "Sequence flow", "Связь сущностей"]
    answer: "Message flow"
    explanation: Поток сообщений показывает взаимодействие участников.
  - question: Что должно быть у хорошей BPMN-диаграммы?
    options: ["Понятные начала и результаты", "Условия на шлюзах", "Случайные декоративные иконки"]
    answer: ["Понятные начала и результаты", "Условия на шлюзах"]
    explanation: Это делает путь процесса проверяемым.
  - question: Как корректнее представить «SMS не доставлено»?
    options: ["Событием ошибки", "Задачей отправки", "Дорожкой пользователя"]
    answer: "Событием ошибки"
    explanation: Это факт, который произошёл после действия.
