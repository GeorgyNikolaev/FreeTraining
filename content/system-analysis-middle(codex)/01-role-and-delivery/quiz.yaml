pass_score: 70
questions:
  - question: Какой результат работы аналитика наиболее полезен QA?
    options: ["Критерии приёмки и крайние случаи", "Список участников встречи", "Только оценка разработки"]
    answer: "Критерии приёмки и крайние случаи"
    explanation: По ним можно построить проверяемые тесты.
  - question: Что нужно зафиксировать для решения о часовом поясе?
    options: ["Журнал решений", "Только название задачи", "Комментарий в коде"]
    answer: "Журнал решений"
    explanation: Он сохраняет контекст, альтернативы и причину выбора.
  - question: Какие вопросы относятся к готовности задачи к разработке?
    options: ["Ясны правила", "Есть проверяемые критерии", "Известна цена акции"]
    answer: ["Ясны правила", "Есть проверяемые критерии"]
    explanation: Команда должна оценивать задачу без неявных допущений.
  - question: Кто подтверждает бизнес-результат на UAT?
    options: ["Бизнес-владелец или назначенный пользователь", "Только разработчик", "Только аналитик"]
    answer: "Бизнес-владелец или назначенный пользователь"
    explanation: Аналитик организует проверку, но не подменяет владельца результата.
  - question: Что точнее описывает роль системного аналитика?
    options: ["Снижает неопределённость и согласует решение", "Пишет любой код", "Только ведёт встречи"]
    answer: "Снижает неопределённость и согласует решение"
    explanation: Код и встречи могут быть частью процесса, но не определяют роль.
