pass_score: 70
questions:
  - question: Клиент говорит «сделайте удобную запись». Какой следующий шаг аналитика наиболее правильный?
    options: ["Выяснить цель, сценарии и измеримые признаки удобства", "Сразу выбрать Redis", "Написать название таблицы"]
    answer: "Выяснить цель, сценарии и измеримые признаки удобства"
    explanation: Общая просьба не является проверяемым требованием.
  - question: Как сформулировать правило конкурентной записи?
    options: ["На один слот не более одной активной записи", "Кнопка должна быть синей", "Сервис должен быть современным"]
    answer: "На один слот не более одной активной записи"
    explanation: Это доменное ограничение, которое можно обеспечить и проверить.
  - question: Какой BPMN-элемент подходит для результата «оплата не прошла»?
    options: ["Событие ошибки или результата", "Задача оплаты", "Lane администратора"]
    answer: "Событие ошибки или результата"
    explanation: Неуспешная оплата — произошедший факт, а не выполняемая работа.
  - question: Какие артефакты помогают оценить влияние изменения правила?
    options: ["Матрица трассировки", "Журнал решений", "Случайная переписка без контекста"]
    answer: ["Матрица трассировки", "Журнал решений"]
    explanation: Они связывают правило с реализацией, проверками и причиной решений.
  - question: Какой SQL-подход найдёт слоты с более чем одной активной записью?
    options: ["GROUP BY slot_id с HAVING COUNT(*) > 1", "DELETE FROM appointment", "ORDER BY created_at"]
    answer: "GROUP BY slot_id с HAVING COUNT(*) > 1"
    explanation: Группировка и HAVING проверяют количество строк в каждой группе.
  - question: Почему кэш доступности слота нельзя считать окончательной истиной?
    options: ["Он может быть устаревшим", "Redis не умеет хранить строки", "Кэш всегда медленнее БД"]
    answer: "Он может быть устаревшим"
    explanation: Финальное решение требует проверки и ограничения в транзакции БД.
  - question: Какой вариант лучше при одной команде и неясных доменных границах?
    options: ["Модульный монолит", "Немедленно десятки микросервисов", "Нет приложения вообще"]
    answer: "Модульный монолит"
    explanation: Он дешевле в эксплуатации и сохраняет возможность выделить границы позже.
  - question: Что относится к уровню Container в C4?
    options: ["Backend API и PostgreSQL", "Каждый метод контроллера", "Только пользовательский экран"]
    answer: "Backend API и PostgreSQL"
    explanation: Это исполняемое приложение и хранилище; методы — слишком низкий уровень.
  - question: POST /appointments повторился после таймаута. Что предотвращает двойную запись?
    options: ["Idempotency-Key и сохранённый результат", "Только 200 вместо 201", "Увеличение TTL кэша"]
    answer: "Idempotency-Key и сохранённый результат"
    explanation: Повтор одного ключа должен вернуть результат первого выполнения.
  - question: Какой статус вернуть при попытке занять уже занятый слот?
    options: ["409 Conflict", "201 Created", "404 Not Found"]
    answer: "409 Conflict"
    explanation: Ресурс может существовать, но действие конфликтует с его состоянием.
  - question: Какие свойства нужны потребителю события при at-least-once доставке?
    options: ["Идемпотентность", "Учёт eventId", "Надежда, что дубликатов не будет"]
    answer: ["Идемпотентность", "Учёт eventId"]
    explanation: Дубликаты нормальны при такой модели доставки.
  - question: Что устраняет outbox?
    options: ["Окно между коммитом бизнес-данных и фиксацией намерения отправить событие", "Все ошибки сети", "Необходимость DLQ"]
    answer: "Окно между коммитом бизнес-данных и фиксацией намерения отправить событие"
    explanation: Отправка всё ещё может повторяться или временно не удаваться.
  - question: Какое требование к производительности сформулировано правильно?
    options: ["p95 поиска слотов не более 500 мс при 100 RPS", "Поиск должен быть быстрым", "Сервер не должен тормозить"]
    answer: "p95 поиска слотов не более 500 мс при 100 RPS"
    explanation: Указаны метрика, порог и условия.
  - question: Что проверить на UAT переноса записи?
    options: ["Освобождение старого слота только после успеха нового", "Отказ при сроке менее двух часов", "Только компиляцию backend"]
    answer: ["Освобождение старого слота только после успеха нового", "Отказ при сроке менее двух часов"]
    explanation: Это бизнес-правила сценария; компиляция не заменяет UAT.
  - question: Как безопасно развивать API?
    options: ["Добавлять необязательные поля и заранее объявлять несовместимые изменения", "Молча менять смысл полей", "Возвращать stack trace клиенту"]
    answer: "Добавлять необязательные поля и заранее объявлять несовместимые изменения"
    explanation: Так существующие потребители не ломаются неожиданно.
