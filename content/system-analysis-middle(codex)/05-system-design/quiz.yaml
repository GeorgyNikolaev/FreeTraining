pass_score: 70
questions:
  - question: Что означает Container в C4?
    options: ["Исполняемое приложение или хранилище", "Обязательно Docker-контейнер", "Один класс"]
    answer: "Исполняемое приложение или хранилище"
    explanation: Термин C4 шире технологии контейнеризации.
  - question: Когда оправдано выделение микросервиса?
    options: ["Есть стабильная граница и независимый выпуск или масштабирование", "Команда хочет модную архитектуру", "Нет мониторинга"]
    answer: "Есть стабильная граница и независимый выпуск или масштабирование"
    explanation: Иначе стоимость распределённой системы не окупается.
  - question: Почему PostgreSQL подходит для записи на слот?
    options: ["Нужны транзакции и ограничения целостности", "Он автоматически рассылает SMS", "В нём нельзя делать JOIN"]
    answer: "Нужны транзакции и ограничения целостности"
    explanation: Для конкурирующей записи критичны согласованность и связи.
  - question: Что верно про cache-aside?
    options: ["При промахе приложение загружает данные из БД", "TTL делает данные мгновенно актуальными", "Кэш заменяет проверку в БД"]
    answer: "При промахе приложение загружает данные из БД"
    explanation: TTL ограничивает устаревание, но не является гарантией актуальности.
  - question: Какие меры уменьшают cache stampede?
    options: ["Single-flight или блокировка", "Только бесконечный TTL", "Раннее обновление"]
    answer: ["Single-flight или блокировка", "Раннее обновление"]
    explanation: Они не дают множеству запросов одновременно загрузить одно значение.
  - question: Где должна быть финальная проверка доступности слота?
    options: ["В транзакции БД", "Только в Redis", "Только в браузере"]
    answer: "В транзакции БД"
    explanation: Кэш и UI могут быть устаревшими.
