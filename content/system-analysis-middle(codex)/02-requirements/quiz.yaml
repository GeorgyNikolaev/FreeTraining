questions:
  - question: Что лучше выясняет правило занятости слота?
    options: ["Что считается активной записью?", "Какой цвет кнопки?", "Как назвать таблицу?"]
    answer: "Что считается активной записью?"
    explanation: Вопрос раскрывает доменное правило, а не преждевременный дизайн.
  - question: Какой пример является NFR?
    options: ["95% запросов поиска отвечают за 500 мс", "Клиент отменяет запись", "Нельзя отменять за 2 часа"]
    answer: "95% запросов поиска отвечают за 500 мс"
    explanation: Это измеримое свойство качества.
  - question: Что делает критерий приёмки проверяемым?
    options: ["Указаны условие, действие и наблюдаемый результат", "Есть слово удобно", "Назван инструмент разработки"]
    answer: "Указаны условие, действие и наблюдаемый результат"
    explanation: Тогда QA и бизнес одинаково понимают проверку.
  - question: Что полезно трассировать?
    options: ["Потребность с требованием", "Требование с тестом", "Случайный комментарий с эмодзи"]
    answer: ["Потребность с требованием", "Требование с тестом"]
    explanation: Эти связи показывают ценность и покрытие проверки.
  - question: Что нужно сделать при новом правиле переноса?
    options: ["Оценить влияние на связанные артефакты", "Молча изменить один экран", "Удалить старые тесты"]
    answer: "Оценить влияние на связанные артефакты"
    explanation: Меняются статусы, интеграции, аудит и тесты.
