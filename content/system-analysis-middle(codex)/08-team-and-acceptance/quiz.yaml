pass_score: 70
questions:
  - question: Как лучше декомпозировать функцию онлайн-записи?
    options: ["По пользовательским сценариям", "Только по слоям backend/frontend/БД", "По названиям классов"]
    answer: "По пользовательским сценариям"
    explanation: Так ценность появляется поэтапно и её можно принять.
  - question: Чем UAT отличается от тестирования QA?
    options: ["Подтверждает пригодность для бизнес-процесса", "Заменяет все автотесты", "Проверяет стиль кода"]
    answer: "Подтверждает пригодность для бизнес-процесса"
    explanation: QA проверяет соответствие спецификации, UAT — пригодность решения.
  - question: Что нужно предусмотреть для фичефлага?
    options: ["Владельца и дату удаления", "Вечное существование", "Отсутствие мониторинга"]
    answer: "Владельца и дату удаления"
    explanation: Иначе временный механизм становится неуправляемым долгом.
  - question: Что должно быть в критериях переноса?
    options: ["Проверка срока в 2 часа", "Проверка доступности нового слота", "Только название кнопки"]
    answer: ["Проверка срока в 2 часа", "Проверка доступности нового слота"]
    explanation: Это критические правила предметной области.
  - question: Что делать, если после релиза звонки не снизились?
    options: ["Проверить метрики и причины в пользовательском пути", "Сразу удалить все логи", "Считать API готовым и игнорировать цель"]
    answer: "Проверить метрики и причины в пользовательском пути"
    explanation: Технический релиз не доказывает достижение бизнес-ценности.
