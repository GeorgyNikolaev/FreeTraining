pass_score: 70
questions:
  - question: >
      Граф скомпилирован с чекпойнтером. Первый вызов на нити дал состояние
      `{"log": ["a", "b"], "n": 2}`, где `log` объявлен с редьюсером `add`, а `n`
      — обычное поле. Второй вызов на той же нити приходит с входом
      `{"log": ["новый"], "n": 100}`. Что будет в состоянии перед первым узлом?
    options:
      - text: "`{\"log\": [\"a\", \"b\", \"новый\"], \"n\": 100}` — к списку добавили, число заменили"
        correct: true
      - text: "`{\"log\": [\"новый\"], \"n\": 100}` — вход всегда заменяет состояние целиком"
      - text: "`{\"log\": [\"a\", \"b\"], \"n\": 2}` — вход игнорируется, если нить уже существует"
      - text: "Ошибка: нельзя подавать вход на нить с сохранённым состоянием"
    explanation: >
      Вход на существующую нить — это обычное обновление состояния, к нему
      применяются те же редьюсеры: поле с `add` дополняется, поле без редьюсера
      заменяется. Полная замена происходила бы, будь у всех полей поведение по
      умолчанию, а игнорирование входа сделало бы продолжение диалога
      невозможным. Ошибки здесь нет — это штатный способ продолжить нить.
  - question: >
      Что из перечисленного сохраняется в снимке состояния и позволяет
      продолжить прерванный запуск с того же места?
    options:
      - text: Список узлов, которые должны выполниться следующими (`next`)
        correct: true
      - text: Значения всех полей состояния
        correct: true
      - text: Контекст запуска, переданный параметром `context`
      - text: Содержимое долговременной памяти (Store)
    explanation: >
      Снимок хранит и данные, и план: без `next` движок не знал бы, откуда
      продолжать. Контекст в чекпойнт не попадает — он задаётся на каждый запуск
      заново, и именно поэтому туда кладут подключения и права. Store — отдельное
      хранилище со своим жизненным циклом, оно не привязано к нити.
  - question: >
      Приложение на FastAPI, граф вызывается из асинхронных обработчиков.
      Какой чекпойнтер и как подключать?
    options:
      - text: "`AsyncPostgresSaver` с пулом соединений, созданным при старте приложения, и разовым `setup()` на деплое"
        correct: true
      - text: "`PostgresSaver` (синхронный) — он проще, а разница в производительности несущественна"
      - text: "`AsyncPostgresSaver`, создаваемый из строки подключения в каждом обработчике запроса"
      - text: "`InMemorySaver` в проде допустим, если процесс перезапускается редко"
    explanation: >
      В асинхронном приложении синхронный чекпойнтер блокирует цикл событий на
      каждом шаге графа — это проявляется как общая деградация, а не как
      медленный агент. Новое соединение на каждый запрос упирается в лимиты
      базы: пул создаётся один раз при старте. `InMemorySaver` теряет все
      разговоры при любом перезапуске, включая деплой.
  - question: >
      Наставник начисляет баллы и отмечает урок пройденным. Какой режим
      `durability` выбрать и почему?
    options:
      - text: "`sync`: снимок пишется до начала следующего шага, поэтому после сбоя видно, что именно успело выполниться"
        correct: true
      - text: "`async`: разница только в скорости, надёжность одинаковая"
      - text: "`exit`: запись один раз в конце снижает нагрузку на базу"
      - text: Режим не важен, достаточно обернуть узел политикой повторов
    explanation: >
      При необратимых действиях цена потери последнего снимка — неизвестность:
      начислены баллы или нет. `sync` эту неизвестность убирает ценой задержки
      шага. `async` (режим по умолчанию) как раз допускает потерю последнего
      снимка при падении, а `exit` теряет весь прогресс запуска. Повторы решают
      другую задачу — временные сбои — и сами по себе ничего не сохраняют.
  - question: >
      Нужно вернуть граф к состоянию перед узлом `answer` и пройти его заново с
      изменённым промптом. Что для этого делают?
    options:
      - text: Находят нужный снимок в `get_state_history` и вызывают граф с `None` на входе и конфигурацией этого снимка
        correct: true
      - text: Вызывают `update_state` с полным состоянием из снимка и запускают граф обычным образом
      - text: Удаляют поздние снимки нити, после чего последний снимок становится текущим
      - text: Создают новую нить и копируют в неё значения из снимка
    explanation: >
      Конфигурация снимка содержит `checkpoint_id`, и запуск с ней означает
      «продолжи отсюда»; вход `None` говорит «ничего не добавляй». Остальные
      варианты — обходные пути, которые теряют либо план выполнения (`next`),
      либо историю: возврат во времени ничего не удаляет, старые снимки
      остаются на месте.
  - question: >
      Что правильно хранить в Store, а не в состоянии нити?
    options:
      - text: Наблюдение «студент путает редьюсер с маршрутизатором», сделанное после проверки ДЗ
        correct: true
      - text: Результаты тестов и список пройденных уроков
      - text: Историю сообщений текущего разговора
      - text: Текст урока, загруженный для ответа
    explanation: >
      Store — для выводов агента, которые должны пережить конец разговора.
      Результаты тестов и прогресс — данные платформы: они уже есть в её
      таблицах, и агент берёт их инструментом, а не дублирует. История сообщений
      живёт в состоянии нити, а текст урока вообще не стоит хранить — его
      дешевле перечитать по идентификатору, чем возить в каждом чекпойнте.
  - question: >
      После добавления подрезки истории провайдер начал возвращать ошибку о
      несоответствии сообщений. Наиболее вероятная причина?
    options:
      - text: Обрезка удалила сообщение с вызовом инструмента, оставив ответ инструмента без пары
        correct: true
      - text: "`RemoveMessage` не поддерживается редьюсером `add_messages`"
      - text: Удалённые сообщения остались в чекпойнте и попадают в запрос
      - text: Число оставленных сообщений должно быть чётным
    explanation: >
      Протокол требует, чтобы на каждый вызов инструмента был ответ с тем же
      идентификатором; обрезка по счётчику легко разрывает эту пару, и ошибка
      приходит со стороны провайдера, хотя причина в вашем коде. `add_messages`
      как раз умеет удалять по `RemoveMessage` — на этом обрезка и построена.
      Чекпойнт хранит состояние после применения редьюсера, то есть уже без
      удалённых сообщений, а чётность числа сообщений ни на что не влияет.
