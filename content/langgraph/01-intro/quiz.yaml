pass_score: 70
questions:
  - question: >
      Скрипт раз в сутки берёт текст поддержки, одним вызовом модели извлекает из
      него поля и пишет строку в базу. Ветвлений нет, инструментов нет. Что даст
      перенос этого скрипта на LangGraph?
    options:
      - text: Ничего полезного — задача решается обычной функцией
        correct: true
      - text: Ответы модели станут точнее за счёт явного состояния
      - text: Вызов модели станет дешевле, потому что граф кеширует шаги
      - text: Появится автоматическая обработка ошибок провайдера
    explanation: >
      Граф окупается там, где есть цикл, ветвление, сохранение состояния между
      запусками или пауза для человека. Здесь нет ничего из этого. Вариант про
      точность соблазнителен, но качество ответа определяют модель, промпт и
      инструменты — оркестратор на него не влияет. Кеш узлов и политики повторов
      в LangGraph есть, но это настройки, которые надо задать руками, а не
      бесплатный эффект переноса.
  - question: >
      Чем `create_agent` из LangChain отличается от графа, собранного на LangGraph?
    options:
      - text: Это заранее собранный граф с фиксированной схемой «модель ↔ инструменты»; LangGraph — то, из чего такие графы собирают
        correct: true
      - text: Это другая библиотека исполнения, не связанная с LangGraph
      - text: Он работает без сохранения состояния и потому не поддерживает чекпойнты в принципе
      - text: Он предназначен для одного вызова модели, а LangGraph — для нескольких
    explanation: >
      `create_agent` возвращает готовый граф с типовым ReAct-циклом, исполняемый
      тем же движком LangGraph, поэтому чекпойнты и прерывания ему доступны —
      вариант про «не поддерживает в принципе» неверен именно поэтому. И он точно
      не про один вызов: цикл «модель ↔ инструменты» — это много вызовов.
      Разница не в возможностях исполнения, а в том, кто задаёт структуру: в
      `create_agent` она фиксирована, в собственном графе её пишете вы.
  - question: >
      Агент живёт в веб-приложении. Пользователь задал вопрос, агент вызвал два
      инструмента, и в этот момент сервер перезапустился при деплое. Что должно
      быть устроено в приложении, чтобы разговор продолжился с того же места?
    options:
      - text: Состояние описано явно и сохраняется внешним хранилищем после каждого шага
        correct: true
      - text: Цикл агента вынесен в фоновый поток, который переживает перезапуск процесса
      - text: История сообщений накапливается в списке внутри обработчика запроса
      - text: Модель вызывается с включённым стримингом, поэтому ответ можно догенерировать
    explanation: >
      Продолжить можно только то, что записано за пределами процесса, — отсюда
      явное состояние и чекпойнты. Фоновый поток живёт внутри того же процесса и
      умирает вместе с ним. Список в обработчике — ровно тот случай, который
      теряется. Стриминг определяет, как ответ доставляется клиенту, и к
      восстановлению после сбоя отношения не имеет.
  - question: >
      Какие утверждения о границах LangGraph верны?
    options:
      - text: Узел — это обычная функция, и LangGraph не обязывает вызывать в ней именно LangChain
        correct: true
      - text: Векторный поиск и нарезка документов реализуются средствами самого LangGraph
      - text: Выполнение независимых веток параллельно движок берёт на себя, если они описаны как независимые
        correct: true
      - text: LangGraph заменяет очередь задач и планировщик в приложении
    explanation: >
      Узлы — обычные функции, поэтому библиотека не диктует, что внутри; и движок
      действительно сам исполняет независимые ветки параллельно, потому что видит
      структуру переходов. А вот RAG в LangGraph не входит: векторная база и
      нарезка — ваш код внутри узла. Планировщика в библиотеке тоже нет —
      фоновые прогоны по расписанию появляются только на уровне сервера
      LangGraph, то есть отдельного слоя.
  - question: >
      Что в графе LangGraph отвечает за правила перехода между шагами?
    options:
      - text: Рёбра, в том числе условные
        correct: true
      - text: Состояние графа
      - text: Чекпойнтер
      - text: Редьюсеры полей состояния
    explanation: >
      Переходы задают рёбра: обычные — безусловный переход, условные — выбор
      следующего узла функцией. Состояние хранит данные, но само никуда не
      переводит. Чекпойнтер сохраняет снимки состояния, редьюсер решает, как
      объединить обновление поля с текущим значением, — оба к маршрутизации
      отношения не имеют.
