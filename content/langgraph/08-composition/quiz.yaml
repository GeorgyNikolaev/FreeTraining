pass_score: 70
questions:
  - question: >
      Подграф подключён к родителю напрямую (скомпилированным объектом вместо
      функции-узла). Как между ними передаётся состояние?
    options:
      - text: По совпадающим именам полей; обновления подграфа применяются к родительскому состоянию через его редьюсеры
        correct: true
      - text: "Целиком: подграф получает копию всего состояния родителя независимо от своей схемы"
      - text: "Никак: подграф всегда работает на своей изолированной схеме, обмен только через возвращаемое значение"
      - text: Через контекст запуска, который надо передать подграфу явно
    explanation: >
      Прямое подключение связывает графы по именам полей — отсюда и удобство, и
      главная опасность: одноимённое поле с другим смыслом свяжется молча.
      Изоляция появляется, когда подграф оборачивают функцией и переводят
      состояние руками. Контекст запуска передаётся вниз, но состояние не несёт.
  - question: >
      Узел подграфа возвращает `Command(goto="explain", graph=Command.PARENT)`,
      где `explain` — узел родителя. Что произойдёт при аннотации этого узла как
      `Command[Literal["explain"]]`?
    options:
      - text: "Подграф не скомпилируется: движок будет искать узел `explain` внутри него"
        correct: true
      - text: "Ничего: аннотация нужна только для отрисовки схемы"
      - text: Управление уйдёт в узел `explain` подграфа, если он есть, иначе в родительский
      - text: Компиляция пройдёт, но переход будет проигнорирован
    explanation: >
      Аннотация целей — это указание движку построить рёбра **в текущем графе**,
      поэтому имя родительского узла превращается в ребро к несуществующему узлу
      и компиляция падает («Found edge ending at unknown node»). Для передачи
      наверх аннотацию просто не ставят. Молчаливого игнорирования перехода при
      этом не бывает.
  - question: >
      Интерфейс показывает «наставник думает» и замирает на всё время проверки
      ДЗ, хотя внутри подграфа отправляются свои события. Почему?
    options:
      - text: Стрим вызван без `subgraphs=True`, поэтому события вложенного графа наружу не выходят
        correct: true
      - text: Подграфу нужен собственный чекпойнтер, без него события не формируются
      - text: "`get_stream_writer` не работает внутри подграфов"
      - text: Родительский граф должен объявлять поля подграфа в своей схеме
    explanation: >
      По умолчанию родитель отдаёт один элемент на весь вложенный граф — события
      внутри него видны только с флагом `subgraphs=True`, и тогда к ним
      добавляется путь до узла. Отдельный чекпойнтер подграфу не нужен (он
      пользуется родительским), отправка событий изнутри работает, а схема
      родителя на стрим не влияет.
  - question: >
      Что является достаточным основанием для разделения одного агента на
      нескольких?
    options:
      - text: Инструментов стало больше десятка, и модель начинает выбирать не те
        correct: true
      - text: Ролям нужны разные системные промпты, а иногда и разные модели
        correct: true
      - text: Так система выглядит современнее и лучше масштабируется
      - text: Нужно, чтобы разные части работали параллельно
    explanation: >
      Оба верных варианта — про ограничения модели: длинный список инструментов
      ухудшает выбор, а противоречивые инструкции невозможно уместить в один
      промпт. «Современнее» — не аргумент: каждое разделение добавляет вызовы и
      задержку. Параллельность же достигается веером `Send` внутри одного агента
      и отдельных агентов не требует.
  - question: >
      Чем схема «рой» (агенты передают управление друг другу) отличается от
      схемы с супервизором?
    options:
      - text: В рое нет промежуточного вызова модели на каждую передачу, но решение о маршрутизации размазано по агентам
        correct: true
      - text: В рое агенты работают параллельно, а у супервизора — последовательно
      - text: Рой не требует чекпойнтера, так как активный агент хранится в памяти процесса
      - text: Супервизор умеет передавать управление подграфам, а рой — только готовым агентам
    explanation: >
      Разница в том, кто принимает решение: у супервизора это отдельный агент
      (лишний вызов модели, зато одна точка отладки), в рое — текущий агент
      (дешевле, но решение размазано). Параллельности ни та, ни другая схема
      сама по себе не даёт; активный агент хранится в состоянии, то есть
      чекпойнтер нужен; и обе схемы работают с любыми графами.
  - question: >
      Процесс ночного обхода курса линейный: для каждого урока — проверка, в
      конце — отчёт. Нужны надёжность и возобновление после сбоя, ветвлений нет.
      Что выбрать?
    options:
      - text: "Functional API: `@entrypoint` с параллельными `@task`"
        correct: true
      - text: Граф с веером `Send` и узлом-сборщиком — так надёжнее
      - text: "Обычный скрипт с повторами: чекпойнты здесь ничего не дают"
      - text: Мультиагентную схему с супервизором по урокам
    explanation: >
      Functional API даёт те же чекпойнты, параллельность и возобновление, но без
      схемы состояния и рёбер, которых здесь нечем занять. Граф с `Send` решит
      задачу не хуже, но потребует описывать редьюсеры и сборщик ради процесса
      без единого ветвления. Обычный скрипт как раз теряет главное — после сбоя
      придётся пересчитывать всё, а супервизор добавит вызовы модели без всякой
      пользы.
  - question: >
      При возобновлении прогона, написанного на Functional API, что выполняется
      заново?
    options:
      - text: Тело функции `@entrypoint` целиком, но результаты уже выполненных `@task` берутся из сохранённых
        correct: true
      - text: Только те задачи, которые не успели завершиться; тело функции не перезапускается
      - text: Всё целиком, включая уже выполненные задачи
      - text: "Ничего: прогон продолжается ровно с той строки, где прервался"
    explanation: >
      Механизм тот же, что и при возобновлении узла после прерывания: код
      проходит с начала, а дорогая работа не повторяется, потому что результаты
      задач сохранены. Отсюда главное требование к телу функции — никаких
      побочных эффектов и недетерминированности: повторный проход должен
      приводить к тем же вызовам задач.
