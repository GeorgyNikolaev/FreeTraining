pass_score: 70
questions:
  - question: >
      Узел отмечает урок пройденным, а затем через `interrupt` спрашивает
      подтверждение. Что произойдёт после `Command(resume=...)`?
    options:
      - text: "Урок будет отмечен дважды: узел выполняется заново с первой строки"
        correct: true
      - text: Выполнение продолжится со строки после `interrupt`, отметка останется одна
      - text: Движок откатит изменения, сделанные до прерывания, и выполнит узел заново
      - text: Возобновление завершится ошибкой, так как узел изменил состояние до прерывания
    explanation: >
      После возобновления узел исполняется с начала — продолжения «со строки
      после interrupt» в LangGraph нет, и это проверяется счётчиком вызовов.
      Отката движок не делает: он не знает о записях в вашу базу. Ошибки тоже не
      будет — поведение штатное, и именно поэтому всё необратимое ставят после
      прерывания.
  - question: >
      Чем `interrupt_before=["answer"]` отличается от вызова `interrupt` внутри
      узла?
    options:
      - text: Статическая пауза не передаёт человеку никакого значения, и в результате запуска нет ключа `__interrupt__`
        correct: true
      - text: Статическая пауза возобновляется вызовом с входом `None`, а не `Command(resume=...)`
        correct: true
      - text: Статическая пауза работает без чекпойнтера
      - text: Статическая пауза останавливает граф после выполнения узла, а не до него
    explanation: >
      Статическая остановка — инструмент отладки: она ничего не показывает
      человеку, её видно только по непустому `next` в снимке, и продолжается она
      обычным вызовом с `None`. Чекпойнтер нужен обоим механизмам одинаково:
      пауза — это сохранённое состояние. А останавливаться после узла тоже можно
      — но это уже `interrupt_after`, отдельный параметр.
  - question: >
      Человек отклонил вызов инструмента `reset_progress`. Что обязательно
      сделать, прежде чем вернуть управление модели?
    options:
      - text: Добавить `ToolMessage` с тем же `tool_call_id` и текстом отказа
        correct: true
      - text: Удалить из истории сообщение модели с этим вызовом
      - text: "Ничего: модель сама поймёт, что инструмент не выполнялся"
      - text: Записать отказ в долговременную память студента
    explanation: >
      Протокол требует ответа на каждый вызов инструмента, поэтому отказ
      оформляется как обычный результат — сообщением с тем же идентификатором
      вызова. Удаление сообщения модели ломает историю сильнее, чем лечит.
      Сама по себе модель ничего не узнает: для неё вызов останется без ответа.
      Запись в память — про другое и обязательной не является.
  - question: >
      Два параллельных узла одновременно вызвали `interrupt`. Как правильно
      возобновить граф?
    options:
      - text: Передать в `resume` словарь, где ключ — идентификатор прерывания, а значение — ответ на него
        correct: true
      - text: Вызвать `Command(resume=...)` дважды, по одному разу на каждое прерывание
      - text: Передать список ответов в том же порядке, в каком пришли прерывания
      - text: "Так делать нельзя: одновременные прерывания не поддерживаются"
    explanation: >
      Движок возвращает оба прерывания сразу, у каждого есть `id`, и ответы
      сопоставляются именно по нему — так ответ гарантированно попадает в нужный
      узел. Повторные вызовы и позиционный список здесь не работают, а сам
      сценарий вполне поддерживается: два независимых узла могут спросить
      человека одновременно.
  - question: >
      Приложение принимает ответ на прерывание. `thread_id` приходит из запроса
      клиента. Что здесь опаснее всего пропустить?
    options:
      - text: Проверку, что нить принадлежит текущему пользователю
        correct: true
      - text: Проверку формата значения в `resume`
        correct: true
      - text: Проверку того, что граф скомпилирован с чекпойнтером
      - text: Проверку, что с момента прерывания прошло не больше суток
    explanation: >
      Идентификатор нити выбирает клиент, поэтому без проверки владельца можно
      ответить в чужой разговор — и заодно прочитать его состояние. Значение
      `resume` — тоже внешний вход, и узел должен переживать неожиданное
      содержимое. Наличие чекпойнтера — свойство кода, а не запроса, а срок
      ожидания — вопрос политики, а не безопасности.
  - question: >
      В каком случае `interrupt` уместнее обычного встречного вопроса репликой в
      диалоге?
    options:
      - text: Проверка ДЗ идёт полминуты, позади десяток вызовов модели, и на середине выяснилось, что непонятно, какой курс имеется в виду
        correct: true
      - text: В начале разговора нужно узнать, какой у студента уровень
      - text: Нужно уточнить формулировку вопроса до того, как начать работу
      - text: Нужно показать студенту ссылку на урок и спросить, помог ли он
    explanation: >
      Прерывание окупается, когда останавливать и терять уже проделанную работу
      дорого: состояние сохранится, и после ответа граф продолжит с того же
      места. Всё, что можно спросить до начала работы или обычной репликой в
      конце, не требует остановки графа — это лишнее усложнение и лишний узел.
