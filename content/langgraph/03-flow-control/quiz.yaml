pass_score: 70
questions:
  - question: >
      Граф проверяет ДЗ веером `Send` по семи признакам, а затем сводит
      результаты узлом `summarize`. В логах видно, что `summarize` выполнился
      дважды и в первый раз увидел только часть проверок. В чём причина?
    options:
      - text: Узел-сборщик объявлен без `defer=True` и запускается при завершении каждой ведущей в него ветки
        correct: true
      - text: У поля `checks` нет редьюсера, поэтому часть результатов потерялась
      - text: Веер отправил задачи двумя партиями, так как превышен лимит параллельности
      - text: Сработала политика повторов и выполнила узел второй раз
    explanation: >
      Узел с несколькими входящими ветками по умолчанию исполняется, как только
      завершается очередная из них; `defer=True` заставляет его дождаться всех.
      Отсутствие редьюсера дало бы не частичный результат, а `InvalidUpdateError`
      на первом же запуске. Партиями веер не разбивается, а повтор бы не дал
      разного содержимого `checks` в двух вызовах.
  - question: >
      В каком случае разумнее выбрать условное ребро, а не `Command`?
    options:
      - text: Решение — это политика над состоянием («не больше двух попыток»), а узел хочется переиспользовать
        correct: true
      - text: Узел только что вызвал модель-классификатор и знает, куда идти дальше
      - text: Узел рассылает параллельные задачи через `Send`
      - text: Нужно, чтобы переход был виден на схеме графа
    explanation: >
      Условное ребро выносит решение наружу, поэтому узел не знает про соседей и
      переносится в другой граф без правок — это и есть случай политики.
      Классификатор, наоборот, естественнее оформить `Command`: результат уже в
      руках, разрывать вычисление и решение незачем. `Send` работает и с тем, и
      с другим. А видимость на схеме не аргумент: `Command` попадает на схему
      при указании `Literal` или `destinations`.
  - question: >
      Узел `check_criterion` запускается через `Send` с полезной нагрузкой
      `{"criterion": "..."}`. Внутри узел читает `state["submission"]`. Что
      произойдёт?
    options:
      - text: "`KeyError`: узел веера видит только то, что положено в `Send`"
        correct: true
      - text: Узел получит `submission` из общего состояния графа
      - text: Значение будет `None`, и проверка отработает вхолостую
      - text: Ошибка компиляции графа из-за несовпадения схем
    explanation: >
      Задача, созданная через `Send`, получает ровно переданный словарь как своё
      состояние — общего состояния графа у неё нет (проверено на langgraph
      1.2.11). Поэтому обращение к непереданному ключу даёт `KeyError`, а не
      `None` и не подстановку из графа. Компиляция тут ни при чём: состав
      полезной нагрузки известен только на исполнении.
  - question: >
      Узел ходит в API провайдера моделей. Какая политика повторов уместна?
    options:
      - text: "`RetryPolicy(max_attempts=3, retry_on=(ConnectionError, TimeoutError), jitter=True)`"
        correct: true
      - text: "`RetryPolicy(max_attempts=5)` без `retry_on` — так надёжнее, повторится любая ошибка"
      - text: "`RetryPolicy(max_attempts=3, initial_interval=0)` — паузы только увеличивают задержку для пользователя"
      - text: Повторы не нужны, достаточно обработчика ошибки
    explanation: >
      Повторять имеет смысл только то, что проходит само, поэтому `retry_on`
      ограничивают сетевыми и временными ошибками, а `jitter` разносит повторы
      во времени. Политика без `retry_on` трижды повторит и вашу собственную
      опечатку, отложив сообщение о ней. Нулевая пауза бьёт в тот же сбойный
      сервис мгновенно — именно то, от чего защищает выдержка. Обработчик
      ошибки решает другую задачу: он срабатывает, когда повторы уже исчерпаны.
  - question: >
      Синхронному узлу задали `timeout=30`. Что произойдёт?
    options:
      - text: "Ошибка ещё до исполнения: таймауты поддерживаются только для асинхронных узлов"
        correct: true
      - text: Узел будет прерван через 30 секунд с `NodeTimeoutError`
      - text: Таймаут будет молча проигнорирован
      - text: Узел прервётся, но только если внутри него есть операции ввода-вывода
    explanation: >
      Безопасно прервать синхронную функцию в том же процессе нельзя, и движок
      сообщает об этом прямо: «Node timeouts are only supported for async nodes».
      Молчаливого игнорирования нет — это была бы ложная защита. Прерывание с
      `NodeTimeoutError` вы получите, переписав узел через `async def`.
  - question: >
      Что верно про совместную работу повторов и обработчика ошибки на одном узле?
    options:
      - text: Обработчик вызывается после того, как исчерпаны все попытки
        correct: true
      - text: Обработчик получает сведения о сбое, если объявить параметр с типом `NodeError`
        correct: true
      - text: Обработчик вызывается при каждой неудачной попытке
      - text: Если падает сам обработчик, движок вызовет его повторно по той же политике
    explanation: >
      Порядок именно такой: сначала повторы, потом обработчик — иначе повторы
      теряли бы смысл. Сведения о сбое (имя узла и исключение) приходят через
      параметр, аннотированный `NodeError`. Падение самого обработчика роняет
      запуск: второго круга защиты нет, и это сознательное решение — иначе
      ошибка в обработчике превращалась бы в бесконечный цикл.
  - question: >
      Граф крутится в цикле «ответ → проверка → ответ» и падает с
      `GraphRecursionError`. Что правильнее сделать?
    options:
      - text: Найти, почему условие выхода не срабатывает, и ограничить число попыток полем в состоянии
        correct: true
      - text: Увеличить `recursion_limit` до заведомо большого значения
      - text: Убрать цикл и оставить одну попытку
      - text: Перевести цикл на `Send`, чтобы попытки шли параллельно
    explanation: >
      `recursion_limit` — предохранитель, а не механизм управления: логика
      «сколько раз пробовать» должна жить в состоянии и в маршрутизаторе.
      Увеличение лимита только отодвигает падение и делает его дороже — в
      langgraph 1.2.11 лимит по умолчанию и так 10007 шагов. Отказ от цикла
      выбрасывает работающую функциональность из-за ошибки в условии. `Send`
      здесь не поможет: попытки переписать ответ зависят друг от друга, а веер
      предназначен для независимых задач.
