title: "LangGraph: агенты, которые переживают перезапуск"
description: >
  Курс про LangGraph 1.x: состояние, графы, инструменты, чекпойнты, человек в
  цикле, стриминг и деплой. Всё изучаемое сразу наращивается в одном сквозном
  примере — агенте-наставнике для этой платформы.
tags: [LangGraph, агенты, LLM, Python]
level: intermediate
prerequisites:
  - Уверенно пишет на Python 3.12: аннотации типов, TypedDict, Annotated, dataclass
  - Пишет асинхронный код: async/await, asyncio.gather, асинхронные генераторы
  - Понимает вызов инструментов (tool calling): как модель возвращает вызов и что ей нужно вернуть обратно
  - Понимает структурированный вывод по JSON-схеме или Pydantic-модели
  - Читает код FastAPI: роутеры, зависимости, Pydantic-схемы
  - Работает с PostgreSQL через готовый клиент и умеет читать SQL
  - Имеет ключ к API какого-либо провайдера моделей (в курсе используется OpenAI)
