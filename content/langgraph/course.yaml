title: "LangGraph: агенты, которые переживают перезапуск"
description: >
  Курс про LangGraph 1.x: состояние, графы, инструменты, чекпойнты, человек в
  цикле, стриминг и деплой. Всё изучаемое сразу наращивается в одном сквозном
  примере — агенте-наставнике для этой платформы.
tags: [LangGraph, агенты, LLM, Python]
level: intermediate
prerequisites:
  - "Уверенно Python 3.12: аннотации типов, TypedDict, Annotated, dataclass"
  - "Асинхронный код: async/await, asyncio.gather, асинхронные генераторы"
  - "Вызов инструментов (tool calling): как модель возвращает вызов и что ей нужно вернуть обратно"
  - "Структурированный вывод по JSON-схеме или Pydantic-модели"
  - "FastAPI: роутеры, зависимости, Pydantic-схемы"
  - "PostgreSQL через готовый клиент и умеет читать SQL"
  - "Иметь ключ к API какого-либо провайдера моделей (в курсе используется OpenAI)"
