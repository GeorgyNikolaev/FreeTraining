pass_score: 70
questions:
  - question: >
      Агент собран: инструменты переданы в `ToolNode`, маршрутизация через
      `tools_condition`, ребро `tools → model` на месте. Но модель ни разу не
      вызывает инструменты и отвечает по общим знаниям. Что проверить в первую
      очередь?
    options:
      - text: Вызван ли `bind_tools` на модели
        correct: true
      - text: Правильно ли работает `tools_condition`
      - text: Не превышен ли `recursion_limit`
      - text: Совпадает ли схема состояния с `MessagesState`
    explanation: >
      Модель узнаёт о существовании инструментов только из `bind_tools`: без
      него в запросе к провайдеру их просто нет, и вызвать инструмент она не
      может физически. `tools_condition` здесь ни при чём — ему нечего
      маршрутизировать, раз вызовов нет. Лимит шагов дал бы ошибку, а не
      спокойный ответ; схема состояния на видимость инструментов не влияет.
  - question: >
      Инструмент `get_progress` должен вернуть прогресс текущего студента. Как
      правильно передать ему идентификатор?
    options:
      - text: Через `ToolRuntime` — из состояния или контекста запуска
        correct: true
      - text: Аргументом инструмента, который заполнит модель по системному промпту
      - text: Через глобальную переменную, выставляемую перед вызовом графа
      - text: Добавить идентификатор в текст каждого сообщения пользователя
    explanation: >
      Аргументы инструмента заполняет модель, а на модель влияет текст вопроса —
      значит, идентификатор в аргументах можно подменить фразой «покажи прогресс
      студента u-1». Данные, определяющие доступ, должны приходить из состояния
      или контекста, куда их положил ваш код. Глобальная переменная ломается при
      параллельных запросах, а идентификатор в тексте сообщения — тот же
      подменяемый аргумент, только в профиль.
  - question: >
      Инструмент возвращает `Command(update={"sources": [lesson_id]})` и ничего
      больше. Что произойдёт?
    options:
      - text: Поле `sources` обновится, но вызов инструмента останется без ответа, и следующий запрос к модели, скорее всего, упадёт
        correct: true
      - text: Движок сам добавит `ToolMessage` с содержимым `update`
      - text: Граф упадёт сразу при возврате `Command` из инструмента
      - text: "Обновление будет проигнорировано: инструменты не могут менять состояние"
    explanation: >
      Возврат `Command` отключает автоматическую упаковку результата: `ToolMessage`
      с нужным `tool_call_id` создаёт сам инструмент. Без него в истории остаётся
      `tool_call` без ответа, а протокол провайдеров требует ответа на каждый
      вызов. Менять состояние инструменты как раз могут — ради этого `Command` и
      возвращают.
  - question: >
      Что произойдёт при исключении внутри инструмента, если у `ToolNode` не
      задан `handle_tool_errors`?
    options:
      - text: Исключение пробрасывается наружу и роняет запуск графа
        correct: true
      - text: Модель получит `ToolMessage` с текстом исключения
      - text: Инструмент будет автоматически повторён
      - text: Вызов молча вернёт пустой результат
    explanation: >
      Значение по умолчанию — пробросить ошибку: сбой не должен проходить
      незамеченным. Превращение исключения в сообщение для модели включается
      явно (`handle_tool_errors=True`, строка или функция); повторы задаются
      отдельно — политикой повторов или middleware. Молчаливого пустого
      результата нет ни при каких настройках.
  - question: >
      Что из перечисленного правильно класть в контекст запуска (`context_schema`),
      а не в состояние?
    options:
      - text: Идентификатор студента и его права
        correct: true
      - text: Пул соединений к базе и клиенты внешних сервисов
        correct: true
      - text: Историю сообщений диалога
      - text: Счётчик попыток переписать ответ
    explanation: >
      В контекст идёт то, что задаётся на запуск и не меняется узлами:
      идентификаторы, права, зависимости. История сообщений и счётчик попыток —
      это ровно то, что узлы меняют и что должно пережить перезапуск, поэтому им
      место в состоянии: контекст в чекпойнт не попадает.
  - question: >
      В каком случае `create_agent` перестаёт быть подходящим решением и нужен
      свой граф?
    options:
      - text: Перед вызовом модели нужен собственный шаг — классификация вопроса и загрузка контекста
        correct: true
      - text: Нужно ограничить число вызовов модели за запуск
      - text: Нужна память между сессиями
      - text: Нужен структурированный ответ вместо текста
    explanation: >
      Фабрика задаёт форму процесса — цикл «модель ↔ инструменты»; собственный
      шаг до модели в эту форму не вписывается, и это настоящая граница.
      Остальное настраивается, не выходя из фабрики: ограничение вызовов — это
      middleware, память — параметры `checkpointer` и `store`, структурированный
      ответ — `response_format`.
  - question: >
      Какие ограничения есть у инструментов, подключённых с внешнего MCP-сервера?
    options:
      - text: Им недоступно состояние графа, поэтому данные конкретного студента через них получать нельзя
        correct: true
      - text: Их описания приходят извне и становятся частью промпта, то есть влияют на поведение агента
        correct: true
      - text: Они не могут возвращать результат в модель и годятся только для побочных действий
      - text: Их нельзя использовать вместе с собственными инструментами в одном агенте
    explanation: >
      Внешний сервер ничего не знает про ваше состояние и `ToolRuntime` ему
      недоступен — всё, что связано с правами и данными студента, остаётся
      вашим кодом. И да, описания инструментов — это текст, попадающий в промпт:
      отсюда требование доверять серверу так же, как своему коду. При этом
      результаты они возвращают как обычные инструменты и спокойно соседствуют
      со своими в одном списке.
