pass_score: 70
questions:
  - question: >
      Узел должен заполнять поле `context`, но в возвращаемом словаре опечатка:
      `return {"contex": text}`. Что произойдёт при запуске графа?
    options:
      - text: Граф отработает без ошибок, а `context` останется прежним
        correct: true
      - text: Компиляция графа завершится ошибкой о несуществующем поле
      - text: Движок бросит `InvalidUpdateError` в момент применения обновления
      - text: Поле `contex` будет добавлено в состояние динамически
    explanation: >
      Ключ, которого нет в схеме, движок отбрасывает молча — ни при компиляции,
      ни при исполнении ошибки не будет (проверено на langgraph 1.2.11). Именно
      поэтому опечатка так опасна: граф «работает», а модель отвечает без
      подложенного контекста. `InvalidUpdateError` — про другое: он возникает,
      когда два узла одного шага пишут в одно поле без редьюсера.
      Динамически поля не добавляются: схема фиксирует набор полей.
  - question: >
      Два узла выполняются параллельно, и оба возвращают `{"sources": [...]}`.
      Поле объявлено как `sources: list[str]`. Что произойдёт и как это чинится?
    options:
      - text: Запуск упадёт с `InvalidUpdateError`; нужно объявить поле через `Annotated` с редьюсером
        correct: true
      - text: Запуск упадёт; нужно развести узлы по разным шагам, редьюсер тут не поможет
      - text: Победит значение узла, завершившегося последним
      - text: "Значения объединятся: для списков конкатенация используется по умолчанию"
    explanation: >
      Движок не выбирает между двумя значениями и сообщает об этом прямо:
      «At key 'sources': Can receive only one value per step. Use an Annotated
      key to handle multiple values». Редьюсер решает проблему, поэтому
      разводить узлы по шагам не требуется. Варианты про «победит последний» и
      «конкатенация по умолчанию» описывают поведение, которого нет: по
      умолчанию обновление заменяет значение, а при параллельной записи это
      ошибка, а не гонка.
  - question: >
      Поле объявлено как `sources: Annotated[list[str], add]`. Начался новый
      вопрос, и узел возвращает `{"sources": []}`, чтобы очистить список. Что
      окажется в состоянии?
    options:
      - text: Прежний список без изменений
        correct: true
      - text: Пустой список — присваивание пустого значения сбрасывает поле
      - text: "`None`"
      - text: Ошибка редьюсера
    explanation: >
      Редьюсер получает текущее значение и обновление и возвращает их сумму:
      `старое + []` — это старое. Поле с накопительным редьюсером в принципе
      нельзя сбросить обычным возвратом значения: сброс нужно предусмотреть в
      самом редьюсере (например, трактовать пустой список как команду очистки).
      Ошибки не будет — `add` для списков определён.
  - question: >
      Поле `messages` использует редьюсер `add_messages`. Узел возвращает
      сообщение, у которого `id` совпадает с уже лежащим в истории. Что сделает
      редьюсер?
    options:
      - text: Заменит существующее сообщение, сохранив его место в истории
        correct: true
      - text: Добавит новое сообщение в конец списка
      - text: Бросит ошибку о дублирующемся идентификаторе
      - text: Оставит историю без изменений
    explanation: >
      Совпадение `id` — это сигнал «перепиши то сообщение», и порядок истории
      при этом не меняется. На этом держится, например, редактирование уже
      выданного ответа. Добавление в конец происходит с новым или отсутствующим
      `id` (во втором случае идентификатор сгенерируется). Ошибки о дубликате
      нет: замена по `id` — штатное поведение, а не исключительная ситуация.
  - question: >
      Функция-маршрутизатор возвращает имя узла, но не имеет аннотации `Literal`
      и передана без карты путей. Что при этом ломается?
    options:
      - text: "Схема графа: условные переходы пропадают с отрисованной диаграммы и из Studio"
        correct: true
      - text: "Исполнение: движок не сможет найти нужный узел и упадёт"
      - text: "Ничего: аннотация и карта путей нужны только проверке типов"
      - text: "Чекпойнты: без карты путей движок не сможет сохранить выбранную ветку"
    explanation: >
      Исполняется такой граф нормально — движок берёт узел по возвращённому
      имени. Теряется структура: не зная заранее возможных целей, движок не
      может нарисовать рёбра, и на схеме ветвления просто нет (проверено на
      langgraph 1.2.11). Это бьёт по Studio и по чтению графа глазами, а не по
      проверке типов и не по сохранению состояния.
  - question: >
      В графе задана `output_schema`, куда `context` не входит. Какие выводы
      верны?
    options:
      - text: "`invoke` вернёт ответ без поля `context`"
        correct: true
      - text: "`context` всё равно хранится в состоянии и попадёт в снимок состояния"
        correct: true
      - text: Узлы внутри графа перестанут видеть `context`
      - text: Значение `context` не будет передаваться в LangSmith при трейсинге
    explanation: >
      Схема выхода — это фильтр результата `invoke`, и только. Внутри графа узлы
      работают с полной схемой состояния, значение сохраняется в снимках и видно
      в трейсе. Отсюда практическое следствие: прятать чувствительные данные
      через `output_schema` бессмысленно — в состоянии им не место в принципе.
  - question: >
      Узел `a` записал `log = ["a"]`, после него параллельно запускаются `b` и
      `c`, каждый дописывает свою метку. Что увидит узел `c` в поле `log` в
      момент своего выполнения?
    options:
      - text: "`[\"a\"]` — результат узла `b` того же шага ему не виден"
        correct: true
      - text: "`[\"a\", \"b\"]`, если `b` успел завершиться раньше"
      - text: "Пустой список: параллельные ветки получают чистое состояние"
      - text: "`[\"a\", \"b\"]` всегда: обновления применяются сразу же"
    explanation: >
      Движок выполняет граф шагами: узлы одного шага получают состояние,
      зафиксированное на его начало, а все их обновления применяются разом по
      завершении шага. Поэтому `c` видит только результат предыдущего шага, и
      зависимости от того, кто успел раньше, нет — иначе поведение графа было бы
      невоспроизводимым. Чистого состояния параллельные ветки тоже не получают:
      это то же самое состояние, а не копия с нуля.
