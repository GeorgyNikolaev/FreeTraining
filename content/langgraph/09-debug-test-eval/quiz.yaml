pass_score: 70
questions:
  - question: >
      Какой тест агента наиболее устойчив к смене версии модели и при этом
      реально что-то проверяет?
    options:
      - text: Ответ содержит ссылку на существующий урок, а число вызовов модели не превысило лимит
        correct: true
      - text: Текст ответа содержит слово «редьюсер»
      - text: Ответ совпадает с эталонной строкой посимвольно
      - text: Длина ответа находится в диапазоне от 200 до 400 символов
    explanation: >
      Проверяются свойства, которые обязан обеспечивать ваш граф, а не
      формулировки модели: структура ответа и ограничение цикла. Остальные
      варианты меряют текст, который меняется от версии модели и температуры, —
      такие тесты краснеют без всякой поломки и быстро перестают читаться.
  - question: >
      Зачем в тестах подменять модель заранее заданными ответами, если можно
      вызывать настоящую?
    options:
      - text: Тесты становятся быстрыми, детерминированными и не требуют ключа провайдера в CI
        correct: true
      - text: Фейковая модель позволяет проверить качество формулировок без затрат
      - text: Настоящая модель не поддерживает вызов инструментов в тестовой среде
      - text: Только так можно проверить маршрутизацию графа
    explanation: >
      Подмена решает три конкретные проблемы: скорость, воспроизводимость и
      отсутствие ключей в CI. Качество формулировок она как раз не проверяет —
      это задача оценки на датасете. Настоящая модель прекрасно вызывает
      инструменты, а маршрутизатор вообще тестируется как обычная функция, без
      всякой модели.
  - question: >
      Что обязательно проверить в тесте узла, содержащего `interrupt`?
    options:
      - text: Что побочное действие после возобновления выполняется один раз
        correct: true
      - text: Что неожиданное значение в `resume` не ломает узел
        correct: true
      - text: Что значение прерывания сохраняется в долговременной памяти
      - text: Что узел завершает работу быстрее заданного таймаута
    explanation: >
      Узел после возобновления исполняется заново, поэтому удвоение побочного
      действия — самая вероятная поломка, и ловится она счётчиком. Значение
      `resume` приходит снаружи и может быть любым — второй обязательный тест.
      В долговременную память прерывания не пишутся, а таймауты к этому узлу
      отношения не имеют.
  - question: >
      Из чего должен состоять датасет для оценки наставника?
    options:
      - text: Из реальных вопросов студентов и реальных решений ДЗ, включая неудачные
        correct: true
      - text: Из случаев, на которых агент сейчас ошибается, наряду с теми, где он справляется
        correct: true
      - text: Из максимально большого числа сгенерированных моделью вопросов
      - text: Только из случаев, которые агент проходит успешно, — иначе метрика будет низкой
    explanation: >
      Ценность датасета в том, что он описывает настоящих пользователей и
      показывает, куда двигаться: полностью зелёный набор не даёт направления.
      Сгенерированные вопросы описывают представления модели о теме, а отбор
      только успешных случаев превращает измерение в самоуспокоение.
  - question: >
      Что делает оценку моделью-судьёй пригодной для сравнения версий промпта?
    options:
      - text: Бинарные критерии с точной формулировкой вместо балла от 1 до 10
        correct: true
      - text: Передача судье материала, по которому он должен проверять ответ
        correct: true
      - text: Использование той же модели и того же промпта, что и у самого агента
      - text: Усреднение оценки по трём запускам судьи с разной температурой
    explanation: >
      Судья годится, когда его решения воспроизводимы: бинарный критерий даёт
      стабильный ответ, а числовая шкала плывёт от запуска к запуску. И судить
      «опирается ли ответ на урок» без текста урока нельзя — иначе оценивается
      складность речи. Брать ровно тот же промпт, что у агента, бессмысленно
      (судья решает другую задачу), а усреднение шумной оценки шум не убирает.
  - question: >
      Почему прогон по датасету не стоит ставить в CI на каждый коммит?
    options:
      - text: "Это десятки настоящих вызовов модели: долго и дорого; место такой проверки — перед выкаткой изменений промптов и графа"
        correct: true
      - text: Результаты оценки недетерминированы, поэтому сравнивать прогоны бессмысленно
      - text: Оценка требует доступа к персональным данным студентов
      - text: Датасет меняется слишком часто, чтобы метрики имели смысл
    explanation: >
      Цена и время — реальные ограничения: обычные тесты на фейковой модели
      проходят за секунды и годятся для каждого коммита, а оценка запускается
      реже и по делу. Сравнивать прогоны при этом как раз осмысленно — ради
      этого метрики и сохраняют вместе с версией промпта. Персональные данные из
      датасета следует убрать независимо от места запуска.
