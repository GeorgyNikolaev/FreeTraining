pass_score: 70
questions:
  - question: >
      Веб-интерфейс получает от графа поток и подтормаживает на длинных
      диалогах: по сети идут мегабайты. Какой режим стрима, скорее всего,
      выбран и чем его заменить?
    options:
      - text: "`values` — он отдаёт всё состояние после каждого шага; заменить на `updates`"
        correct: true
      - text: "`updates` — он дублирует состояние; заменить на `values`"
      - text: "`messages` — токены идут вместе с метаданными; заменить на `custom`"
      - text: "`tasks` — он передаёт вход и результат каждой задачи; заменить на `checkpoints`"
    explanation: >
      `values` передаёт состояние целиком на каждом шаге, а в состоянии лежит вся
      история сообщений — отсюда объём. `updates` отдаёт только то, что вернул
      узел. `messages` передаёт короткие фрагменты текста, `tasks` действительно
      содержит вход и результат, но его в интерфейс обычно не отдают вовсе, а
      `checkpoints` не заменяет ни один из них по смыслу.
  - question: >
      Студент видит в потоке куски текста, которых не ожидал: рассуждения
      классификатора и внутренней рецензии. В чём причина?
    options:
      - text: Токены режима `messages` не отфильтрованы по имени узла
        correct: true
      - text: Не отключён режим `debug`
      - text: Узлы классификации и рецензии не помечены как служебные при компиляции
      - text: Не задан `output_schema` у графа
    explanation: >
      В режиме `messages` наружу идут токены **всех** вызовов модели; отделить
      нужные можно только по метаданным — `langgraph_node`. Пометки «служебный
      узел» в API нет, `debug` — отдельный режим, который надо было бы включить
      специально, а `output_schema` фильтрует результат `invoke`, но не поток.
  - question: >
      Зачем нужен `get_stream_writer`, если есть режимы `updates` и `messages`?
    options:
      - text: "Чтобы отправлять события, о которых движок знать не может: «проверяю признак 3 из 5», «ищу в уроках»"
        correct: true
      - text: Чтобы сохранять промежуточные результаты между шагами графа
      - text: Чтобы ускорить поток токенов от модели
      - text: Чтобы передавать данные из узла в узел, минуя состояние
    explanation: >
      Движок видит шаги и токены, но не смысл происходящего внутри узла —
      понятный человеку статус может отправить только сам узел. Обратите
      внимание, чего эта функция не делает: события нигде не сохраняются и не
      передаются другим узлам — для всего этого есть состояние.
  - question: >
      Поток от графа закончился, а ответа в интерфейсе нет. Что проверить в
      первую очередь?
    options:
      - text: "Снимок состояния: скорее всего, узел вызвал `interrupt` и граф ждёт ответа человека"
        correct: true
      - text: Не истёк ли `recursion_limit`
      - text: Не отключён ли чекпойнтер
      - text: Не пуст ли `output_schema`
    explanation: >
      Прерывание завершает поток штатно, без ошибки: клиент видит конец стрима, а
      граф стоит в ожидании. Поэтому после окончания потока всегда смотрят
      снимок: непустые `interrupts` означают «покажи вопрос». Превышение лимита
      шагов дало бы исключение, а отсутствие чекпойнтера — ошибку ещё на старте,
      раз в графе есть прерывания.
  - question: >
      Почему для потока ответов выбран SSE, а `thread_id` при этом собирается на
      сервере?
    options:
      - text: Поток односторонний, поэтому хватает обычного HTTP-ответа, который не закрывается
        correct: true
      - text: Идентификатор нити из тела запроса позволил бы открыть чужой разговор
        correct: true
      - text: SSE умеет передавать заголовок авторизации, а WebSocket — нет
      - text: При SSE состояние графа хранится на клиенте, поэтому подмена нити безопасна
    explanation: >
      SSE — это и есть длинный HTTP-ответ: для одностороннего потока он проще
      WebSocket и дружелюбнее к прокси. А нить — это ключ к сохранённому
      разговору, и доверять его клиенту нельзя. Про заголовки всё наоборот:
      браузерный `EventSource` их не отправляет, поэтому поток читают через
      `fetch`. Состояние же всегда на сервере, в чекпойнтере.
  - question: >
      Студент закрыл вкладку посреди ответа. Что произойдёт с нитью?
    options:
      - text: Выполненные шаги сохранены чекпойнтером, и разговор продолжится с того же места
        correct: true
      - text: "Нить будет испорчена: незавершённый запуск оставит состояние в неконсистентном виде"
      - text: "Ничего не сохранится: при разрыве соединения движок откатывает запуск"
      - text: Граф продолжит выполняться до конца независимо от клиента, и ответ будет записан целиком
    explanation: >
      Стрим — это способ доставки, а не хранения: всё, что успело выполниться,
      уже записано снимками, поэтому потеря клиента ничего не портит и не
      откатывает. Гарантии «досчитает до конца» у оборванного запроса тоже нет —
      отмена на клиенте рано или поздно прерывает серверную задачу, и
      продолжается работа с последнего сохранённого шага.
