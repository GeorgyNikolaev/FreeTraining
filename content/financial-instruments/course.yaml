title: "Финансовые инструменты: от акции до опциона"
description: "Как устроены, как оцениваются и чем рискуют акции, облигации, фьючерсы, свопы, опционы и кредитные деривативы — с полной математикой от дисконтирования до леммы Ито и формулы Блэка–Шоулза."
tags: [финансы, деривативы, облигации, опционы, свопы, фьючерсы, стохастическое исчисление]
level: intermediate
prerequisites:
  - Берёт частные производные и раскладывает функцию в ряд Тейлора до второго порядка
  - Считает матожидание, дисперсию и ковариацию, знает нормальное распределение
  - Понимает условное матожидание и условную вероятность
  - Решает системы линейных уравнений
  - "Пишет на Python с numpy: векторные операции, функции, циклы; строит графики в matplotlib"
