pass_score: 70
questions:
  - question: "Одношаговая модель: акция 50, за период вырастет до 60 или упадёт до 40, безрисковый рост за период — 5% (множитель 1,05). Сколько стоит европейский пут со страйком 50?"
    options:
      - text: "3,57"
        correct: true
      - text: "4,76"
      - text: "5,00"
      - text: "3,75"
    explanation: >
      u = 1,2, d = 0,8, q = (1,05 − 0,8)/(1,2 − 0,8) = 0,625. Пут платит 0 при росте и 10 при падении:
      P = (0,375·10)/1,05 = 3,57. 4,76 — при вероятностях 50/50: 5/1,05. 5,00 — то же без
      дисконтирования. 3,75 — риск-нейтральная вероятность без дисконтирования. Реальные
      вероятности роста и падения в расчёт не входят.

  - question: "Почему ожидаемая доходность акции μ не входит в уравнение Блэка–Шоулза?"
    options:
      - text: "Портфель «опцион минус дельта акций» мгновенно безрисков: случайная часть, а с ней и снос, сокращается, и портфель должен приносить безрисковую ставку"
        correct: true
      - text: "Предполагается, что инвесторы нейтральны к риску, и для них μ = r"
      - text: "μ невозможно оценить по данным, поэтому её заменяют на r"
      - text: "μ входит в формулу через σ: волатильность уже учитывает ожидаемую доходность"
    explanation: >
      Вывод не делает допущений о предпочтениях инвесторов: снос сокращается вместе с dW в
      хеджированном портфеле. Риск-нейтральная мера — следствие, а не допущение: цены получаются
      такими, как если бы μ = r, но реальный μ может быть любым. Трудность оценки μ верна, но
      причиной не является. σ и μ — независимые параметры динамики.

  - question: "Цена акции следует ГБД: dS = μS dt + σS dW. Чему равен дифференциал d(S²)?"
    options:
      - text: "(2μ + σ²)S² dt + 2σS² dW"
        correct: true
      - text: "2μS² dt + 2σS² dW"
      - text: "(2μ − σ²)S² dt + 2σS² dW"
      - text: "(μ + σ²/2)S² dt + σS² dW"
    explanation: >
      По лемме Ито с f = S²: f_S = 2S, f_SS = 2. df = 2S dS + ½·2·(dS)² = 2S(μS dt + σS dW) + σ²S² dt.
      Вариант без σ² — обычное цепное правило, которое теряет вклад квадратичной вариации.
      Знак минус появляется у ln S, а не у S². Последний вариант — лемма, применённая к S, а не к S².

  - question: "Какое изменение НЕ изменит цену европейского колла по формуле Блэка–Шоулза?"
    options:
      - text: "Аналитики повысили прогноз ожидаемой доходности акции с 10% до 25% годовых"
        correct: true
      - text: "Безрисковая ставка выросла с 12% до 14%"
      - text: "Историческая волатильность, на которую ориентируется рынок, выросла с 25% до 30%"
      - text: "Компания объявила дивиденд, который будет выплачен до экспирации"
    explanation: >
      Ожидаемая доходность в формулу не входит. Ставка входит через дисконтирование страйка:
      колл дорожает с ростом r. Волатильность — главный параметр, цена растёт с σ. Дивиденд
      снижает форвардную цену акции, и колл дешевеет.

  - question: "Для колла по модели Блэка–Шоулза получилось N(d2) = 0,35. Что это означает?"
    options:
      - text: "Вероятность исполнения колла под риск-нейтральной мерой равна 35%"
        correct: true
      - text: "Реальная вероятность, что акция к экспирации будет выше страйка, равна 35%"
      - text: "Дельта колла равна 0,35"
      - text: "Колл стоит 35% от цены акции"
    explanation: >
      N(d2) = Q(S_T > K) — риск-нейтральная вероятность. Реальная вероятность считается при сносе
      μ вместо r и для акций с положительной премией за риск обычно выше. Дельта колла — N(d1),
      она больше N(d2), потому что d1 = d2 + σ√τ. К цене опциона относительно акции N(d2) прямого
      отношения не имеет.

  - question: "Нужно оценить маржируемый опцион колл на фьючерс Si, торгующийся на Мосбирже. Какая формула корректна?"
    options:
      - text: "Модель Блэка без дисконтирования: F·N(d1) − K·N(d2)"
        correct: true
      - text: "Модель Блэка с дисконтированием: e^(−rτ)·[F·N(d1) − K·N(d2)]"
      - text: "Модель Гармана–Кольхагена по спот-курсу с рублёвой и долларовой ставками"
      - text: "Модель Блэка–Шоулза, подставив цену фьючерса вместо S и рублёвую ставку как r"
    explanation: >
      По маржируемому опциону премия не платится: результат приходит через вариационную маржу, и
      процент на премию не теряется, поэтому множителя e^(−rτ) нет. Формула с дисконтированием
      верна для опционов на фьючерс с уплатой премии. Гарман–Кольхаген оценивает опцион на спот,
      а не на фьючерс, и требует ставку, которую для рубля и доллара легко взять неправильно.
      Блэк–Шоулз с F вместо S дважды учтёт стоимость владения: F уже содержит процентную разницу.

  - question: "Банк оценивает американский пут глубоко в деньгах по формуле Блэка–Шоулза для европейского пута. К чему это приведёт?"
    options:
      - text: "Цена будет занижена на премию за досрочное исполнение; продав такой пут, банк недополучит"
        correct: true
      - text: "Цена будет завышена: европейский пут дороже, потому что не даёт права досрочного исполнения"
      - text: "Цена будет точной: пут и колл связаны паритетом, а американский колл равен европейскому"
      - text: "Цена будет занижена, но только при наличии дивидендов"
    explanation: >
      Американский пут стоит не меньше европейского, а глубоко в деньгах разница значительна:
      процент на страйк делает досрочное исполнение выгодным. Для пута со страйком 110 при цене
      100 из урока это 10,38 против 9,21. Равенство американского и европейского верно для колла
      без дивидендов, но не для пута, и паритет для американских опционов — неравенство. Дивиденды,
      наоборот, уменьшают выгоду досрочного исполнения пута.

  - question: "Дерево CRR даёт для европейского колла 6,5156 при n = 100 и 6,5393 при n = 101. Точная цена неизвестна. Как лучше поступить?"
    options:
      - text: "Взять среднее двух значений или увеличить n и усреднить соседние: ошибка колеблется по знаку"
        correct: true
      - text: "Взять значение при n = 101: больше шагов — всегда точнее"
      - text: "Взять значение при n = 100: при чётном n страйк лежит в узле, и ошибки нет"
      - text: "Уменьшить n до 10: при малом числе шагов ошибки округления меньше"
    explanation: >
      Ошибка дерева убывает как 1/n, но колеблется: у соседних n она почти одинакова по модулю и
      противоположна по знаку. Среднее 6,5275 отличается от точных 6,5281 на 0,0007 — точнее обоих
      значений. «Больше шагов — точнее» неверно на соседних n. Страйк в узле уменьшает, но не
      убирает ошибку: при n = 100 она −0,013. Ошибки округления при n = 100 ничтожны по сравнению
      с ошибкой дискретизации.
