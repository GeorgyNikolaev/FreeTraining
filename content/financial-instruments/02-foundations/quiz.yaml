pass_score: 70
questions:
  - question: "Банк предлагает 12% годовых с ежемесячной капитализацией. Чему равна эквивалентная непрерывная ставка?"
    options:
      - text: "Ровно 12%"
      - text: "12·ln(1 + 0,12/12) ≈ 11,94%"
        correct: true
      - text: "ln(1,12) ≈ 11,33%"
      - text: "(1 + 0,12/12)^12 − 1 ≈ 12,68%"
    explanation: >
      Переводим по формуле r_c = m·ln(1 + r_m/m) при m = 12: получаем 11,94%. Вариант ln(1,12)
      верен только для ежегодного начисления. 12,68% — эффективная годовая ставка, а не
      непрерывная. Непрерывная ставка всегда ниже номинальной с дискретным начислением.

  - question: "Сделка на 100 млн под 6% годовых на 180 дней. По какой конвенции заёмщик заплатит больше процентов?"
    options:
      - text: "ACT/365F"
      - text: "ACT/360"
        correct: true
      - text: "Одинаково: ставка ведь одна и та же"
    explanation: >
      Проценты равны сумма·ставка·τ. По ACT/360 τ = 180/360 = 0,5, по ACT/365F τ = 180/365 ≈ 0,493.
      Делитель меньше — доля года больше — процентов больше: 3 000 000 против 2 958 904.
      «Одинаково» — частая ошибка: ставка без конвенции не определяет сумму процентов.

  - question: "Инвестор купил акцию за день до даты закрытия реестра под дивиденд. Рынок работает в режиме T+1. Получит ли он дивиденд?"
    options:
      - text: "Да: расчёты пройдут как раз в дату закрытия реестра"
        correct: true
      - text: "Нет: нужно купить минимум за два рабочих дня"
      - text: "Да, при любом режиме расчётов: важен только день сделки"
    explanation: >
      В реестр попадают владельцы, у которых бумаги зачислены на дату закрытия. При T+1 сделка
      накануне рассчитывается в эту дату. Два рабочих дня нужны были в режиме T+2. День сделки
      сам по себе прав не даёт: права переходят при расчётах.

  - question: "Какую функцию выполняет центральный контрагент?"
    options:
      - text: "Сводит заявки покупателей и продавцов по лучшей цене"
      - text: "Становится стороной каждой сделки и гарантирует её исполнение, требуя обеспечение"
        correct: true
      - text: "Хранит учёт прав собственности на ценные бумаги"
      - text: "Гарантирует сохранность денег клиентов на счетах у брокера"
    explanation: >
      ЦК через новацию становится покупателем для продавца и продавцом для покупателя и берёт на
      себя риск дефолта участника, защищаясь маржой и гарантийным фондом. Сведение заявок —
      функция биржи, учёт прав — депозитария. Деньги клиента у брокера ЦК не гарантирует:
      перед клиентом отвечает брокер.

  - question: "В стакане на продажу 200 лотов по 50,00 и 300 лотов по 50,10. Лучший бид — 49,90. Какова средняя цена рыночной покупки 400 лотов?"
    options:
      - text: "50,00"
      - text: "50,05"
        correct: true
      - text: "50,06"
      - text: "49,95"
    explanation: >
      Рыночная заявка съедает стакан по уровням: 200 лотов по 50,00 и оставшиеся 200 по 50,10.
      Средняя цена (10 000 + 10 020)/400 = 50,05. 50,00 — цена только первого уровня: на нём не
      хватает объёма. 50,06 получится, если взвесить уровни по объёмам в стакане (200 и 300),
      а не по исполненному количеству. 49,95 — mid, по нему рыночная заявка не исполняется.

  - question: "Бескупонная облигация на 1 год стоит 0,90 за 1 рубль номинала, на 2 года — 0,80. Облигация с выплатами 10 через год и 110 через два года торгуется по 98. Что следует из отсутствия арбитража?"
    options:
      - text: "Облигация недооценена: справедливая цена 97, её выгодно покупать"
      - text: "Облигация переоценена: справедливая цена 97, её выгодно продать и купить копию из бескупонных"
        correct: true
      - text: "Цена справедлива: разница в 1 объясняется разными сроками потоков"
      - text: "По этим данным ничего сказать нельзя: не хватает ставки дисконтирования"
    explanation: >
      Копия стоит 10·0,90 + 110·0,80 = 9 + 88 = 97. Облигация дороже копии на 1, значит, продаём её
      и покупаем копию, сегодня получая 1. Сроки уже учтены через дисконт-факторы, а отдельная
      ставка не нужна: дисконт-факторы и есть рыночные ставки.

  - question: "В модели с двумя состояниями нашлись цены состояний ψ = (0,6; −0,1). Что это означает?"
    options:
      - text: "На рынке есть арбитраж"
        correct: true
      - text: "Рынок неполон, и цены определены неоднозначно"
      - text: "Вероятность падения отрицательна, а значит, падение невозможно"
    explanation: >
      По первой фундаментальной теореме арбитража нет тогда и только тогда, когда есть строго
      положительные цены состояний. Отрицательная цена состояния значит, что платёж в этом
      состоянии стоит меньше нуля — его можно получить бесплатно и ещё доплатой. Неполнота рынка
      проявляется иначе: решений бесконечно много, а не одно отрицательное. Цены состояний —
      не реальные вероятности, и о возможности исхода они ничего не говорят.
