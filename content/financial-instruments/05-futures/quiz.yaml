pass_score: 70
questions:
  - question: "Индекс стоит 3000, дивидендная доходность 7%, безрисковая ставка 14% (обе непрерывные). Годовой фьючерс торгуется по 3150. Что делать арбитражёру (издержками пренебречь)?"
    options:
      - text: "Купить фьючерс, продать корзину акций индекса в шорт и разместить деньги"
        correct: true
      - text: "Продать фьючерс, занять деньги и купить корзину акций индекса"
      - text: "Ничего: фьючерс в контанго, и так и должно быть"
      - text: "Продать фьючерс и разместить деньги под 14%"
    explanation: >
      Справедливая цена — 3000·e^(0,14 − 0,07) = 3217,52. Фьючерс по 3150 дешевле на 67,5, поэтому
      покупаем дешёвое (фьючерс) и продаём дорогое (корзину): это обратный cash-and-carry.
      Продажа фьючерса с покупкой корзины заработала бы, только если бы фьючерс был дороже
      3217,52. Контанго здесь есть (3150 > 3000), но цена всё равно ниже безарбитражной: важна
      не форма, а величина. Продажа фьючерса без покупки актива — открытая спекуляция, а не
      арбитраж.

  - question: "Держатель форварда на покупку акции без дивидендов по цене поставки 100 через полгода. Акция стоит 105, ставка 10% непрерывная. Сколько стоит его контракт?"
    options:
      - text: "5,00"
      - text: "9,88"
        correct: true
      - text: "0: форвард ничего не стоит"
      - text: "10,38"
    explanation: >
      f = S − K·e^(−rτ) = 105 − 100·e^(−0,05) = 105 − 95,12 = 9,88. 5,00 не учитывает, что цену
      поставки платят через полгода: сегодня она стоит меньше 100. Ноль — стоимость только в
      момент заключения по рыночной форвардной цене. 10,38 — это F − K = 105·e^(0,05) − 100 без
      дисконтирования: такую сумму держатель получит в дату поставки, а не сегодня.

  - question: "Продано 5 контрактов Si по 84 000. Расчётная цена вечернего клиринга — 84 650. Какова вариационная маржа за день?"
    options:
      - text: "+3 250 рублей"
      - text: "−3 250 рублей"
        correct: true
      - text: "−650 рублей"
      - text: "−3 250 000 рублей"
    explanation: >
      ВМ = N·(F_t − F_{t−1})·стоимость пункта = (−5)·(84 650 − 84 000)·1 = −3 250. Доллар
      подорожал, короткая позиция в минусе, поэтому знак отрицательный. −650 — забыто число
      контрактов. −3 250 000 — цена умножена на 1000 долларов лота, хотя котировка Si уже дана
      в рублях за 1000 долларов.

  - question: "Металлургический комбинат хеджирует продажу 500 тонн металла через 3 месяца фьючерсом на родственный металл (контракт 10 тонн). Стандартное отклонение трёхмесячного изменения цены: металл — 2%, фьючерс — 2,5%, корреляция 0,9. Сколько контрактов продать?"
    options:
      - text: "50"
      - text: "36"
        correct: true
      - text: "45"
      - text: "40"
    explanation: >
      h* = ρ·σ_S/σ_F = 0,9·2/2,5 = 0,72; N = 0,72·500/10 = 36. 50 — хедж 1:1 по объёму, при котором
      более волатильный фьючерс перехеджирует позицию. 45 — умножено на ρ без поправки на
      волатильности. 40 — отношение волатильностей без корреляции.

  - question: "Управляющий портфелем российских акций на 50 млн рублей с бетой 0,8 хочет временно поднять бету до 1,3. Один фьючерс на индекс стоит 280 000 рублей. Что сделать?"
    options:
      - text: "Продать 89 фьючерсов"
      - text: "Купить 89 фьючерсов"
        correct: true
      - text: "Купить 232 фьючерса"
      - text: "Продать 143 фьючерса"
    explanation: >
      N = (β − β*)·V/(F·m) = (0,8 − 1,3)·50 000 000/280 000 = −89,3. Отрицательное N — покупка:
      чтобы повысить бету, рыночную экспозицию добавляют. Продажа 89 снизила бы бету до 0,3.
      232 — это 1,3·V/(F·m), число контрактов для беты 1,3 с нуля, без учёта уже имеющихся 0,8.
      143 — число контрактов для полного хеджа: так бета стала бы нулевой.

  - question: "Курс USD/RUB 80, годовая рублёвая ставка 14%, долларовая 4% (простые, одинаковая конвенция). Банк котирует годовой форвард по 83,00. Какой вывод верен?"
    options:
      - text: "Форвард дешёв: безарбитражный курс около 87,69, выгодно купить доллары на форварде, профинансировав сделку займом в долларах и рублёвым депозитом"
        correct: true
      - text: "Форвард справедлив: рынок ожидает ослабления рубля на 3,75%"
      - text: "Форвард дорог: он выше спота, выгодно продать доллары на форварде"
      - text: "Сравнивать нельзя: форвардный курс — прогноз, а не арифметика"
    explanation: >
      По паритету F = 80·1,14/1,04 = 87,69. Котировка 83,00 ниже, поэтому покупаем дешёвый
      форвард: занимаем доллары, продаём их по 80, кладём рубли под 14% и покупаем доллары на
      форварде, чтобы вернуть займ. Форвардный курс выше спота — нормально при рублёвой ставке
      выше долларовой, дороговизны это не означает. Форвард определяется разницей ставок, а не
      ожиданиями.

  - question: "Цена вечного фьючерса на CNY/RUB несколько недель держится выше курса Банка России. Что это означает для участников?"
    options:
      - text: "Длинные позиции ежедневно платят фандинг коротким, и чем больше отклонение, тем больше платёж в пределах лимита"
        correct: true
      - text: "Короткие позиции платят фандинг длинным, компенсируя им переплату"
      - text: "Фандинг не начисляется, пока контракт не дойдёт до экспирации"
      - text: "Биржа принудительно закроет позиции по курсу ЦБ"
    explanation: >
      Фандинг перечисляется от стороны, в пользу которой цена отклонилась, к противоположной:
      при цене выше спота держать лонг дорого, это возвращает цену к споту. Экспирации у вечного
      фьючерса нет, фандинг заменяет схождение. Биржа позиции не закрывает — механизм работает
      через цену. Устойчивая премия к споту экономически отражает разницу рублёвой и юаневой
      ставок.

  - question: "Фьючерс и форвард на один и тот же актив с одной датой поставки. Цена актива сильно положительно коррелирует с краткосрочными ставками. Как соотносятся цены?"
    options:
      - text: "Фьючерсная цена выше форвардной"
        correct: true
      - text: "Цены равны: у них одинаковый базовый актив и дата"
      - text: "Форвардная цена выше фьючерсной"
    explanation: >
      Длинная фьючерсная позиция получает вариационную маржу, когда цена растёт, — и в это же
      время растут ставки, под которые маржу можно разместить. Убытки приходятся на периоды
      низких ставок, и финансировать их дёшево. Это преимущество, и рынок закладывает его в
      более высокую фьючерсную цену. Равенство цен доказано только для детерминированных ставок.
      При отрицательной корреляции форвард был бы дороже.
