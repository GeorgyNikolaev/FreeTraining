pass_score: 70
questions:
  - question: "Акция закрылась на 500 рублей накануне отсечки под дивиденд 40 рублей. На следующий день цена 465. Какова доходность инвестора за этот день?"
    options:
      - text: "−7,0%"
      - text: "Около +1%"
        correct: true
      - text: "+8,0%"
      - text: "0%: дивидендный гэп не считается"
    explanation: >
      Инвестор получил цену 465 и дивиденд 40, всего 505 на вложенные 500: +1,0%. В
      скорректированном ряду цена накануне — 500·(460/500) = 460, и 465/460 − 1 = +1,09%.
      Небольшая разница между двумя способами — в том, по какой цене считается реинвестиция
      дивиденда. −7% — доходность по сырым ценам: гэп принят за убыток. +8% — дивидендная
      доходность 40/500 без учёта того, что цена акции упала на размер дивиденда.

  - question: "Дневная волатильность лог-доходности акции — 1,5%. Какова годовая волатильность, если дневные доходности независимы?"
    options:
      - text: "1,5% · 252 = 378%"
      - text: "1,5% · √252 ≈ 23,8%"
        correct: true
      - text: "1,5% · √365 ≈ 28,7%"
      - text: "1,5% · 12 = 18%"
    explanation: >
      Дисперсии независимых слагаемых складываются, поэтому стандартное отклонение растёт как
      корень из числа периодов. В году около 252 торговых дней: в выходные торгов нет, и
      доходность за выходные входит в понедельник, поэтому 365 не подходит. Умножение на 252
      складывает стандартные отклонения, а не дисперсии.

  - question: "Какое свойство верно для логарифмических доходностей?"
    options:
      - text: "Лог-доходность за год равна сумме месячных лог-доходностей"
        correct: true
      - text: "Лог-доходность портфеля равна взвешенной сумме лог-доходностей бумаг"
      - text: "Лог-доходность не может быть меньше −100%"
    explanation: >
      ln(S_T/S_0) — сумма ln(S_t/S_{t−1}) по периодам: аддитивность по времени. По активам
      складываются простые доходности, а не логарифмические: логарифм суммы не равен сумме
      логарифмов. Ограничение −100% — у простой доходности. Логарифмическая при цене,
      стремящейся к нулю, уходит в −∞.

  - question: "Волатильность акции 40%, индекса 20%, корреляция 0,5. Чему равна бета акции?"
    options:
      - text: "0,5"
      - text: "1,0"
        correct: true
      - text: "2,0"
      - text: "0,25"
    explanation: >
      β = ρ·σ_i/σ_M = 0,5·40/20 = 1,0. Бета 2,0 получится без корреляции: так было бы при
      идеальной связи с рынком. 0,5 — это сама корреляция. Бета 1 не значит, что акция
      повторяет рынок: при корреляции 0,5 рынок объясняет только 25% её дисперсии.

  - question: "Инвестор купил акции на 3 млн рублей: 1 млн своих и 2 млн займа под 20% годовых. Акция выросла за год на 15%. Какова доходность на собственные средства (без комиссий)?"
    options:
      - text: "+45%"
      - text: "+5%"
        correct: true
      - text: "+15%"
      - text: "−5%"
    explanation: >
      Плечо k = 3. R_E = k·R − (k−1)·b = 3·15% − 2·20% = 45% − 40% = +5%. Проверка в рублях:
      позиция 3,45 млн, долг с процентами 2,4 млн, остаётся 1,05 млн. +45% — без стоимости
      займа. Плечо тут почти не помогло: доходность акции ниже ставки займа, и каждый занятый
      рубль приносит минус 5%.

  - question: "Чем короткая продажа акции рискованнее покупки той же акции на ту же сумму?"
    options:
      - text: "Убыток короткой позиции не ограничен сверху, а её размер растёт вместе с убытком"
        correct: true
      - text: "Короткая позиция всегда облагается более высокой комиссией биржи"
      - text: "При короткой продаже инвестор получает дивиденды с опозданием"
      - text: "Короткую позицию нельзя закрыть до отсечки"
    explanation: >
      Цена может расти неограниченно, и при росте растут и убыток, и само обязательство. Отсюда
      маржин-коллы и шорт-сквизы. У покупки убыток ограничен вложенным. Биржевые комиссии для
      шорта обычно те же, а особые издержки шорта — плата за займ бумаг. Продавец не получает, а
      платит компенсацию дивидендов. Позицию можно закрыть в любой момент.

  - question: "Цена пая биржевого фонда на акции крупных компаний на 1,5% выше его NAV. Что, скорее всего, произойдёт в обычных рыночных условиях?"
    options:
      - text: "Уполномоченные участники купят корзину, создадут паи и продадут их, и премия сократится до уровня издержек"
        correct: true
      - text: "Управляющая компания выкупит паи по NAV у всех инвесторов"
      - text: "Премия сохранится: цена пая определяется только спросом"
    explanation: >
      Механизм создания паёв — арбитраж между паем и корзиной: при премии выгодно создавать паи
      и продавать их. Для ликвидной корзины издержки — доли процента, так что 1,5% долго не
      продержится. Цена действительно определяется спросом, но предложение паёв эластично.
      Управляющая компания не обязана выкупать паи у всех инвесторов по NAV: на бирже работают
      маркет-мейкеры и уполномоченные участники.
