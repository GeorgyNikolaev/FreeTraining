pass_score: 70
questions:
  - question: "Акция стоит 80, европейский колл со страйком 80 на год стоит 10, непрерывная ставка 10%, дивидендов нет. Сколько должен стоить европейский пут с тем же страйком и сроком?"
    options:
      - text: "2,39"
        correct: true
      - text: "10,00"
      - text: "17,61"
      - text: "0: опцион на деньгах"
    explanation: >
      По паритету P = C − S + K·e^(−rτ) = 10 − 80 + 80·e^(−0,1) = 10 − 80 + 72,39 = 2,39. Равенство
      колла и пута на деньгах было бы верно при нулевой ставке: при положительной форвард выше
      спота, и колл дороже пута. 17,61 — знак дисконтированного страйка перепутан. Нулевая цена
      означала бы, что пут не может принести выплату, но цена за год может упасть.

  - question: "Акция стоит 50, европейский колл со страйком 40 на год продаётся за 12, ставка 10% непрерывная, дивидендов нет. Что верно?"
    options:
      - text: "Колл дешевле нижней границы 13,81: купить колл, продать акцию в шорт, разместить 36,19"
        correct: true
      - text: "Колл дороже внутренней стоимости 10, значит, переоценён: продать колл"
      - text: "Всё в порядке: цена между внутренней стоимостью 10 и ценой акции 50"
      - text: "Колл дешевле нижней границы: продать колл и купить акцию"
    explanation: >
      Нижняя граница C ≥ S − K·e^(−rτ) = 50 − 36,19 = 13,81. При цене 12 покупаем дешёвый колл,
      продаём акцию за 50 и размещаем 36,19 до экспирации: сегодня +1,81. В экспирацию у нас 40
      на депозите. Если S_T > 40, исполняем колл и возвращаем акцию. Если S_T ≤ 40, покупаем
      акцию на рынке дешевле 40 и оставляем разницу. Граница «не ниже внутренней стоимости» слабее
      правильной: она не учитывает процент на страйк. Продажа колла по заниженной цене
      увеличивает убыток, а не фиксирует арбитраж.

  - question: "Какой американский опцион на акцию без дивидендов может быть выгодно исполнить до экспирации?"
    options:
      - text: "Пут глубоко в деньгах"
        correct: true
      - text: "Колл глубоко в деньгах"
      - text: "Колл на деньгах перед экспирацией"
      - text: "Никакой: досрочное исполнение всегда теряет временную стоимость"
    explanation: >
      Выплата пута ограничена страйком, а исполнив его сейчас, держатель получает K раньше и
      зарабатывает на нём процент. При цене акции около нуля ждать нечего. Колл на акцию без
      дивидендов стоит не меньше S − K·e^(−rτ), а это больше S − K, так что его выгоднее продать,
      чем исполнить. Утверждение про временную стоимость верно для коллов, но у пута глубоко в
      деньгах выигрыш в процентах может её перевешивать.

  - question: "Через неделю компания публикует отчётность. Вы ждёте, что акция резко изменится, но не знаете, в какую сторону. Опционы на неделю сейчас дешевле обычного. Какая стратегия соответствует взгляду?"
    options:
      - text: "Купленный стрэддл на деньгах"
        correct: true
      - text: "Бабочка с центральным страйком на текущей цене"
      - text: "Покрытый колл"
      - text: "Проданный стрэнгл"
    explanation: >
      Стрэддл зарабатывает на движении в любую сторону сверх уплаченной премии, а дешёвые опционы
      снижают порог безубыточности. Бабочка и проданный стрэнгл — ставки на то, что цена останется
      на месте: сильное движение приносит им убыток, у стрэнгла неограниченный. Покрытый колл
      ставит на умеренный рост и почти полностью открыт падению.

  - question: "Котировки европейских коллов с одной экспирацией: страйк 90 — 12,0, страйк 100 — 7,0, страйк 110 — 1,5. Есть ли арбитраж (без спредов)?"
    options:
      - text: "Да: купить колл 90 и колл 110, продать два колла 100 — получить 0,5 сегодня при неотрицательной выплате"
        correct: true
      - text: "Да: купить колл 100, продать колл 90 — колл 90 слишком дорог"
      - text: "Нет: цены убывают по страйку, как и должны"
      - text: "Нет: разница между соседними ценами меньше шага страйков 10"
    explanation: >
      Бабочка 90/100/110 стоит 12 − 2·7 + 1,5 = −0,5 < 0, хотя её выплата неотрицательна:
      нарушена выпуклость цены колла по страйку. Продав бабочку наоборот, мы получаем 0,5 сегодня
      и никогда не платим. Монотонность и ограничение на спреды выполнены, но их недостаточно: они
      не проверяют выпуклость. Продажа колла 90 с покупкой колла 100 — не арбитраж: при росте цены
      выше 100 эта позиция теряет до 10.

  - question: "Какой позиции по профилю выплаты в экспирацию эквивалентна позиция «акция + проданный европейский колл со страйком K»?"
    options:
      - text: "Проданному путу со страйком K плюс облигации, платящей K"
        correct: true
      - text: "Купленному путу со страйком K"
      - text: "Бычьему колл-спреду"
      - text: "Защитному путу"
    explanation: >
      По паритету S − C = K·e^(−rτ) − P: акция минус колл — это облигация на K минус пут. Выплата
      min(S_T, K) у обеих позиций. Купленный пут даёт прибыль при падении, а покрытый колл — убыток.
      Бычий колл-спред не содержит акции и при падении теряет только премию. Защитный пут
      ограничивает убыток и не ограничивает прибыль — ровно наоборот.

  - question: "Владелец акции (цена 200) купил пут со страйком 180 и продал колл со страйком 230 с нулевой суммарной премией. Каким будет результат по всей позиции, если в экспирацию акция стоит 150? А если 260?"
    options:
      - text: "−20 при 150 и +30 при 260"
        correct: true
      - text: "−50 при 150 и +60 при 260"
      - text: "−20 при 150 и +60 при 260"
      - text: "0 при 150 и +30 при 260"
    explanation: >
      Коллар зажимает итоговую стоимость между 180 и 230. При 150 пут приносит 30, и позиция стоит
      180: результат −20. При 260 колл исполняют, и акция уходит по 230: результат +30. −50 и +60 —
      результаты голой акции без опционов. −20 и +60 — учтён пут, но забыт проданный колл. Ноль
      при 150 неверен: пут защищает только ниже 180, а первые 20 пунктов падения остаются у
      владельца.
