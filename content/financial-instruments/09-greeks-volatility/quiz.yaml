pass_score: 70
questions:
  - question: "Трейдер купил стрэддл на деньгах по подразумеваемой волатильности 30% и ежедневно хеджирует дельту. За месяц реализованная волатильность составила 22%, цена ушла на 5% вверх. Каков, скорее всего, результат?"
    options:
      - text: "Убыток: тета, заплаченная за 30%, больше заработка на гамме при движениях с волатильностью 22%"
        correct: true
      - text: "Прибыль: цена выросла на 5%, и колл в стрэддле заработал"
      - text: "Около нуля: дельта-хедж убирает весь риск"
      - text: "Прибыль: купленный стрэддл всегда выигрывает от любого движения"
    explanation: >
      P&L дельта-хеджированной длинной опционной позиции ≈ ½∫ΓS²(σ_r² − σ_i²)dt: при реализованной
      волатильности ниже заложенной это убыток. Направленный рост на 5% хедж как раз нейтрализовал:
      прибыль колла ушла на убыток по проданной в хедже дельте. Дельта-хедж убирает направление, но
      не риск волатильности. Стрэддл выигрывает от движения, только если оно больше того, за
      которое заплачено.

  - question: "У опционной книги дельта 0, гамма −2 000, тета +15 000 рублей в день. Какое описание верно?"
    options:
      - text: "Книга зарабатывает на спокойном рынке и теряет на сильных движениях в любую сторону"
        correct: true
      - text: "Книга безрисковая: дельта нулевая, и каждый день приносит 15 000"
      - text: "Книга выигрывает при резком росте и проигрывает при резком падении"
      - text: "Книга зарабатывает на росте волатильности"
    explanation: >
      Отрицательная гамма оплачивается положительной тетой: это проданные опционы. Каждый день
      книга получает тету, а при движении δS теряет ½·2000·δS². Нулевая дельта защищает только от
      малых движений. Знак гаммы не зависит от направления: δS² положителен в обе стороны.
      О веге данных нет, но книга с отрицательной гаммой обычно имеет и отрицательную вегу — и тогда
      на росте волатильности теряет.

  - question: "Какой из опционов на одну и ту же акцию имеет наибольшую гамму?"
    options:
      - text: "Колл на деньгах с экспирацией через неделю"
        correct: true
      - text: "Колл на деньгах с экспирацией через год"
      - text: "Колл глубоко в деньгах с экспирацией через неделю"
      - text: "Пут вне денег с экспирацией через год"
    explanation: >
      Гамма φ(d1)/(Sσ√τ) максимальна около страйка и растёт при τ → 0: у недельного колла на деньгах
      дельта скачет от 0 к 1 на малом движении. У годового колла на деньгах гамма меньше из-за √τ в
      знаменателе. Опцион глубоко в деньгах перед экспирацией ведёт себя как акция: дельта около 1,
      гамма около 0. У годового пута вне денег гамма мала из-за φ(d1).

  - question: "Банк продаёт клиенту пут на индекс со страйком на 20% ниже рынка и оценивает его по подразумеваемой волатильности опциона на деньгах. На рынке индексных опционов есть типичный перекос. Что произойдёт?"
    options:
      - text: "Пут будет продан существенно дешевле рынка: IV у путов вне денег выше, а цена такого пута очень чувствительна к волатильности хвоста"
        correct: true
      - text: "Цена будет верной: волатильность — свойство актива, а не страйка"
      - text: "Пут будет продан дороже рынка: IV на деньгах самая высокая"
      - text: "Цена будет немного занижена, но разница не больше спреда"
    explanation: >
      На индексах IV путов вне денег выше, чем на деньгах, иногда на 10 п.п. и больше. Для пута
      далеко вне денег это значит цену в разы выше, чем по ATM-волатильности: вероятность хвоста
      растёт нелинейно. Модель с единой волатильностью неверна, и рынок это отражает. На индексах
      IV на деньгах не максимальна — максимальна она у низких страйков. Разница в разы — не спред.

  - question: "Ошибка дельта-хеджа при ежедневной перестройке — 0,50 на опцион (стандартное отклонение). Как часто нужно перестраивать хедж, чтобы снизить её до 0,25?"
    options:
      - text: "Примерно 4 раза в день"
        correct: true
      - text: "2 раза в день"
      - text: "Раз в два дня"
      - text: "Уменьшить ошибку нельзя: она определяется волатильностью"
    explanation: >
      Ошибка убывает как 1/√N: чтобы уменьшить её вдвое, нужно в 4 раза больше перестроек. Удвоение
      частоты снизит ошибку лишь до 0,50/√2 ≈ 0,35. Реже перестраивать — увеличить ошибку.
      Волатильность влияет на масштаб ошибки, но частота хеджа тоже управляет ею — ценой издержек,
      которые растут с частотой.

  - question: "Европейский колл без дивидендов: S = 100, K = 90, r = 12%, τ = 0,25. На рынке он котируется по 12,00. Какую подразумеваемую волатильность вернёт решатель?"
    options:
      - text: "Никакую: цена ниже безарбитражной границы S − K·e^(−rτ) ≈ 12,66, и решения нет"
        correct: true
      - text: "Около 0%: опцион почти без временной стоимости"
      - text: "Около 15%: цена немного выше внутренней стоимости 10"
      - text: "Отрицательную волатильность"
    explanation: >
      При σ → 0 цена колла стремится к S − K·e^(−rτ) = 100 − 87,34 = 12,66, а с ростом σ только
      увеличивается. Цена 12,00 недостижима ни при какой σ ≥ 0 — это арбитраж, а не низкая
      волатильность. Решатель должен сначала проверить границы. Сравнение с внутренней стоимостью
      10 забывает про процент на страйк. Отрицательная волатильность смысла не имеет: в формулу
      входит σ² и σ√τ, и решатель не должен искать там.

  - question: "Исторически подразумеваемая волатильность индекса в среднем выше последующей реализованной. Стратегия «продавать стрэддлы на деньгах и хеджировать дельту» поэтому..."
    options:
      - text: "В среднем прибыльна, но с редкими очень крупными убытками, когда реализованная волатильность резко превышает подразумеваемую"
        correct: true
      - text: "Безрисковый арбитраж: IV систематически завышена"
      - text: "Убыточна: высокая IV сигнализирует о будущих кризисах"
      - text: "Прибыльна без риска, если хеджировать непрерывно"
    explanation: >
      Разница — премия за риск волатильности: продавец получает плату за то, что берёт на себя
      редкие взрывы волатильности, которые приходятся на кризисы. Это не арбитраж: есть исходы с
      огромным убытком, например февраль 2018 года и март 2020 года. Непрерывный хедж убирает
      ошибку дискретности, но не риск того, что σ_r > σ_i. Премия в среднем положительна, так что
      стратегия не убыточна в среднем.

  - question: "Опционная книга нейтральна по дельте и по веге, но вега-хедж сделан коллами на деньгах, а сама книга — проданные путы далеко вне денег. Индекс резко падает, перекос становится круче. Что будет?"
    options:
      - text: "Убыток: IV проданных путов вне денег вырастет сильнее, чем IV коллов на деньгах, и суммарная вега-нейтральность не спасёт"
        correct: true
      - text: "Результат около нуля: книга нейтральна по дельте и веге"
      - text: "Прибыль: коллы на деньгах подорожают сильнее путов"
      - text: "Убыток только от гаммы, изменение волатильности не влияет"
    explanation: >
      Вега-нейтральность защищает от параллельного сдвига волатильности, но не от изменения формы
      улыбки. При падении индекса IV низких страйков растёт больше, чем на деньгах, и проданные путы
      дорожают сильнее, чем компенсируют купленные коллы. Кроме того, у проданных путов
      отрицательная гамма. Нейтральность по двум грекам первого порядка не гарантирует ноль при
      большом движении с изменением формы поверхности. Нужен хедж по разным страйкам, то есть
      управление риском перекоса.
