pass_score: 80
questions:
  - question: "Вклад А — 13% годовых с ежемесячной капитализацией, вклад Б — 13,5% годовых с выплатой в конце года. Срок — год, риски одинаковы. Какой выгоднее?"
    options:
      - text: "А: его эффективная ставка около 13,80%"
        correct: true
      - text: "Б: номинальная ставка выше на 0,5 п.п."
      - text: "Одинаково: капитализация добавляет примерно 0,5 п.п."
      - text: "Сравнить нельзя без непрерывной ставки"
    explanation: >
      Эффективная ставка А: (1 + 0,13/12)^12 − 1 = 13,80%, у Б — 13,50%. Сравнивать можно только
      ставки в одной базе. Номинальные ставки с разной капитализацией несопоставимы. Прибавка от
      капитализации здесь 0,8 п.п., а не 0,5. Непрерывная ставка — лишь одна из возможных общих баз,
      эффективная годовая подходит не хуже.

  - question: "На рынке три состояния мира и торгуются только облигация и акция. Нужно оценить опцион с выплатой, которую нельзя собрать из этих двух активов. Что даёт принцип отсутствия арбитража?"
    options:
      - text: "Интервал допустимых цен, а не одну цену: рынок неполон, и цены состояний определены неоднозначно"
        correct: true
      - text: "Единственную цену: она равна дисконтированному ожиданию по реальным вероятностям"
      - text: "Ничего: без полного рынка арбитраж всегда существует"
      - text: "Единственную цену: любую выплату можно реплицировать при трёх и более состояниях"
    explanation: >
      Система p = Dψ из двух уравнений на три цены состояний имеет бесконечно много положительных
      решений. Каждое даёт свою цену опциона, и безарбитражные цены образуют интервал. Неполнота
      рынка не означает арбитраж: он есть, только если положительных решений нет вовсе.
      Реальные вероятности цену реплицируемых активов не определяют, а для нереплицируемых дают
      лишь одну из многих возможных оценок, зависящую от отношения к риску.

  - question: "Аналитик рассчитал риск маржинальной позиции в российской акции с дивидендной доходностью 12% по сырым дневным ценам за 3 года. Какой эффект это даёт?"
    options:
      - text: "Волатильность и хвостовой риск завышены: дивидендные гэпы посчитаны как падения цены"
        correct: true
      - text: "Волатильность занижена: дивиденды сглаживают ряд цен"
      - text: "Ничего: дивиденды не влияют на волатильность"
      - text: "Завышена доходность: дивиденды учтены дважды"
    explanation: >
      В день отсечки цена падает примерно на дивиденд. В сыром ряду это падение на 10–12% за день,
      которого инвестор не терял: дивиденд пришёл деньгами. Волатильность, бета и частота «обвалов»
      завышены, а доходность, наоборот, занижена, потому что дивиденды не учтены вовсе. Для оценки
      риска нужны цены, скорректированные на дивиденды.

  - question: "Портфель облигаций иммунизирован: приведённая стоимость и дюрация активов равны обязательству через 5 лет, активы — бумаги на 1 и 10 лет. Какой сценарий приведёт к дефициту?"
    options:
      - text: "Короткие ставки упадут, а длинные вырастут"
        correct: true
      - text: "Все ставки вырастут на 200 б.п."
      - text: "Все ставки упадут на 200 б.п."
      - text: "Никакой: иммунизированный портфель защищён от любых изменений ставок"
    explanation: >
      Условия Реддингтона защищают от параллельных сдвигов: при них выпуклость «гантели» 1 + 10 лет
      даже приносит небольшой излишек. Поворот кривой бьёт по обоим концам: десятилетняя бумага
      дешевеет от роста длинных ставок, а однолетняя переразмещается под более низкую ставку.
      Обязательство на 5 лет почти не меняется. От формы кривой защищают только ключевые дюрации.

  - question: "Инвестор покупает ОФЗ с доходностью 15% и финансирует покупку через РЕПО под 14% с дисконтом 10%. Какова годовая доходность на собственные средства без учёта изменения цены облигации?"
    options:
      - text: "24%"
        correct: true
      - text: "1%"
      - text: "15%"
      - text: "150%"
    explanation: >
      На 100 рублей позиции 10 — собственные средства (дисконт), 90 — займ по РЕПО. Доход:
      15 − 0,9·14 = 2,4 на 10 собственных, то есть 24%. 1% — разница ставок без учёта плеча. 15% —
      доходность облигации без финансирования. 150% — плечо 10 применено к полной доходности 15%
      без вычета стоимости займа. Заметьте: при росте доходности ОФЗ на 1 п.п. цена упадёт на
      несколько процентов, и с плечом 10 это десятки процентов собственных средств.

  - question: "Облигация компании в предбанкротном состоянии имеет YTM 45% при безрисковых 14%. Что верно?"
    options:
      - text: "YTM — обещанная доходность; с учётом вероятного дефолта и низкого возмещения ожидаемая доходность может быть намного ниже или отрицательной"
        correct: true
      - text: "Ожидаемая доходность 45%: YTM показывает среднюю доходность до погашения"
      - text: "Разница 31 п.п. — это чистая премия за ликвидность"
      - text: "Бумага недооценена: рынок не может требовать больше 20 п.п. кредитного спреда"
    explanation: >
      YTM предполагает, что все обещанные платежи будут выплачены. При вероятности дефолта 40% в год
      и возмещении 20% ожидаемые потери съедают всю надбавку. Спред отражает прежде всего ожидаемые
      потери и премию за риск дефолта. Ликвидность — лишь часть. Ограничений на размер спреда нет:
      у проблемных эмитентов он бывает в сотни пунктов.

  - question: "CNY/RUB спот 11,50, годовая рублёвая ставка 14% (ACT/365), юаневая 2% (ACT/360), год — 365 дней. Какой годовой форвардный курс безарбитражен?"
    options:
      - text: "12,85"
        correct: true
      - text: "11,50: форвард равен споту, если нет ожиданий"
      - text: "13,11"
      - text: "10,29"
    explanation: >
      F = 11,50·(1 + 0,14)/(1 + 0,02·365/360) = 12,85. Форвардный курс выше спота потому, что
      рублёвая ставка выше юаневой. Ожидания тут ни при чём: это паритет. 13,11 — ставки просто
      сложены: 11,50·(1 + 0,14). 10,29 — формула перевёрнута: рубль на форварде так бы подорожал.

  - question: "Нефтяная компания продала фьючерсы, чтобы захеджировать добычу на год. Нефть выросла на 30%, по фьючерсам уже уплачены миллиарды вариационной маржи. Финансовый директор предлагает закрыть хедж, «чтобы остановить убытки». Как оценить предложение?"
    options:
      - text: "Убыток по фьючерсам компенсируется будущей выручкой от дорогой нефти; закрытие превращает хедж в спекуляцию. Реальная проблема — ликвидность на маржу, её и надо решать"
        correct: true
      - text: "Предложение верно: хедж неэффективен, раз приносит убытки"
      - text: "Нужно продать ещё фьючерсы, чтобы усреднить цену входа"
      - text: "Нужно дождаться экспирации: до неё убытки не реальны"
    explanation: >
      Хедж оценивают по суммарному результату: фьючерсы теряют, а нефть, которую компания продаст,
      подорожала. Закрыв хедж на пике, компания зафиксирует убыток и останется без защиты при
      падении цены — это история Metallgesellschaft. Проблема — отток денег на вариационную
      маржу; её решают кредитными линиями или частичной заменой на внебиржевые инструменты с
      другим графиком расчётов. Продавать ещё фьючерсы — наращивать короткую позицию сверх добычи, то есть спекулировать на падении.
      Вариационная маржа реальна: деньги уже ушли.

  - question: "Банк получает фиксированные 11% по пятилетнему свопу на 1 млрд рублей. Сейчас рыночная ставка свопа на оставшийся срок — 12%, аннуитет — 3,5. Сколько стоит своп для банка?"
    options:
      - text: "−35 млн рублей"
        correct: true
      - text: "+35 млн рублей"
      - text: "−10 млн рублей"
      - text: "0: своп при заключении стоит ноль"
    explanation: >
      Для получателя V = N·(K − S)·A = 1 млрд·(11% − 12%)·3,5 = −35 млн. Банк получает меньше, чем
      сейчас платит рынок, и эта разница накопится за оставшийся срок. +35 млн — стоимость для
      плательщика. −10 млн — разница ставок за один год без аннуитета. Ноль — только в момент
      заключения по рыночной ставке.

  - question: "Банк заключает процентный своп с корпоративным клиентом без обеспечения и оценивает его по той же кривой OIS, что и обеспеченный межбанковский своп. Что упущено?"
    options:
      - text: "Корректировки на кредитный риск клиента (CVA) и стоимость фондирования необеспеченной позиции (FVA)"
        correct: true
      - text: "Ничего: безрисковая оценка одинакова для всех контрагентов"
      - text: "Только комиссия биржи за клиринг"
      - text: "Базисный спред между RUONIA и ключевой ставкой"
    explanation: >
      Дисконтирование по OIS обосновано денежным залогом под ставку овернайт. Без залога банк
      рискует дефолтом клиента, когда своп в плюсе (CVA), и финансирует положительную стоимость по
      своей ставке привлечения (FVA). Безрисковая оценка — лишь отправная точка. Клиринговой
      комиссии у двусторонней внебиржевой сделки нет. Базис важен, если своп на ключевую ставку,
      но он входит в прогнозную кривую, а не в поправку на отсутствие залога.

  - question: "У банка два свопа с одним и тем же клиентом на 10 млрд рублей номинала, оба на 5 лет: процентный рублёвый своп и рублёво-юаневый кросс-валютный своп. У какого свопа выше потенциальная кредитная экспозиция и почему?"
    options:
      - text: "У кросс-валютного: из-за обмена номиналом его стоимость зависит от курса на весь номинал"
        correct: true
      - text: "У процентного: он чувствительнее к ставкам"
      - text: "Одинаковая: номиналы и сроки равны"
      - text: "У кросс-валютного, но только если ставки в валютах сильно различаются"
    explanation: >
      Стоимость процентного свопа — разница ставок × аннуитет × номинал, при сдвиге на 200 б.п. это
      несколько процентов номинала. Стоимость кросс-валютного свопа с обменом номиналов меняется на
      столько же процентов, на сколько меняется курс: 30% — это 3 млрд. Номинал сам по себе риска
      не определяет. Разница ставок влияет на форвардные курсы, но главный риск — сам курс.

  - question: "Акция стоит 50, до отсечки ожидается дивиденд с приведённой стоимостью 2. Европейские опционы на полгода со страйком 50: колл 4,00, пут 2,50. Ставка 10% непрерывная. Что верно?"
    options:
      - text: "Колл дорог относительно пута: продать колл, купить пут, купить акцию и занять приведённую стоимость страйка и дивиденда"
        correct: true
      - text: "Всё справедливо: C − P = 1,50 при S − K = 0 — это нормальная премия колла"
      - text: "Пут дорог: продать пут и купить колл"
      - text: "Паритет к акциям с дивидендами неприменим"
    explanation: >
      По паритету C − P = S − D − K·e^(−rτ) = 50 − 2 − 47,56 = 0,44, а на рынке 1,50. Колл дорог на
      1,06. Продаём колл, покупаем пут и акцию, занимаем 49,56 (47,56 + 2): получаем 1,06 сегодня. В
      экспирацию акция уходит по 50 при любом исходе, а дивиденд гасит часть займа. Сравнение с
      S − K забывает дисконт и дивиденд. Паритет с дивидендами применим — в поправленной форме.

  - question: "У инвестора есть акции. Он ожидает боковик или небольшое снижение, хочет получать доход и при этом ограничить возможный убыток при резком падении. Какая конструкция подходит лучше всего?"
    options:
      - text: "Коллар: купить пут вне денег и продать колл вне денег"
        correct: true
      - text: "Покрытый колл"
      - text: "Защитный пут"
      - text: "Купленный стрэддл"
    explanation: >
      Коллар ограничивает убыток ниже страйка пута, а премия проданного колла оплачивает защиту и
      может приносить чистый доход. Плата — отказ от роста выше страйка колла, что соответствует
      взгляду. Покрытый колл даёт доход, но почти не защищает от падения. Защитный пут защищает, но
      стоит премию, а дохода не приносит. Стрэддл — ставка на сильное движение и дорог.

  - question: "Европейский пут: S = 50, K = 55, r = 10% (непрерывная), σ = 30%, τ = 0,5 года, дивидендов нет. Сколько он стоит по Блэку–Шоулзу?"
    options:
      - text: "5,58"
        correct: true
      - text: "5,00"
      - text: "3,26"
      - text: "8,26"
    explanation: >
      d1 = (ln(50/55) + (0,10 + 0,045)·0,5)/(0,3·√0,5) = −0,1075, d2 = −0,3196. P = 55·e^(−0,05)·N(0,3196)
      − 50·N(0,1075) = 5,58. 5,00 — только внутренняя стоимость, без временной стоимости и без
      дисконтирования страйка. 3,26 — цена колла с теми же
      параметрами. 8,26 — пут через паритет без дисконтирования страйка.

  - question: "Разработчик оценивает колл методом Монте-Карло и моделирует цену с реальной ожидаемой доходностью акции 20% вместо безрисковой ставки 12%, дисконтируя по 12%. Что получится?"
    options:
      - text: "Цена колла завышена: под риск-нейтральной мерой снос должен быть равен безрисковой ставке"
        correct: true
      - text: "Цена будет точнее: реальный снос лучше описывает будущее"
      - text: "Цена занижена: высокий снос уменьшает вероятность исполнения"
      - text: "Ошибка сократится: снос и ставка дисконтирования компенсируют друг друга"
    explanation: >
      Цена дериватива — дисконтированное ожидание по мере Q, в которой дисконтированная цена акции —
      мартингал, то есть снос равен r. С реальным сносом колл чаще оказывается в деньгах, и цена
      завышена: захеджировавшись акцией, продавец заработал бы на разнице без риска. Компенсации нет:
      дисконтирование по r при сносе μ несогласовано. Для корректности нужно менять одновременно снос
      и ставку дисконтирования опциона, которая заранее неизвестна.

  - question: "Какое утверждение о дереве CRR верно?"
    options:
      - text: "При n → ∞ цена европейского опциона сходится к Блэку–Шоулзу, но с колебаниями ошибки между чётным и нечётным n"
        correct: true
      - text: "Цена американского колла на акцию без дивидендов по дереву выше, чем европейского"
      - text: "Риск-нейтральная вероятность в дереве зависит от ожидаемой доходности акции"
      - text: "Для американского пута досрочное исполнение проверяется только в последнем слое"
    explanation: >
      Дерево сходится к логнормальной модели по центральной предельной теореме, ошибка убывает как
      1/n с осцилляцией, связанной с положением страйка относительно узлов. Американский колл без
      дивидендов не исполняют досрочно, и дерево это покажет. Вероятность q = (e^(rΔt) − d)/(u − d)
      от реального сноса не зависит. Досрочное исполнение проверяется в каждом узле, иначе
      американский опцион не отличим от европейского.

  - question: "Позиция: 1000 купленных опционов, дельта захеджирована. Гамма одного опциона 0,05, тета позиции −150 рублей в день. За день акция сдвинулась на 3 рубля. Каков примерный P&L позиции?"
    options:
      - text: "+75 рублей"
        correct: true
      - text: "+225 рублей"
      - text: "−150 рублей"
      - text: "+3 000 рублей"
    explanation: >
      Гамма-составляющая: ½·Γ·(δS)² = ½·0,05·1000·9 = 225. Тета: −150. Итого +75. 225 — забыта тета.
      −150 — забыт вклад гаммы, как будто цена не двигалась. 3000 — дельта умножена на движение,
      хотя дельта захеджирована и в P&L не входит.

  - question: "Трейдер видит, что подразумеваемая волатильность путов на индекс со страйком на 15% ниже рынка — 32%, а опционов на деньгах — 20%. Он считает эти путы «переоценёнными» и предлагает продать их, захеджировав дельту. Как оценить идею?"
    options:
      - text: "Высокая IV низких страйков — нормальная цена хвостового риска, а не ошибка; продажа приносит премию в среднем, но создаёт позицию с отрицательной гаммой и вегой, которая сильно теряет при обвале"
        correct: true
      - text: "Это арбитраж: у одного актива должна быть одна волатильность"
      - text: "Идея безрисковая, если хеджировать дельту непрерывно"
      - text: "Путы недооценены: IV должна быть ещё выше"
    explanation: >
      Перекос отражает толстый левый хвост и спрос на страховку. Продажа таких путов — известная
      стратегия с положительной средней доходностью и редкими крупными убытками, а не арбитраж.
      Дельта-хедж не защищает от скачка, роста волатильности и изменения перекоса при падении.
      Утверждать, что путы недооценены, по одному сравнению с ATM-волатильностью тоже нельзя.

  - question: "Банк предлагает годовой продукт с защитой капитала на индекс в валюте со ставкой 2% годовых. Маржа банка — 1%, колл на деньгах стоит 8% номинала. Какой коэффициент участия справедлив, и что с ним будет, если ставки вырастут до 13%?"
    options:
      - text: "Около 12%; при ставке 13% участие вырастет в несколько раз, потому что облигационная часть дешевеет"
        correct: true
      - text: "Около 100%: защита капитала всегда даёт полное участие"
      - text: "Около 12%; при росте ставок участие упадёт, потому что облигация дороже"
      - text: "Около 88%: 100% минус маржа и колл"
    explanation: >
      Облигация 100·e^(−0,02) = 98,02, на опционы остаётся 100 − 98,02 − 1 = 0,98, участие 0,98/8 ≈ 12%.
      При 13% облигация стоит 87,81, и на опционы остаётся около 11,2 — в 11 раз больше. Колл при
      высокой ставке тоже дорожает, но гораздо меньше, так что участие растёт в разы. Полное участие
      не гарантировано: его определяет бюджет на опционы. При росте ставок облигация дешевеет, а не
      дорожает. 88% получится, если вычесть из 100 маржу и цену колла, но коэффициент участия —
      это отношение бюджета к цене колла.

  - question: "После резкого падения рынка несколько банков предлагают автоколлы с купонами заметно выше обычного при той же цене размещения 100. Какое объяснение наиболее вероятно?"
    options:
      - text: "Подразумеваемая волатильность выросла: проданный инвестором пут с барьером стал дороже, и банк может отдать часть его стоимости в купон, сохраняя маржу"
        correct: true
      - text: "Банки ожидают роста рынка и делятся прогнозом с клиентами"
      - text: "Риск продукта снизился: после падения цена уже низкая"
      - text: "Купоны выросли из-за снижения процентных ставок"
    explanation: >
      Купон автоколла оплачивается продажей инвестором опционов банку, прежде всего пута с барьером.
      При высокой волатильности этот пут стоит дороже, и купон можно поднять. Прогноз банка в цену не
      входит: оценка риск-нейтральная. Риск не снизился: волатильность выше, значит, вероятность
      пробить барьер тоже выше. Снижение ставок, наоборот, удорожает облигационную часть и уменьшает
      бюджет на купоны.
