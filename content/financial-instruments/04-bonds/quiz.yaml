pass_score: 70
questions:
  - question: "ОФЗ номиналом 1000 с купоном 40 рублей раз в полгода котируется по 92,50. Купонный период 182 дня, с прошлой выплаты прошло 45 дней. Сколько заплатит покупатель без учёта комиссий?"
    options:
      - text: "925,00"
      - text: "934,89"
        correct: true
      - text: "965,00"
      - text: "924,89"
    explanation: >
      НКД = 40·45/182 = 9,89. К оплате — чистая цена плюс НКД: 925,00 + 9,89 = 934,89. 925,00 —
      только чистая цена. 965,00 — к цене прибавлен весь купон, а не накопленная часть. 924,89 —
      НКД ошибочно вычтен: это продавец получает компенсацию, а не покупатель.

  - question: "Облигация с фиксированным купоном и флоатер того же эмитента погашаются через 5 лет. Рыночные ставки резко выросли, кредитное качество эмитента не изменилось. Что произойдёт с ценами?"
    options:
      - text: "Обе цены заметно упадут"
      - text: "Цена облигации с фиксированным купоном заметно упадёт, флоатер останется около номинала"
        correct: true
      - text: "Флоатер подешевеет сильнее: его купон будет пересматриваться"
      - text: "Обе цены не изменятся до даты погашения"
    explanation: >
      Процентная дюрация флоатера — время до ближайшего пересмотра купона: на следующей дате
      купон поднимется до новых ставок, и бумага снова будет стоить номинал. У бумаги с
      фиксированным купоном потоки неизменны, а дисконтируются по более высокой ставке, и с
      дюрацией около 4 лет цена падает сильно. Пересмотр купона защищает флоатер, а не вредит
      ему. Цены меняются каждый день, а не только в погашение.

  - question: "Дисконт-факторы: P(0,1) = 0,90, P(0,2) = 0,80. Какова форвардная ставка на второй год с ежегодным начислением?"
    options:
      - text: "12,5%"
        correct: true
      - text: "11,1%"
      - text: "11,8%"
      - text: "10,0%"
    explanation: >
      1 + f(1,2) = P(0,1)/P(0,2) = 0,90/0,80 = 1,125, то есть 12,5%. 11,1% — спот-ставка на
      1 год (1/0,9 − 1). 11,8% — спот-ставка на 2 года (0,8^(−1/2) − 1): это средняя ставка за
      два года, а не ставка второго года. 10,0% — разность дисконт-факторов, а не их отношение.
      Форвард выше обеих спот-ставок: чтобы средняя за два года была 11,8% при 11,1% в первый
      год, второй год должен дать больше.

  - question: "Облигация: модифицированная дюрация 6, выпуклость 50, цена 100. Как изменится цена при росте доходности на 100 б.п. (оценка второго порядка)?"
    options:
      - text: "−6,00"
      - text: "−5,75"
        correct: true
      - text: "−6,25"
      - text: "−5,50"
    explanation: >
      ΔP/P ≈ −D_mod·Δy + ½·C·Δy² = −6·0,01 + 0,5·50·0,0001 = −0,06 + 0,0025 = −5,75%. Цена
      100, изменение −5,75. −6,00 — только дюрация. −6,25 — член выпуклости взят с неправильным
      знаком: выпуклость всегда смягчает падение и усиливает рост. −5,50 — выпуклость учтена
      без множителя ½.

  - question: "Позиция: 500 млн номинала облигации с DV01 = 0,045 на 100 номинала. Хедж — облигация с DV01 = 0,030 на 100 номинала. Сколько номинала продать?"
    options:
      - text: "333 млн"
      - text: "500 млн"
      - text: "750 млн"
        correct: true
      - text: "225 млн"
    explanation: >
      Нужно, чтобы DV01 позиций совпали: 500·0,045 = N·0,030, откуда N = 750 млн. У бумаги для
      хеджа DV01 на номинал меньше, поэтому её нужно больше. 333 млн — пропорция перевёрнута.
      500 млн — равный номинал не выравнивает риск. 225 млн — это DV01 позиции в тысячах
      рублей, а не номинал.

  - question: "Трёхлетняя облигация компании торгуется со спредом 300 б.п. к безрисковой кривой. Рынок закладывает возмещение 40%. Какова приблизительная риск-нейтральная интенсивность дефолтов?"
    options:
      - text: "3% в год"
      - text: "5% в год"
        correct: true
      - text: "1,8% в год"
      - text: "7,5% в год"
    explanation: >
      По кредитному треугольнику s = λ(1 − R), откуда λ = 0,03/0,6 = 5%. 3% — спред принят за
      интенсивность без учёта возмещения. 1,8% — умножение на (1 − R) вместо деления. 7,5% —
      деление на R вместо (1 − R). Риск-нейтральная интенсивность выше исторической частоты
      дефолтов: в спреде есть премии за риск и ликвидность.

  - question: "Банк занял 50 млн рублей по РЕПО на 14 дней под 14,2% годовых, передав ОФЗ рыночной стоимостью 55 млн. Через неделю ОФЗ подешевели до 51 млн. Что верно?"
    options:
      - text: "Рыночный риск ОФЗ несёт банк-заёмщик; кредитор может потребовать довнести обеспечение"
        correct: true
      - text: "Кредитор теряет 4 млн, так как бумаги сейчас у него"
      - text: "Сделка автоматически расторгается, потому что упала стоимость залога"
      - text: "Сумма выкупа уменьшается пропорционально цене бумаг"
    explanation: >
      Цена второй части фиксирована: 50 млн · (1 + 0,142·14/365) = 50,27 млн, и заёмщик обязан
      её заплатить, сколько бы ни стоили бумаги. Весь рыночный риск на нём. Дисконт был 5 млн
      (9%), а теперь залог 51 млн покрывает долг с запасом всего около 1,5% — это повод для
      маржин-колла. Кредитор теряет, только если заёмщик объявит дефолт, а залог не покроет
      долг. Падение залога не расторгает сделку и не меняет сумму выкупа.
