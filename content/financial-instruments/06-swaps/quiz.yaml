pass_score: 70
questions:
  - question: "Дисконт-факторы на 1, 2 и 3 года — 0,90, 0,81 и 0,73, платежи ежегодные. Какова справедливая ставка трёхлетнего процентного свопа?"
    options:
      - text: "11,07%"
        correct: true
      - text: "10,96%"
      - text: "9,00%"
      - text: "12,33%"
    explanation: >
      S = (1 − P(0,3))/(P1 + P2 + P3) = 0,27/2,44 = 11,07%. 10,96% — форвардная ставка третьего
      года (0,81/0,73 − 1): ставка свопа усредняет все форварды с весами дисконт-факторов, а не
      берёт последний. 9,00% — 0,27/3, деление на число лет без дисконтирования. 12,33% — простая
      годовая ставка на три года ((1/0,73 − 1)/3): она не учитывает, что по свопу платят каждый год.

  - question: "Банк платит фиксированные 10% по свопу с номиналом 500 млн. Сейчас рыночная ставка свопа на оставшийся срок — 11%, аннуитет по OIS — 3,2. Сколько стоит своп для банка?"
    options:
      - text: "+16 млн"
        correct: true
      - text: "−16 млн"
      - text: "+5 млн"
      - text: "0: своп заключён по рыночной ставке своего времени"
    explanation: >
      V_payer = N·(S_нов − K)·A = 500 млн·1%·3,2 = +16 млн. Банк платит 10%, а рынок сейчас требует
      11%: право платить меньше рынка ещё 3–4 года стоит денег. −16 млн — стоимость для получателя
      фиксированной ставки. +5 млн — разница ставок за один год без дисконтирования и без учёта
      остальных лет. Ноль был только в момент заключения.

  - question: "Почему процентный своп между двумя банками с ежедневной денежной вариационной маржей дисконтируют по кривой OIS, а не по кривой ставки, к которой привязана плавающая нога?"
    options:
      - text: "Стоимость свопа полностью обеспечена денежным залогом, на который начисляется ставка овернайт, — это и есть стоимость финансирования позиции"
        correct: true
      - text: "Так требует ISDA независимо от условий обеспечения"
      - text: "Кривая OIS всегда ниже, поэтому стоимость свопа для обеих сторон получается выше"
      - text: "Плавающая нога по индексу всегда стоит номинал, и её не нужно дисконтировать"
    explanation: >
      Если позиция каждый день обеспечивается деньгами под ставку овернайт, её финансирование
      безрисково и стоит ровно эту ставку, поэтому дисконтирование по OIS. ISDA ставку
      дисконтирования не предписывает: она следует из условий CSA, и без залога картина другая.
      Более низкая кривая не делает своп выгоднее обеим сторонам: стоимость для одной — минус
      стоимость для другой. Плавающая нога по индексу, отличному от ставки дисконтирования,
      номиналу не равна — поэтому и нужен мультикривой подход.

  - question: "Банк получает фиксированную ставку по свопу с номиналом 2 млрд рублей и аннуитетом 4,0. Что произойдёт при параллельном росте ставок на 10 б.п.?"
    options:
      - text: "Банк потеряет около 8 млн рублей"
        correct: true
      - text: "Банк заработает около 8 млн рублей"
      - text: "Банк потеряет около 800 тысяч рублей"
      - text: "Стоимость не изменится: платежи по плавающей ноге вырастут вместе со ставками"
    explanation: >
      DV01 = N·A·0,0001 = 2 млрд·4·0,0001 = 800 тысяч на 1 б.п., на 10 б.п. — 8 млн. Получатель
      фиксированной ставки похож на держателя облигации: при росте ставок теряет. 800 тысяч —
      это DV01, а не изменение на 10 б.п. Плавающие платежи действительно вырастут, но банк их
      платит, а не получает, поэтому стоимость падает.

  - question: "Компания заменила юаневый долг рублёвым через кросс-валютный своп на 1 млрд CNY по курсу 11. Через год юань подорожал до 14,3 рубля, ставки не изменились. Что верно?"
    options:
      - text: "Для банка своп стоит около −3,3 млрд рублей, а требование банка к компании — 3,3 млрд, 30% номинала"
      - text: "Для компании своп стоит около +3,3 млрд рублей, и у банка возникло кредитное требование к компании на эту сумму"
      - text: "Для компании своп стоит около +3,3 млрд рублей, и у компании возникло кредитное требование к банку на эту сумму"
        correct: true
      - text: "Стоимость свопа около нуля: ставки не изменились, а курсовой риск несут облигации"
    explanation: >
      Компания получает юани и платит рубли: V = 14,3·1 млрд − 11 млрд = +3,3 млрд рублей для
      компании. Положительная стоимость — это требование к контрагенту, то есть компания рискует
      дефолтом банка. Банку своп стоит −3,3 млрд, и он должен компании, а не наоборот. Если бы
      юань подешевел, требование было бы у банка к компании. Нулевая стоимость неверна: у
      кросс-валютного свопа главный риск — курс, из-за обмена номиналом.

  - question: "Хедж-фонд по TRS получает полную доходность корзины акций на 2 млрд и платит RUONIA + 1,5% годовых (RUONIA — 14%). За квартал цены упали на 9%, дивиденды — 1%. Каков нетто-платёж?"
    options:
      - text: "Фонд платит банку 237,5 млн"
        correct: true
      - text: "Фонд платит банку 160 млн"
      - text: "Банк платит фонду 77,5 млн"
      - text: "Фонд платит банку 277,5 млн"
    explanation: >
      Полная доходность: −9% + 1% = −8%, то есть 160 млн, которые платит фонд (он получает
      отрицательную доходность). Финансирование: 2 млрд·15,5%·0,25 = 77,5 млн, тоже платит фонд.
      Итого 237,5 млн. 160 млн — забыто финансирование. «Банк платит 77,5» — перепутано
      направление финансовой ноги. 277,5 млн — дивиденды вычтены (−9% − 1% = −10%), хотя они часть
      полной доходности в его пользу.

  - question: "С обанкротившимся контрагентом под одним генеральным соглашением ISDA три сделки стоимостью (для вас) +80, −60 и +10 млн. Возмещение по требованиям — 30%. Каков убыток относительно рыночной стоимости портфеля?"
    options:
      - text: "21 млн"
        correct: true
      - text: "63 млн"
      - text: "30 млн"
      - text: "56 млн"
    explanation: >
      С ликвидационным неттингом все сделки сворачиваются в одно требование: 80 − 60 + 10 = 30 млн.
      Возмещение 30% — 9 млн, убыток 21 млн. 63 млн — без неттинга: вы платите 60 млн в полном
      объёме, а по требованиям на 90 млн получаете 27 млн, итог −33 против рыночных +30. 30 млн —
      забыто возмещение. 56 млн — учтена только крупнейшая положительная сделка.

  - question: "Компания взяла кредит по ставке RUONIA + 3% и, чтобы зафиксировать расходы, стала плательщиком фиксированной ставки по свопу на ключевую ставку ЦБ (он оказался дешевле свопа на RUONIA). Какой риск остался?"
    options:
      - text: "Базисный риск между ключевой ставкой и RUONIA: если RUONIA вырастет относительно ключевой, расходы окажутся выше зафиксированных"
        correct: true
      - text: "Никакого: обе ставки задаёт Банк России, и они совпадают"
      - text: "Риск роста ключевой ставки: своп на неё не защищает от повышения"
      - text: "Только кредитный риск банка по кредиту"
    explanation: >
      Своп приносит компании ключевую ставку, а по кредиту она платит RUONIA. Разница между ними —
      открытая позиция. Обычно RUONIA держится чуть ниже ключевой, но спред меняется: при
      дефиците ликвидности в банковской системе RUONIA поднимается выше. Ставки не совпадают —
      ключевая задаёт центр коридора, а RUONIA складывается из сделок. От роста ключевой своп
      защищает: компания получает её по плавающей ноге. Кредитный риск по кредиту несёт банк, а у
      компании есть риск контрагента по свопу — но главный открытый риск здесь базисный.
