pass_score: 70
questions:
  - question: "Фонд держит облигации компании и купил на них защиту CDS у банка. Какой риск остаётся у фонда?"
    options:
      - text: "Риск одновременного дефолта компании и банка-продавца защиты, а также базисный риск между облигацией и CDS"
        correct: true
      - text: "Никакого: облигация и защита вместе безрисковы"
      - text: "Только процентный риск облигации"
      - text: "Риск того, что компания объявит дефолт"
    explanation: >
      Защита работает, только если продавец способен заплатить в момент кредитного события.
      Дефолты часто коррелируют (wrong-way risk). Кроме того, выплата по аукциону может не совпасть с
      потерей по конкретной облигации, а спред CDS и спред облигации расходятся — это базис.
      Процентный риск облигации тоже остаётся (купон фиксированный), но это не единственный риск.
      Сам риск дефолта компании перенесён на банк.

  - question: "Пятилетний CDS: справедливый спред 400 б.п., стандартный купон 100 б.п., RPV01 = 4,0. Что происходит при заключении сделки покупателем защиты на 10 млн?"
    options:
      - text: "Покупатель платит продавцу авансом около 1,2 млн и затем 1% годовых"
        correct: true
      - text: "Продавец платит покупателю авансом около 1,2 млн"
      - text: "Покупатель платит 4% годовых без аванса"
      - text: "Покупатель платит авансом 1,6 млн: 400 б.п. на RPV01"
    explanation: >
      Upfront ≈ (s* − c)·RPV01 = (4% − 1%)·4,0 = 12% номинала, то есть 1,2 млн. Купон ниже рыночного
      спреда, поэтому покупатель защиты доплачивает разницу вперёд. Продавец платил бы аванс, если
      бы спред был ниже купона. Стандарт рынка — фиксированный купон с авансом, а не произвольный
      спред. 1,6 млн — не вычтен купон.

  - question: "По модели Мертона компания с активами 100 и долгом 70 имеет спред 73 б.п. Что произойдёт со спредом, если компания переведёт бизнес в более рискованные активы (волатильность активов вырастет), не меняя долга?"
    options:
      - text: "Спред вырастет, а капитал акционеров подорожает за счёт кредиторов"
        correct: true
      - text: "Спред вырастет, и капитал подешевеет вместе с долгом"
      - text: "Спред не изменится: долговая нагрузка та же"
      - text: "Спред упадёт: более рискованные активы в среднем доходнее"
    explanation: >
      Капитал — колл на активы, долг — активы минус колл, то есть безрисковый долг минус пут.
      Рост волатильности удорожает колл (капитал) и пут, поэтому долг дешевеет, а его доходность и
      спред растут. Это конфликт интересов акционеров и кредиторов: при неизменной стоимости
      активов рост риска перекладывает стоимость от кредиторов к акционерам. Ожидаемая доходность
      активов в оценке, как всегда, не участвует.

  - question: "Банк продал суперстарший транш CDO (убытки пула 15–100%) как «почти безрисковый». Что сильнее всего увеличит риск этой позиции при неизменных вероятностях дефолта отдельных заёмщиков?"
    options:
      - text: "Рост корреляции дефолтов в пуле"
        correct: true
      - text: "Снижение корреляции дефолтов"
      - text: "Рост доли возмещения при дефолте"
      - text: "Сокращение срока транша"
    explanation: >
      Средний убыток пула от корреляции не зависит, а распределение — зависит. При высокой корреляции
      дефолты происходят разом, и убыток пула чаще выходит за 15%. При низкой корреляции убыток
      концентрируется около среднего, и суперстаршему траншу ничего не грозит. Рост возмещения и
      сокращение срока снижают убытки. Именно недооценка корреляции ипотечных дефолтов разрушила
      старшие транши в 2008 году.

  - question: "Компания с кредитом по плавающей ставке хочет ограничить ставку на 3 года, но не платить премию. Какая конструкция это даёт и чем она платит за защиту?"
    options:
      - text: "Купить кэп и продать флор (коллар): защита от роста оплачивается отказом от выгоды при падении ставок ниже страйка флора"
        correct: true
      - text: "Купить кэп и продать кэп с более высоким страйком: защита полная и бесплатная"
      - text: "Купить payer-свопцион: он бесплатен, потому что исполняется только при росте ставок"
      - text: "Продать флор: премия флора покроет рост ставок"
    explanation: >
      Процентный коллар — аналог коллара на акцию (модуль 7): премия за кэп компенсируется премией
      за проданный флор. Компания платит не больше страйка кэпа, но и не меньше страйка флора.
      Кэп-спред ограничивает защиту сверху: выше второго страйка ставка снова растёт без
      ограничения. Свопцион не бесплатен, он стоит премию. Один проданный флор только увеличивает
      риск: при росте ставок он ничего не даёт.

  - question: "Как изменится цена down-and-out колла (барьер ниже текущей цены), если в договоре барьер проверяется только по ценам закрытия, а не непрерывно?"
    options:
      - text: "Цена вырастет: барьер проверяется реже, и опцион реже исчезает"
        correct: true
      - text: "Цена упадёт: цена закрытия чаще оказывается у барьера"
      - text: "Не изменится: барьер тот же"
      - text: "Цена вырастет, но только если волатильность выше 50%"
    explanation: >
      Цена может опуститься ниже барьера внутри дня и вернуться к закрытию, и опцион выживет.
      Вероятность выбывания меньше — knock-out опцион дороже. Эффект описывает поправка
      Броуди–Глассермана–Коу: дискретный барьер эквивалентен непрерывному, сдвинутому от цены на
      0,5826·σ·√Δt. Эффект есть при любой волатильности, с её ростом он усиливается.

  - question: "Банк оценивает азиатский опцион методом Монте-Карло: 50 000 сценариев дают 3,69 ± 0,05. Отдел риска требует точность ± 0,005. Какой путь разумнее?"
    options:
      - text: "Применить контрольную переменную — геометрический азиатский опцион с известной ценой"
        correct: true
      - text: "Увеличить число сценариев в 10 раз"
      - text: "Уменьшить шаг по времени в 10 раз"
      - text: "Заменить Монте-Карло формулой Блэка–Шоулза для обычного опциона"
    explanation: >
      Ошибка убывает как 1/√n: для десятикратного улучшения нужно в 100 раз больше сценариев, а не в
      10. Контрольная переменная с корреляцией почти 1 уменьшает дисперсию в тысячи раз почти
      бесплатно. Уменьшение шага не сокращает статистическую ошибку, если наблюдения среднего и так
      дневные. Формула для обычного опциона даёт другую, более высокую цену: среднее менее
      волатильно, чем конечная цена.

  - question: "Инвестору предлагают годовой продукт «100% защиты капитала + 94% роста индекса МосБиржи». Что НЕ является платой за защиту?"
    options:
      - text: "Возможность получить больше 100% роста индекса, если рынок вырастет резко"
        correct: true
      - text: "Дивиденды по акциям индекса, которые инвестор не получает"
      - text: "Процентный доход, который принёс бы депозит на весь срок"
      - text: "Кредитный риск банка-эмитента"
    explanation: >
      Коэффициент участия меньше 100%, так что больше роста индекса продукт не даёт — и никакой
      такой возможности инвестор не отдаёт. Остальное — реальные издержки защиты. Колл на ценовой
      индекс не учитывает дивиденды (около 8% в год). Облигационная часть приносит меньше депозита:
      часть процентов уходит на опционы и маржу. Защита — обязательство эмитента, и при его
      дефолте её нет.
