pass_score: 70
questions:
  - question: "Вы прочитали выгрузку в pandas без указания типов, и таблица участников загрузилась с числовыми ИНН. Что произойдёт дальше?"
    options:
      - text: "ИНН с ведущим нулём потеряет первый знак, и один участник распадётся на двух разных — при этом ничего не упадёт с ошибкой"
        correct: true
      - text: Соединение таблиц по ИНН завершится ошибкой типов и потерю данных вы заметите сразу
      - text: "Ничего страшного: ИНН всегда начинается со значащей цифры"
      - text: Все ИНН индивидуальных предпринимателей будут отброшены как слишком длинные
    explanation: >
      Коды регионов начинаются с нуля (например, ИНН вида 0277…), и приведение к числу
      молча срезает ведущий ноль. Опасность именно в тишине: исключения не будет,
      просто граф участников окажется беднее, чем должен. Ошибки типов при соединении
      обычно тоже не возникает — pandas приведёт типы сам. Длина ИНН индивидуального
      предпринимателя на чтение не влияет.

  - question: Почему единицей наблюдения выбирают лот, а не извещение?
    options:
      - text: Потому что торг по каждому лоту идёт отдельно, и агрегирование по извещению смешивает несопоставимые предметы закупки
        correct: true
      - text: Потому что реестровый номер присваивается лоту, а не извещению
      - text: Потому что многолотовые закупки по 44-ФЗ запрещены
      - text: Потому что протокол подведения итогов формируется отдельно по каждому лоту
    explanation: >
      У каждого лота свои участники, свои цены и свой победитель, поэтому число
      участников по извещению окажется суммой по лотам, а минимальная цена — минимумом
      по разным товарам. Реестровый номер присваивается как раз извещению, из-за чего
      идентификатор лота и приходится собирать как пару. Многолотовые закупки
      разрешены, а форма протокола сути дела не меняет.

  - question: Что означает положительное значение показателя gap_to_min — разрыва между ценой победителя и минимальным предложением в лоте?
    options:
      - text: Участники, предложившие более низкую цену, до контракта не дошли — например, их заявки отклонили при рассмотрении
        correct: true
      - text: Победитель нарушил правила шага аукциона
      - text: В лоте применены антидемпинговые меры
      - text: Данные о ценах разобраны с ошибкой, показатель не может быть положительным
    explanation: >
      В нормально прошедшей закупке побеждает тот, кто предложил меньше всех, и разрыв
      равен нулю. Положительный разрыв возникает, когда более дешёвые участники выбыли,
      и это ключевая подпись схемы «таран». Ошибкой разбора это не является — наоборот,
      строгий ноль по всей выборке как раз указывает на ошибку: победителя вычислили
      как минимум цены вместо того, чтобы взять из протокола. Антидемпинговые меры
      влияют на глубину снижения, а не на этот разрыв.

  - question: В обучении с учителем на данных закупок вы помечаете нулём все закупки, по которым нет решения ФАС. Что на самом деле означает этот ноль?
    options:
      - text: Нарушение не было выявлено, что не равно утверждению об отсутствии нарушения
        correct: true
      - text: Нарушения не было — это подтверждено проверкой контрольного органа
      - text: Закупка не проверялась и потому должна быть исключена из выборки
      - text: Решение по закупке ещё не вступило в силу
    explanation: >
      Проверке подвергается ничтожная доля закупок, поэтому отсутствие решения говорит
      только об отсутствии выявленного нарушения. Трактовать это как подтверждённую
      добросовестность — основная методологическая ошибка в работах по теме; именно
      из-за неё задачу честнее ставить как обучение на положительных и неразмеченных
      данных. Исключать все непроверенные закупки нельзя — тогда не останется выборки.
      Незавершённость производства объясняет лишь часть случаев, а не все.

  - question: "После сопоставления решений ФАС со своей выгрузкой вы получили 23 размеченные закупки в сегменте. Какая постановка задачи уместна?"
    options:
      - text: Скрининг без учителя как основной метод, а известные дела — как проверочный набор
        correct: true
      - text: "Обучение с учителем: 23 примера достаточно при использовании перевзвешивания классов"
      - text: Расширить положительный класс, добавив закупки с жалобами участников
      - text: "Отказаться от темы: данных для работы недостаточно"
    explanation: >
      На двух десятках примеров обучение с учителем даст оценку качества с доверительным
      интервалом шире самого результата, но этих примеров вполне хватает, чтобы
      проверить, поднимает ли скрининг известные нарушения наверх. Перевзвешивание
      классов борется с дисбалансом, а не с малым абсолютным числом положительных
      примеров. Добавление жалоб подменяет целевую переменную другим явлением.
      Отказываться от темы не нужно: скрининг с проверкой на известных делах —
      полноценная и защитимая постановка.

  - question: Почему период выборки в домашнем задании заканчивается не позднее чем за два года до текущей даты?
    options:
      - text: Потому что между закупкой и вступившим в силу решением проходит от года до нескольких лет, и свежий период останется без меток
        correct: true
      - text: Потому что данные за последние два года ещё не выгружаются через сервисы отдачи ЕИС
      - text: Потому что процедуры последних лет проводятся по изменившимся правилам и несопоставимы
      - text: Потому что срок давности по делам о картелях составляет два года
    explanation: >
      Проверка, рассмотрение дела и оспаривание в суде занимают годы, поэтому в свежем
      периоде положительных меток почти нет — и их отсутствие нельзя принимать за
      отсутствие нарушений. Данные свежего периода из ЕИС доступны, а правила процедуры
      после унификации 2022 года сопоставимы в пределах любого недавнего трёхлетия.

  - question: Какие из перечисленных действий при сборке датасета приведут к тихой порче данных, которую легко не заметить?
    options:
      - text: Соединение таблиц ставок и контрактов только по ИНН без идентификатора закупки
        correct: true
      - text: Использование наименования организации как ключа участника вместо ИНН
        correct: true
      - text: Сохранение всех версий протокола с указанием номера версии
      - text: Вынесение закупок с единственным участником в отдельную ветку анализа
    explanation: >
      Соединение по одному ИНН даёт декартово произведение — один поставщик исполняет
      сотни контрактов, и таблица распухает без всяких предупреждений. Наименование
      неуникально и меняется со временем, поэтому склеит разных участников и разделит
      одного. Два других действия — правильные приёмы: версии протоколов нужны, чтобы
      взять последнюю и при этом сохранить признак пересмотра, а закупки с единственным
      участником нельзя ни выбрасывать, ни смешивать с состоявшимися.
