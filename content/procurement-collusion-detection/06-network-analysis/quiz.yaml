pass_score: 70
questions:
  - question: Вы построили проекцию графа с весами, равными числу совместных участий, и обнаружили, что корреляция Спирмена между степенью вершины и числом участий участника равна 0,95. О чём это говорит?
    options:
      - text: Граф измеряет активность участников, а не отношения между ними, и веса нужно заменить превышением над ожидаемым по нулевой модели
        correct: true
      - text: На рынке действует крупный картель, охватывающий самых активных участников
      - text: Выборка слишком мала, и связи ещё не сформировались
      - text: "Это нормально: активные участники объективно чаще состоят в сговорах"
    explanation: >
      Компания, подающая заявки повсюду, пересекается со всеми просто в силу
      активности — сырая степень в проекции почти полностью определяется числом участий.
      Именно поэтому вес ребра измеряют как превышение фактического числа встреч над
      ожидаемым при случайном пересечении. Вывод о картеле из этой корреляции сделать
      нельзя: она была бы такой же на совершенно конкурентном рынке. Размер выборки
      на эту зависимость не влияет.

  - question: Почему номер сообщества, полученный методом Лувена, нельзя использовать как признак модели?
    options:
      - text: Потому что нумерация произвольна и не согласована между снимками графа — одно и то же число означает разные группы
        correct: true
      - text: Потому что номер сообщества является категориальным признаком с высокой мощностью
      - text: Потому что метод Лувена не гарантирует нахождения глобального оптимума модулярности
      - text: Потому что сообщества пересекаются, и участник может принадлежать нескольким
    explanation: >
      Метод присваивает сообществам произвольные номера при каждом запуске, поэтому
      сообщество номер 3 в первом квартале и во втором — разные группы, и признак
      не имеет устойчивого смысла. Использовать можно только величины, инвариантные
      к нумерации: размер сообщества, его плотность, долю встреч без торга. Высокая
      мощность категориального признака — обычная техническая трудность, решаемая
      кодированием, а отсутствие гарантии глобального оптимума не мешало бы признаку
      быть осмысленным. Разбиение методом Лувена непересекающееся.

  - question: Вы разделили выборку на обучающую и тестовую по времени, но граф построили один раз по всем данным. Почему оценка качества окажется завышенной?
    options:
      - text: Потому что признаки тестовых закупок вычислены из графа, в который эти закупки входили, и содержат информацию о собственном исходе и о будущем участников
        correct: true
      - text: Потому что в графе по всем данным больше вершин, и метрики становятся точнее
      - text: Потому что метод Лувена на большом графе даёт более крупные сообщества
      - text: "Оценка не будет завышена: модель обучалась только на обучающей выборке"
    explanation: >
      Разделение по времени должно применяться не только к обучению модели, но и к
      построению признаков: ребро между участниками тестовой закупки усилено в том
      числе её собственным исходом и их последующими встречами. Корректный приём —
      снимки графа, каждый из которых строится строго по предшествующим данным.
      Довод «модель обучалась только на train» не спасает: утечка произошла на этапе
      формирования признаков, а не обучения.

  - question: "Для выявления раздела рынка нужны пары, встречающиеся значимо реже ожидаемого. Почему нельзя просто перебрать все пары участников и посчитать левый хвост распределения?"
    options:
      - text: Потому что число пар растёт квадратично и в основном состоит из участников, которые и не должны были встречаться — кандидатов нужно ограничить содержательно
        correct: true
      - text: Потому что гипергеометрическое распределение не определено при нулевом числе совместных участий
      - text: Потому что раздел рынка проявляется только внутри одной закупки
      - text: Потому что для пар без встреч неизвестно число участий каждого из них
    explanation: >
      Десять тысяч участников дают около пятидесяти миллионов пар, подавляющее
      большинство которых — компании из разных отраслей и регионов, чьё непересечение
      ничего не значит. Поэтому кандидатов отбирают по содержательному критерию: общий
      сегмент, общий регион, достаточная активность каждого. Распределение при нулевом
      числе встреч определено прекрасно, число участий известно из данных, а раздел
      рынка по определению не наблюдается внутри одной процедуры — он и требует
      сетевого взгляда.

  - question: Вы ранжировали сообщества по внутренней плотности и получили в голове списка группы крупных подрядчиков региона. Что нужно изменить?
    options:
      - text: Ранжировать по отсутствию конкуренции внутри группы — доле встреч без торга, глубине снижения, концентрации побед
        correct: true
      - text: Увеличить порог значимости связей, чтобы в граф попадали только сильные рёбра
      - text: Перейти от метода Лувена к методу Лейдена
      - text: Ограничить размер сообществ тремя участниками
    explanation: >
      Плотное сообщество означает лишь то, что группа систематически встречается, —
      на узком рынке это неизбежно и законно. Отличие сговора в том, что при встречах
      участники не конкурируют, поэтому ранжировать нужно по показателям отсутствия
      конкуренции. Ужесточение порога значимости оставит в графе те же группы, только
      меньше; смена алгоритма разбиения меняет границы сообществ, но не критерий их
      оценки; жёсткое ограничение размера отсечёт настоящие группы из пяти-семи
      компаний.

  - question: Вы считаете p-значения для 500 000 пар участников. Почему поправка Бонферрони здесь обычно неприменима, а контроль доли ложных отклонений уместен?
    options:
      - text: Бонферрони контролирует вероятность хотя бы одной ошибки и при таком числе сравнений оставит почти без значимых связей; контроль доли ложных отклонений допускает известную долю ошибок и сохраняет чувствительность
        correct: true
      - text: Поправка Бонферрони неприменима к гипергеометрическому распределению
      - text: Контроль доли ложных отклонений не требует независимости наблюдений, а Бонферрони требует
      - text: Поправка Бонферрони применима только при числе сравнений меньше тысячи
    explanation: >
      Бонферрони делит уровень значимости на число сравнений, и при полумиллионе пар
      порог становится настолько строгим, что значимыми останутся единичные связи —
      скрининг потеряет чувствительность. Процедура Бенджамини — Хохберга контролирует
      ожидаемую долю ложных отклонений среди отклонённых гипотез, что для задачи
      предварительного отбора и требуется. Обе поправки не зависят от вида
      распределения статистики, а Бонферрони как раз не требует независимости
      и формальных ограничений на число сравнений не имеет.

  - question: При расчёте ожидаемого числа встреч пары вы взяли общее число лотов N по всей выборке, включая лоты с единственным участником. Чем это плохо?
    options:
      - text: Такие лоты не порождают рёбер, но увеличивают N, из-за чего ожидаемое число встреч занижается и слишком многие пары выглядят значимыми
        correct: true
      - text: Такие лоты добавляют в граф изолированные вершины и замедляют расчёт
      - text: "Ничем: лоты с одним участником не влияют на расчёт"
      - text: Такие лоты завышают ожидаемое число встреч, и значимых связей окажется слишком мало
    explanation: >
      Ожидаемое число встреч пропорционально произведению объёмов участия, делённому
      на N. Завышение N уменьшает знаменатель нулевой модели по смыслу — ожидание
      падает, наблюдаемые встречи начинают выглядеть избыточными, и в число значимых
      попадают обычные пары. Считать N нужно по лотам, где участников было не менее
      двух. Изолированные вершины — техническая мелочь, а утверждение о безвредности
      неверно именно из-за искажения нулевой модели.
