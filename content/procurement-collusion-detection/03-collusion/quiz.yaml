pass_score: 70
questions:
  - question: "В аукционе пять участников. Победитель снизил цену на 0,4 % от НМЦК. Двое участников, предложивших на 35 % и 44 % ниже НМЦК, отклонены комиссией как не соответствующие требованиям извещения. Какая схема объясняет картину лучше всего?"
    options:
      - text: "«Таран»"
        correct: true
      - text: Отказ от торга
      - text: Раздел рынка
      - text: Дробление закупки
    explanation: >
      Совокупность «победитель с почти нулевым снижением + отклонение именно тех, кто
      демпинговал сильнее всех» — это характерная подпись «тарана»: демпинг вытесняет
      добросовестных участников, а затем заявки демпингующих отбраковываются.
      Отказ от торга выглядел бы иначе: снижения не было бы ни у кого и отклонений
      не потребовалось бы. Раздел рынка не проявляется внутри одной закупки вообще,
      а дробление — это нарушение со стороны заказчика, не связанное с торгом.

  - question: Две крупные компании одного профиля работают в одном регионе, но за три года ни разу не участвовали в одной закупке, при этом каждая устойчиво выигрывает у своей группы заказчиков. Почему обычный признак частоты совместного участия эту ситуацию не поймает?
    options:
      - text: Потому что при разделе рынка подозрительна аномально низкая частота пересечений, а не высокая
        correct: true
      - text: Потому что признак совместного участия считается только внутри одной закупки
      - text: Потому что компании из разных сегментов ОКПД2 в граф не попадают
      - text: Потому что раздел рынка не запрещён законом
    explanation: >
      Раздел рынка — соглашение не пересекаться, поэтому его подпись противоположна по
      знаку: пара встречается реже, чем следовало бы ожидать при их профиле и географии.
      Признак совместного участия по определению считается по серии закупок, а не внутри
      одной. Ограничение по ОКПД2 — это решение аналитика, а не свойство метода. Раздел
      товарного рынка прямо запрещён пунктом 3 части 1 статьи 11.

  - question: Зачем к данным закупок необходимо присоединять сведения об учредителях участников из ЕГРЮЛ?
    options:
      - text: Чтобы понижать приоритет пар, входящих в одну группу лиц под общим контролем, — согласованность внутри такой группы выведена из-под запрета частью 7 статьи 11
        correct: true
      - text: Чтобы определить победителя закупки, если протокол итогов недоступен
      - text: Чтобы восстановить ИНН участников, которые в протоколах не публикуются
      - text: Чтобы рассчитать размер оборотного штрафа по статье 14.32 КоАП
    explanation: >
      Компании под общим контролем систематически ведут себя согласованно, и любой
      сетевой признак выведет их в топ подозрительных — но нарушением это не является,
      поэтому без фильтра по аффилированности голова вашего списка заполнится
      законными группами. ИНН участников публикуется в протоколе подведения итогов,
      победитель тоже, а расчёт штрафа — задача правоприменителя, не аналитика.

  - question: Вы разделили выборку по времени и положили в тест последние шесть месяцев. Положительных примеров в тесте почти не оказалось. Что произошло?
    options:
      - text: Решения по делам о картелях выносятся через год и более после закупки, поэтому свежий период ещё не размечен
        correct: true
      - text: Модель переобучилась и не нашла нарушений в новых данных
      - text: За последние полгода сговоров действительно стало меньше
      - text: Выгрузка свежего периода содержит ошибку и требует пересбора
    explanation: >
      Проверка, рассмотрение дела и оспаривание в суде занимают от года до нескольких
      лет, поэтому отсутствие меток в свежем периоде — свойство процедуры, а не данных
      и не модели. Вывод о снижении числа сговоров из этого делать нельзя ровно по той
      же причине. Переобучение здесь ни при чём: речь о составе разметки, а не о
      качестве предсказаний.

  - question: Как программа освобождения от ответственности за добровольное заявление о соглашении влияет на обучающую выборку?
    options:
      - text: В положительный класс попадают картели, выявленные по признанию, а не по следу в данных, и такие наблюдения могут не отличаться от добросовестных
        correct: true
      - text: Она уменьшает общее число дел и потому сокращает выборку
      - text: Она приводит к тому, что в решениях не указываются реестровые номера закупок
      - text: Она делает метки недостоверными, так как заявитель может оговорить конкурентов
    explanation: >
      Картель, раскрытый через добровольное заявление, мог вести себя в данных
      совершенно обычно — его нашли не по аномалии. Такие примеры создают в
      положительном классе подмножество, принципиально неотделимое от отрицательного,
      и это ограничение не лечится настройкой модели. Число дел программа не сокращает,
      а увеличивает; состав решений и достоверность установленных фактов она не меняет —
      решение всё равно выносится по итогам рассмотрения дела.

  - question: Какая формулировка целевой переменной корректна для задачи выявления сговора участников?
    options:
      - text: Закупка, в отношении участников которой вступившим в силу решением антимонопольного органа установлено нарушение пункта 2 части 1 статьи 11 Закона о защите конкуренции
        correct: true
      - text: Закупка, по которой в контрольный орган поступила жалоба участника
      - text: Закупка, победитель которой включён в реестр недобросовестных поставщиков
      - text: Закупка, по которой возбуждено дело о нарушении антимонопольного законодательства
    explanation: >
      Метка должна означать установленный и не отменённый факт нарушения именно той
      нормы, которая описывает сговор участников между собой. Жалоба — это позиция
      одной стороны и чаще инструмент конкурентной борьбы. Включение в РНП говорит об
      уклонении от контракта или нарушении при исполнении, а не о сговоре. Факт
      возбуждения дела не равен нарушению: часть дел прекращается, часть решений
      отменяется судом.

  - question: Почему признаки схемы «таран» и признаки отказа от торга плохо складываются в одну линейную скоринговую формулу?
    options:
      - text: "Потому что они по-разному направлены: «таран» даёт большой разрыв между ценой победителя и минимальным предложением, отказ от торга — отсутствие разрыва"
        correct: true
      - text: Потому что признаки «тарана» считаются по одной закупке, а отказ от торга — только по серии
      - text: Потому что отказ от торга не является нарушением
      - text: Потому что эти схемы встречаются в разных отраслях и выборки не пересекаются
    explanation: >
      Линейная сумма усредняет противоположно направленные сигналы, и закупка с ярким
      признаком одной схемы гасится отсутствием признаков другой. Отсюда решение:
      отдельный скоринг на схему либо модель, допускающая нелинейные взаимодействия,
      с обязательной проверкой вкладов признаков. Признаки обеих схем считаются и по
      закупке, и по серии; отказ от торга при согласованности запрещён так же, как
      и «таран»; отраслевого разделения между схемами нет.
