pass_score: 70
questions:
  - question: Вы оценили модель обычной перекрёстной проверкой с перемешиванием и получили точность в топ-100, равную 0,42. Что не так с этой оценкой?
    options:
      - text: Разрушены и временной порядок, и групповая структура — закупки одного дела попали и в обучение, и в проверку, поэтому модель узнаёт конкретные компании
        correct: true
      - text: Точность в топ-100 нельзя считать при перекрёстной проверке — только на отложенной выборке
      - text: Число 0,42 слишком велико и указывает на ошибку в расчёте метрики
      - text: "Ничего: перемешивание допустимо, если признаки построены без утечки"
    explanation: >
      Дело о картеле охватывает серию закупок одних и тех же участников, поэтому при
      случайном перемешивании модель обучается на части этих закупок и проверяется на
      остальных — она запоминает компании, а не поведение. Плюс нарушается временной
      порядок, ради которого и строились снимки признаков. Метрику в топ-k можно
      считать по любой проверочной выборке, а корректно построенные признаки не
      компенсируют неправильную схему разделения: утечка возвращается через групповую
      структуру.

  - question: Чтобы справиться с дисбалансом, коллега предлагает оставить в обучающей выборке все положительные примеры и равное им число случайных отрицательных. Что возразить?
    options:
      - text: Это меняет базовую частоту, из-за чего оценки вероятностей перестают соответствовать реальности; при необходимости следует взвешивать классы, а не менять состав выборки
        correct: true
      - text: Такой приём допустим только при числе положительных примеров более тысячи
      - text: "Возражать нечего: сбалансированная выборка всегда предпочтительнее"
      - text: Это приведёт к переобучению на отрицательном классе
    explanation: >
      Базовая частота — свойство задачи, и искусственное её изменение ломает
      калибровку: модель начнёт выдавать вероятности, соответствующие выдуманному
      миру, где каждая вторая закупка сговорная. Ранжирование при этом может и не
      пострадать, но любые выводы о вероятностях станут неверными; взвешивание классов
      даёт тот же эффект на обучение без искажения состава данных. Переобучение
      возникает по другим причинам, а порог в тысячу примеров ниоткуда не следует.

  - question: Как правильно выбрать k для метрики «точность в топ-k»?
    options:
      - text: Из пропускной способности последующей проверки — сколько закупок реально можно разобрать за период
        correct: true
      - text: Как число положительных примеров в проверочной выборке
      - text: Как фиксированную долю выборки, например 1 %, чтобы метрика была сравнима между работами
      - text: Подбором того значения, при котором модель показывает наилучший результат
    explanation: >
      Метрика должна отражать применение: список имеет смысл ровно настолько, насколько
      его успевают проверить, поэтому k задаётся возможностями проверяющего.
      Приравнивание k к числу положительных примеров делает метрику зависимой от
      полноты разметки, которая в этой задаче заведомо неполна. Фиксированная доля
      даёт несопоставимые абсолютные величины при разных размерах выборки. Подбор k
      под лучший результат — прямая подгонка отчётности.

  - question: Изолирующий лес обучен на всём наборе признаков закупки и выдаёт самые необычные наблюдения. Почему это плохой скрининг сговора?
    options:
      - text: "Потому что необычность и нарушение — разные вещи: сговорная закупка может быть обычной по большинству измерений, а необычная — законной"
        correct: true
      - text: Потому что изолирующий лес не работает с пропущенными значениями
      - text: Потому что методы поиска аномалий требуют размеченных данных для настройки
      - text: Потому что признаки закупки имеют разный масштаб, а метод к этому чувствителен
    explanation: >
      Метод отвечает на вопрос «что здесь непохоже на остальное», а не «где признаки
      сговора». В верх списка попадут закупки с экзотическим предметом, необычным
      размером или редким заказчиком. Осмысленное применение — искать аномалии
      в пространстве признаков, специально сконструированных под конкретные схемы,
      и тогда необычность означает сильное проявление схемы. Технические свойства
      метода — пропуски, масштаб — здесь второстепенны, а разметки он как раз не требует.

  - question: В разложении оценки по вкладам признаков для закупки из верхней части списка наибольший вклад даёт признак «доля побед участника», посчитанный по всей истории выборки. О чём это говорит?
    options:
      - text: "О вероятной утечке: признак содержит информацию о событиях после закупки, и его нужно пересчитать снимками"
        correct: true
      - text: О том, что доля побед — самый информативный признак задачи
      - text: О том, что модель недообучена и опирается на один признак
      - text: О том, что признак нуждается в нормировке внутри сегмента
    explanation: >
      Признак, посчитанный по всей истории, включает будущие победы участника, то есть
      сведения, недоступные в момент объявления закупки. Анализ вкладов — самый
      надёжный способ поймать такую ошибку, потому что метрики её не показывают:
      они, наоборот, улучшаются. Вывод об информативности признака делать нельзя
      именно потому, что его значение получено некорректно; нормировка проблему
      утечки не устраняет.

  - question: В отчёте приведено единственное число — средняя точность в топ-100 по скользящей проверке, равная 0,31. Чего не хватает и почему это важно?
    options:
      - text: "Значений по каждому периоду и их разброса: при десятках положительных примеров метрика сильно скачет, и среднее создаёт ложное впечатление устойчивости"
        correct: true
      - text: Доверительного интервала, рассчитанного по нормальному приближению
      - text: Сравнения с площадью под ROC-кривой на тех же данных
      - text: Значения полноты, без которого точность не интерпретируется
    explanation: >
      При малом числе положительных примеров результат отдельного квартала определяется
      единицами наблюдений, поэтому разброс между периодами может быть сопоставим
      с самим средним. Показать нужно ряд значений, а не одно число. Нормальное
      приближение при таких объёмах как раз плохо применимо; площадь под ROC-кривой
      на редком классе малоинформативна; полнота полезна, но она не заменяет сведений
      об устойчивости оценки.

  - question: Вы отобрали двадцать наиболее связанных с целевой переменной признаков из двухсот, а затем разделили выборку по времени и обучили модель. В чём ошибка?
    options:
      - text: Отбор признаков — часть обучения, и выполненный на всех данных он переносит информацию о проверочном периоде в модель
        correct: true
      - text: Двадцать признаков — слишком мало для этой задачи
      - text: Отбор признаков по связи с целевой переменной неприменим к разреженным классам
      - text: Ошибки нет, если модель после отбора обучалась только на обучающей выборке
    explanation: >
      Ранжирование признаков по связи с целевой переменной использует метки всей
      выборки, включая проверочный период, — значит, выбор состава признаков уже
      «видел» тест, и оценка окажется оптимистичной. Корректно отбирать признаки
      внутри каждого обучающего окна. Число признаков к делу не относится, а
      применимость критерия отбора к редкому классу — отдельный вопрос, не отменяющий
      требования выполнять отбор после разделения.
