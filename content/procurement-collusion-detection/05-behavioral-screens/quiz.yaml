pass_score: 70
questions:
  - question: "В лоте два участника. Вы считаете относительную дистанцию — разницу между первым и вторым предложением, делённую на стандартное отклонение проигравших. Что нужно сделать?"
    options:
      - text: Оставить значение отсутствующим — показатель при двух предложениях не определён
        correct: true
      - text: Подставить ноль, так как разброс проигравших нулевой
      - text: Взять стандартное отклонение по всем предложениям, включая победившее
      - text: Исключить такие лоты из выборки полностью
    explanation: >
      Стандартное отклонение по одному значению не определено, поэтому показателя
      просто нет — и отсутствующее значение честно это выражает. Подстановка нуля
      создаёт артефакт: модель выучит, что «ноль в этом столбце» означает «два
      участника», и будет использовать это как скрытый признак числа участников.
      Включение победившего предложения в знаменатель меняет смысл показателя.
      Исключать лоты нельзя: по ним считаются другие показатели.

  - question: Распределение разрыва до минимальной цены таково, что у 95 % лотов значение равно нулю, а у остальных оно велико. Почему для нормировки внутри сегмента здесь лучше перцентиль, чем z-оценка?
    options:
      - text: Потому что при сильно скошенном распределении среднее и дисперсия неустойчивы, и z-оценка будет прыгать от нескольких выбросов
        correct: true
      - text: Потому что z-оценка не определена для нулевых значений
      - text: Потому что перцентиль всегда точнее отражает величину отклонения
      - text: Потому что z-оценку нельзя считать по сегментам
    explanation: >
      Среднее и дисперсия рассчитаны на приблизительно симметричные распределения; при
      массе нулей и редких больших значениях несколько выбросов определяют обе величины,
      и нормировка становится нестабильной от сегмента к сегменту. Перцентиль
      устойчив к выбросам и одинаково читается везде. При этом «всегда точнее»
      неверно: на симметричных распределениях z-оценка сохраняет информацию о величине
      отклонения, которую перцентиль теряет.

  - question: "Вы посчитали долю побед участника как g[\"is_winner\"].cumsum() / g.cumcount(), не вычитая текущую строку. Что произойдёт?"
    options:
      - text: В признак попадёт исход текущей закупки, метрики на тесте вырастут, а на новых данных модель не воспроизведёт результат
        correct: true
      - text: Признак окажется смещён вниз на одно наблюдение и потребует калибровки
      - text: Возникнет деление на ноль у первого участия и расчёт остановится
      - text: "Ничего страшного: победа в текущей закупке — законная часть истории участника"
    explanation: >
      Кумулятивная сумма включает текущую строку, поэтому признак знает, выиграл ли
      участник именно эту закупку, — это прямая утечка целевой информации. Заметить её
      трудно: ошибок не будет, метрики окажутся лучше обычного. Деление на ноль здесь
      тоже возникнет, но это второстепенная проблема, решаемая маской. Считать исход
      текущей закупки частью её же предыстории нельзя по определению.

  - question: Почему закон Бенфорда плохо применим к итоговым ценам участников электронного аукциона?
    options:
      - text: Потому что цены получаются вычитанием шага, составляющего фиксированную долю начальной цены, и первые цифры определяются механикой торга
        correct: true
      - text: Потому что закон Бенфорда применим только к выборкам свыше миллиона наблюдений
      - text: Потому что цены в протоколах округляются до целых рублей
      - text: Потому что закон Бенфорда выявляет сговор заказчика, а не участников
    explanation: >
      Шаг аукциона составляет от 0,5 % до 5 % начальной цены, поэтому итоговые цены —
      не свободно возникающие числа, а результат арифметики от заданной величины;
      отклонение от закона здесь говорит о регламенте, а не о поведении участников.
      К начальной цене контракта, которую заказчик назначает относительно свободно,
      закон применим — но тогда это гипотеза о обосновании цены, то есть другая задача.
      Ограничения по размеру выборки и округление здесь не главное.

  - question: Как обычно ведёт себя коэффициент вариации предложений в сговорной закупке по сравнению с конкурентной, и почему?
    options:
      - text: Ниже, потому что координация убирает разброс, который порождала бы независимость издержек участников
        correct: true
      - text: Выше, потому что участники сговора специально подают сильно различающиеся цены
      - text: Не меняется, поскольку зависит только от числа участников
      - text: Ниже, потому что в сговорных закупках всегда меньше участников
    explanation: >
      В конкурентной закупке предложения отражают разные издержки разных компаний, и это
      даёт разброс; согласованные предложения такого разброса не порождают. Вариант про
      специально различающиеся цены описывает частный приём, но не общую закономерность,
      установленную в исследованиях скринингов. Число участников влияет на устойчивость
      оценки коэффициента, но не определяет её значение, и сговорные закупки не
      обязательно малочисленны — цена прикрытия как раз требует нескольких участников.

  - question: У участника, впервые вышедшего на торги, все накопительные признаки отсутствуют. Как правильно поступить?
    options:
      - text: Оставить признаки отсутствующими и добавить явный признак «первое участие»
        correct: true
      - text: Заполнить средними значениями по выборке
      - text: Заполнить нулями, так как побед действительно не было
      - text: Исключить такие наблюдения из обучения
    explanation: >
      Отсутствие истории — содержательное состояние, а не пробел: компании, созданные
      незадолго до конкретной закупки, фигурируют в нескольких схемах, и явный признак
      сохраняет эту информацию. Заполнение средними стирает различие между новичком и
      игроком со средними показателями. Заполнение нулями делает новичка похожим на
      участника, который много раз участвовал и ни разу не выиграл, — это другое
      поведение. Исключение наблюдений выбросит из выборки именно интересный случай.

  - question: "В вызове pd.merge_asof для присоединения квартальных снимков признаков задан параметр allow_exact_matches=False. Зачем?"
    options:
      - text: Чтобы снимок, сделанный ровно на дату закупки, не был к ней присоединён — он уже содержит информацию об этой закупке
        correct: true
      - text: Чтобы ускорить соединение за счёт отказа от проверки равенства
      - text: Чтобы исключить участников, встречающихся в обеих таблицах
      - text: Чтобы к закупке присоединялся ближайший снимок в любую сторону по времени
    explanation: >
      Снимок на дату закупки построен по истории, включающей саму эту закупку, поэтому
      совпадение дат нужно запретить — иначе возвращается та же утечка, от которой
      снимки и защищают. Направление поиска задаётся отдельным параметром direction,
      а на производительность и на состав участников этот флаг не влияет.
