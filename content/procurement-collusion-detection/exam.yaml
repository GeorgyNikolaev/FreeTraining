pass_score: 80
questions:
  - question: Ваша модель поставила закупку на первое место в списке. Какая формулировка вывода корректна?
    options:
      - text: Закупка имеет наибольший приоритет для проверки, поскольку совокупность признаков соответствует известной схеме
        correct: true
      - text: В закупке выявлен картельный сговор участников
      - text: Участники закупки нарушили пункт 2 части 1 статьи 11 Закона о защите конкуренции
      - text: Вероятность сговора в закупке превышает 90 %
    explanation: >
      Модель решает задачу скрининга: она ранжирует закупки для дальнейшей проверки
      человеком, располагающим недоступными ей данными. Два варианта с утверждением
      о нарушении подменяют приоритет вердиктом — нарушение устанавливается решением
      антимонопольного органа, а не оценкой модели. Утверждение о вероятности тоже
      некорректно: при базовой частоте в доли процента и неполной разметке оценки
      модели не откалиброваны как вероятности.

  - question: "Приём ценовых предложений в электронном аукционе длился 12 минут. Сколько ценовых предложений было подано?"
    options:
      - text: Два
        correct: true
      - text: Три
      - text: Двенадцать
      - text: По длительности торга это определить нельзя
    explanation: >
      Время приёма составляет четыре минуты и продлевается на четыре минуты после
      каждого поступившего предложения, поэтому длительность равна 4 + 4 × n минут.
      Из 12 = 4 + 4 × 2 следует два предложения. Ответ «три» получился бы, если считать
      первые четыре минуты частью первого предложения. Вариант «нельзя определить»
      неверен, пока торг не упёрся в предельные пять часов.

  - question: Какой показатель теряет исходный смысл при переносе на российский электронный аукцион?
    options:
      - text: Эксцесс распределения ценовых предложений
        correct: true
      - text: Глубина снижения от начальной цены контракта
      - text: Число ценовых предложений
      - text: Разрыв между ценой победителя и минимальным предложением
    explanation: >
      Показатели формы распределения разработаны для торгов с однократной подачей, где
      предложения отражают независимые оценки издержек участников. В открытом нисходящем
      аукционе итоговые цены порождены динамикой торга, и форма распределения означает
      другое. Остальные три показателя, наоборот, для аукциона естественны: они описывают
      глубину и ход торга и его исход.

  - question: Верхнюю часть вашего списка заняли пары компаний, у которых по данным ЕГРЮЛ общий учредитель с долей свыше половины. Что это означает и что делать?
    options:
      - text: Это группа лиц, согласованность внутри которой выведена из-под запрета; приоритет таких пар нужно понижать, отметив неполноту признака аффилированности
        correct: true
      - text: "Это подтверждение работоспособности модели: аффилированные компании и образуют картели"
      - text: Такие пары нужно полностью удалить из выборки на этапе сборки данных
      - text: Признак аффилированности следует исключить из работы как не относящийся к задаче
    explanation: >
      Часть 7 статьи 11 выводит из-под запрета соглашения внутри группы лиц под общим
      контролем, поэтому такие пары — не картель, и без фильтра они забьют голову списка.
      Но именно «понижать приоритет», а не «удалять»: формальная связь через ЕГРЮЛ не
      всегда равна контролю, а контроль возможен и без формальной доли, поэтому признак
      неполон в обе стороны. Исключать его из работы нельзя — без него результат
      нерелевантен.

  - question: В сегменте три компании, состав участников закупок стабилен, победы распределены примерно поровну, при этом в каждой закупке идёт торг и глубина снижения близка к медиане сегмента. Как это оценить?
    options:
      - text: Как конкурентный рынок с узким кругом игроков — ровное распределение побед само по себе признаком не является
        correct: true
      - text: Как ротацию побед — характерный признак сговора
      - text: Как раздел рынка между тремя участниками
      - text: Как схему «таран» с тремя участниками
    explanation: >
      Ключ здесь в наличии торга и нормальной глубине снижения: при ротации победы
      распределяются по договорённости, а не по ценам, и снижение оказывается
      подозрительно малым. Реальная специализация трёх компаний на узком рынке даёт ту же
      ровность побед без сговора. Раздел рынка означал бы, что участники не пересекаются,
      а «таран» требует отклонения заявок демпингующих участников — ни того, ни другого
      в условии нет.

  - question: Решение антимонопольного органа о картеле отменено судом. Как поступить с закупками из этого дела при построении разметки?
    options:
      - text: Не включать в положительный класс — метка требует вступившего в силу решения
        correct: true
      - text: "Включить в положительный класс: нарушение было установлено комиссией"
      - text: Включить с пониженным весом, пропорциональным доле отменённых решений
      - text: Исключить эти закупки из выборки целиком, включая отрицательный класс
    explanation: >
      Целевая переменная определяется через вступившее в силу решение, и отменённое
      решение этому не удовлетворяет. Включение по факту рассмотрения комиссией вносит
      в положительный класс случаи, которые правовая система признала неподтверждёнными.
      Взвешивание по доле отменённых решений — произвольная конструкция, не основанная
      на свойствах конкретного дела. Полное исключение закупок избыточно: как
      неразмеченные наблюдения они остаются пригодными.

  - question: Выгрузка охватывает 2019–2026 годы. Какой период разумно взять для обучения и проверки модели?
    options:
      - text: Обучение и проверку ограничить периодом, для которого решения успели вступить в силу, а первый год оставить на накопление истории признаков
        correct: true
      - text: Использовать весь период целиком, чтобы максимизировать объём данных
      - text: Обучаться на 2019–2022 годах, проверяться на 2025–2026 годах
      - text: Взять только последние два года как наиболее актуальные
    explanation: >
      Два ограничения действуют с разных концов. Свежие годы почти не размечены из-за
      лага правоприменения — проверка на них покажет пустой положительный класс. Первый
      год нужен для накопления истории участника и построения графа, иначе признаки
      отсутствуют. Использование всего периода игнорирует оба ограничения, а выборка из
      последних двух лет соединяет отсутствие меток с отсутствием истории.

  - question: Что произойдёт, если сделать единицей наблюдения извещение, а не лот?
    options:
      - text: В многолотовых закупках число участников станет суммой по лотам, а минимальная цена — минимумом по несопоставимым предметам
        correct: true
      - text: Уменьшится объём выборки, но показатели останутся корректными
      - text: Нарушится связь с реестром контрактов, так как контракт заключается по извещению
      - text: "Ничего: многолотовые закупки составляют незначительную долю массива"
    explanation: >
      Торг по каждому лоту идёт отдельно, со своими участниками и своим победителем,
      поэтому агрегация по извещению смешивает разные торги и разные предметы закупки —
      показатели становятся бессмысленными, а не просто менее точными. Контракт
      заключается как раз по лоту. Полагаться на малую долю многолотовых закупок нельзя:
      именно крупные закупки чаще многолотовые, а они и интереснее всего.

  - question: После сопоставления решений с выгрузкой вы получили 12 размеченных закупок. Что из перечисленного будет ошибкой?
    options:
      - text: Обучить градиентный бустинг на этих 12 примерах и отчитаться о качестве по перекрёстной проверке
        correct: true
      - text: Расширить сегмент выборки, чтобы захватить больше дел
      - text: Использовать эти закупки как проверочный набор для скрининга без учителя
      - text: Указать число 12 в работе как обоснование выбранной постановки задачи
    explanation: >
      На двенадцати примерах оценка качества имеет разброс шире самого результата, и
      любые выводы о качестве модели будут артефактом. Остальные три действия корректны:
      расширение сегмента увеличивает шанс захватить дела, проверка скрининга на
      известных нарушениях — штатный способ использования малой разметки, а честное
      указание объёма меток и есть обоснование постановки.

  - question: В сегменте А медианная глубина снижения 35 %, в сегменте Б — 2 %. В обоих встретилась закупка со снижением 5 %. Где она подозрительнее?
    options:
      - text: В сегменте А, поскольку 5 % там резко ниже обычного уровня
        correct: true
      - text: В сегменте Б, поскольку 5 % выше обычного уровня и указывает на демпинг
      - text: "Одинаково в обоих: абсолютная величина снижения одна и та же"
      - text: В сегменте Б, поскольку низкая медиана указывает на более концентрированный рынок
    explanation: >
      Признаком служит отклонение от нормы сегмента, а не абсолютная величина: там, где
      обычно снижают на треть, снижение на 5 % означает, что торга практически не было.
      В сегменте Б такое снижение выше обычного и подозрений не вызывает. Сравнение
      абсолютных величин между сегментами — та самая ошибка, ради устранения которой
      вводится нормировка. Концентрация рынка — отдельный контекстный признак, сам по
      себе вывода не дающий.

  - question: Почему опасно считать долю побед участника при одном-двух прошлых участиях?
    options:
      - text: Доля принимает крайние значения 0 или 1, и модель воспринимает их как сильный сигнал, хотя за ними стоит одно наблюдение
        correct: true
      - text: При малом числе участий признак невозможно вычислить без деления на ноль
      - text: Такие участники всегда оказываются новыми компаниями, созданными под закупку
      - text: Доля побед вообще неприменима как признак и должна быть заменена числом побед
    explanation: >
      Один выигрыш из одного участия даёт долю 1,0 — то же значение, что у стабильно
      выигрывающего игрока с сотней участий, хотя доказательная сила несопоставима.
      Решение — отмечать значение отсутствующим при малом числе наблюдений либо сглаживать
      долю добавлением константы. Деление на ноль возникает только при нуле участий и
      решается маской. Связь с недавно созданными компаниями возможна, но не обязательна,
      а сама по себе доля побед — полезный признак.

  - question: В проекции графа с весами, равными числу совместных участий, самыми связанными оказались крупнейшие подрядчики региона. Что из этого следует?
    options:
      - text: Веса отражают активность участников, и их нужно заменить превышением числа встреч над ожидаемым по нулевой модели
        correct: true
      - text: Крупнейшие подрядчики образуют картель, что и требовалось обнаружить
      - text: Нужно исключить крупнейших подрядчиков из графа как выбросы
      - text: Нужно увеличить порог веса ребра, оставив только самые сильные связи
    explanation: >
      Компания, участвующая повсюду, пересекается со всеми просто в силу объёма участия —
      сырой вес измеряет активность. Нулевая модель устраняет этот эффект, сравнивая
      фактическое число встреч с ожидаемым при случайном пересечении. Исключение крупных
      участников выбросит из анализа значимую часть рынка, а повышение порога веса
      оставит тех же крупных игроков, только меньше.

  - question: Вы обучаетесь на данных до июня 2023 года и проверяетесь на второй половине 2023 года, но граф построили один раз по всей выборке до 2026 года. Насколько корректна оценка?
    options:
      - text: "Некорректна: сетевые признаки проверочных закупок построены с учётом событий после них, и оценка завышена"
        correct: true
      - text: "Корректна: разделение по времени применено к обучению модели"
      - text: Корректна, если сетевые признаки не были самыми значимыми по вкладу
      - text: Некорректна, но ошибка несущественна, поскольку связи в графе меняются медленно
    explanation: >
      Разделение по времени должно применяться и к построению признаков: ребро между
      участниками проверочной закупки усилено её собственным исходом и их последующими
      встречами. Ссылка на разделение при обучении не помогает — утечка произошла раньше,
      на этапе формирования признаков. Значимость признака по вкладу здесь ни при чём,
      а медленное изменение связей ошибку не оправдывает: в граф вошли три года будущего.

  - question: Модель А лучше по площади под ROC-кривой, модель Б — по точности в топ-100. Какую выбрать для скрининга и почему?
    options:
      - text: Модель Б, поскольку применение состоит в проверке ограниченного числа закупок из головы списка
        correct: true
      - text: Модель А, поскольку площадь под ROC-кривой — интегральная метрика и учитывает всё ранжирование
      - text: Ту, что лучше по доле верных ответов, как по наиболее понятной метрике
      - text: Выбор невозможен без калибровки вероятностей обеих моделей
    explanation: >
      Метрика должна соответствовать применению: список имеет смысл ровно настолько,
      насколько его успевают проверить, поэтому решает качество в первых k позициях.
      Площадь под ROC-кривой при базовой частоте в доли процента определяется поведением
      модели на подавляющем отрицательном классе и почти не различает модели по
      полезности. Доля верных ответов здесь бесполезна по той же причине, а калибровка
      нужна для интерпретации вероятностей, но не для сравнения ранжирований.

  - question: Что из перечисленного обязательно должно быть в работе, где результат модели предназначен для инспектора?
    options:
      - text: Разложение оценки по вкладам признаков для каждой закупки в голове списка
        correct: true
      - text: Сравнение с базовым уровнем в виде простого правила
        correct: true
      - text: Максимально возможное число признаков в модели
      - text: Единственное усреднённое значение метрики по всем периодам проверки
    explanation: >
      Проверяющему нужно знать, что именно выглядит подозрительно, иначе оценка
      бесполезна; вдобавок анализ вкладов — лучший способ обнаружить утечку, которую
      метрики не показывают. Базовый уровень даёт число, с которым сравнивается модель:
      без него нельзя утверждать, что сложный метод вообще что-то добавил. Число признаков
      самоцелью не является, а единственное усреднённое значение скрывает разброс, который
      при малом числе положительных примеров очень велик.
