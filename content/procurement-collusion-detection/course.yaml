title: "Выявление сговоров в госзакупках: данные, признаки, модели"
description: "Как устроены российские госзакупки, как в них выглядит антиконкурентное соглашение и как построить модель, которая находит его следы в открытых данных."
tags: [госзакупки, антимонопольное регулирование, анализ данных, машинное обучение, графы]
level: intermediate
prerequisites:
  - Пишет на Python с pandas: группировки, соединение таблиц, работа с датами
  - Понимает обучение с учителем: разделение выборки, переобучение, precision и recall
  - Читает вложенный XML и извлекает из него нужные поля
  - Знает базовую статистику: дисперсия, квантили, форма распределения
