pass_score: 70
questions:
  - question: Почему для дипломной выборки обычно берут закупки по 44-ФЗ, а не по 223-ФЗ?
    options:
      - text: Потому что процедуры по 44-ФЗ жёстко заданы законом и потому сопоставимы между заказчиками
        correct: true
      - text: Потому что закупки по 223-ФЗ не публикуются в ЕИС
      - text: Потому что сговоры в закупках по 223-ФЗ законом не запрещены
      - text: Потому что по 223-ФЗ проводится слишком мало закупок для статистики
    explanation: >
      По 223-ФЗ заказчик пишет собственное положение о закупке, поэтому одинаково
      названные процедуры у двух заказчиков могут работать по-разному — сравнивать
      их между собой некорректно. Закупки по 223-ФЗ в ЕИС как раз публикуются, и объём
      их велик, так что дело не в доступности и не в размере выборки. Запрет картелей
      из Закона о защите конкуренции действует независимо от того, по какому закону
      проводится закупка.

  - question: В протоколе электронного аукциона указано пять участников, а длительность приёма ценовых предложений составила ровно четыре минуты. Что это означает?
    options:
      - text: Ни один участник не подал ценового предложения, итоговая цена равна НМЦК
        correct: true
      - text: Участники подали предложения одновременно в первую минуту
      - text: Торг был прерван оператором площадки
      - text: Все участники подали предложения, но они были отклонены комиссией
    explanation: >
      Время приёма ценовых предложений составляет четыре минуты и продлевается ещё
      на четыре минуты после каждого поступившего предложения. Значит, ровно четыре
      минуты — это торг, в котором не было ни одного предложения. Вариант с
      одновременной подачей неверен именно из-за продления: даже предложения,
      поданные в первую минуту, растянули бы торг минимум до восьми минут. Отклонение
      заявок комиссией происходит позже и на длительность торга не влияет.

  - question: Вы собираете таблицу победителей и определяете победителя как участника с минимальным ценовым предложением. Чем это опасно?
    options:
      - text: Заявку участника с минимальной ценой могли отклонить при рассмотрении, и тогда вы стираете след схемы, где демпингующие участники отклоняются, а выигрывает третий
        correct: true
      - text: Минимальная цена может быть указана в протоколе с ошибкой округления
      - text: Победителем по 44-ФЗ считается участник, предложивший лучшие нестоимостные условия
      - text: Ничем не опасно, в электронном аукционе побеждает минимальная цена
    explanation: >
      Комиссия рассматривает заявки после торга и вправе отклонить заявку участника,
      не соответствующую требованиям извещения, — поэтому контракт может достаться
      не тому, кто предложил меньше всех. Именно на этом порядке построена схема
      «таран», и подмена источника победителя убирает из данных её главный след.
      Нестоимостные критерии применяются в конкурсе, а не в аукционе, и потому здесь
      ни при чём.

  - question: Почему нельзя в одной выборке считать показатели формы распределения ценовых предложений и по электронным аукционам, и по электронным конкурсам?
    options:
      - text: Потому что в аукционе цены порождаются открытым нисходящим торгом, а в конкурсе — однократной подачей, и форма распределения в этих случаях имеет разный смысл
        correct: true
      - text: Потому что в конкурсе цена участника не публикуется
      - text: Потому что в аукционе не бывает более двух участников
      - text: Потому что конкурсы проводятся не на электронных площадках
    explanation: >
      Классические скрининговые показатели формы распределения разработаны для торгов
      с однократной подачей, где предложения отражают независимые оценки издержек.
      В открытом нисходящем аукционе итоговые цены — результат динамики торга, и то же
      число означает другое. Цены участников конкурса публикуются, число участников
      аукциона ничем не ограничено сверху, а конкурсы по 44-ФЗ проводятся в электронной
      форме — эти варианты фактически неверны.

  - question: В распределении глубины снижения цены по большой выборке аукционов видна заметная скученность значений чуть меньше 25 %. Как это интерпретировать при построении признаков?
    options:
      - text: Как следствие антидемпинговых мер, а не как признак согласованного поведения
        correct: true
      - text: Как след картеля, договорившегося о едином уровне снижения
      - text: Как ошибку выгрузки данных, требующую пересчёта
      - text: Как признак того, что НМЦК систематически завышена
    explanation: >
      При снижении на 25 % и более включаются антидемпинговые меры: обеспечение
      исполнения контракта в полтора раза выше и запрет авансирования. Снижаться чуть
      глубже порога дорого, поэтому масса значений скапливается прямо перед ним —
      это эффект регулирования, общий для всех добросовестных участников. Принять его
      за след сговора — значит пометить подозрительной существенную часть нормального
      рынка. Завышение НМЦК даёт не скученность у конкретного порога, а сдвиг всего
      распределения.

  - question: По какому полю следует связывать участника между разными закупками?
    options:
      - text: По ИНН
        correct: true
      - text: По наименованию организации
      - text: По порядковому номеру заявки в протоколе
      - text: По реестровому номеру извещения
    explanation: >
      ИНН уникален и не меняется при переименовании организации, поэтому только он
      позволяет проследить участника через серию закупок. Наименование пишется
      по-разному, меняется и не уникально. Порядковый номер заявки присваивается внутри
      одной процедуры и в следующей означает другого участника. Реестровый номер
      извещения идентифицирует закупку, а не участника.
