pass_score: 70
questions:
  - question: Что в этом курсе называется скринингом закупок?
    options:
      - text: Предварительный отбор и ранжирование закупок для дальнейшей проверки человеком
        correct: true
      - text: Автоматическое вынесение заключения о наличии картеля в закупке
      - text: Проверка заявок участников на соответствие требованиям извещения
      - text: Отбор закупок, по которым уже вынесено решение антимонопольного органа
    explanation: >
      Скрининг сокращает пространство поиска: из миллиона закупок он оставляет сотню,
      которую успеет изучить человек. Соблазнительный вариант про заключение о картеле
      неверен потому, что доказывание требует данных, недоступных в открытых источниках
      (IP-адреса, переписка, движение средств), и полномочий, которых у модели нет.
      Проверка заявок на соответствие извещению — это работа закупочной комиссии,
      она к выявлению сговора отношения не имеет.

  - question: Почему сговор, случившийся ровно в одной закупке, статистическими методами практически не обнаруживается?
    options:
      - text: Потому что механизм распределения побед проявляется только в серии закупок, а единичный исход неотличим от совпадения
        correct: true
      - text: Потому что в одной закупке слишком мало участников для расчёта показателей
      - text: Потому что данные по отдельной закупке не публикуются в открытом доступе
      - text: Потому что закон не считает нарушением единичную договорённость
    explanation: >
      Картель обязан решить задачу «кто выигрывает эту закупку, а кто следующую», и
      решение этой задачи оставляет след именно в повторяемости. Отсутствие торга
      в одной процедуре объясняется и сговором, и тем, что участникам невыгодно снижать
      цену. Вариант про число участников звучит правдоподобно, но неверен: часть
      показателей считается и при двух участниках — проблема не в объёме, а в том, что
      единичное наблюдение не отличает закономерность от случайности. Данные по
      отдельной закупке как раз публикуются, а единичная договорённость нарушением
      быть не перестаёт.

  - question: Модель выдаёт долю верных ответов 95 %, но точность в отобранном списке — 11 %. Как это интерпретировать?
    options:
      - text: "Нормальная картина для задачи с редким событием: высокая доля верных ответов достигается за счёт правильного распознавания подавляющего большинства добросовестных закупок"
        correct: true
      - text: Модель переобучена, нужно упростить её и уменьшить число признаков
      - text: "В данных ошибка: две метрики не могут так сильно расходиться"
      - text: Модель непригодна, так как точность ниже 50 %
    explanation: >
      При доле нарушений около 1 % модель, которая просто хорошо отделяет чистое
      большинство, автоматически получает высокую долю верных ответов — эта метрика
      к задаче нечувствительна. Расхождение метрик здесь не признак ошибки в данных
      и не признак переобучения: переобучение проявилось бы расхождением между
      обучающей и тестовой выборками, а не между двумя метриками на одной. Порог
      «точность ниже 50 % — непригодна» произволен: список, где каждая девятая закупка
      действительно нарушение, резко выгоднее сплошной проверки.

  - question: Почему долю снижения от начальной цены контракта нельзя использовать как признак сговора без дополнительной обработки?
    options:
      - text: Потому что нормальный уровень снижения сильно различается между товарными группами и рынками, и показатель нужно нормировать на сегмент
        correct: true
      - text: Потому что начальная цена контракта не публикуется в открытых данных
      - text: Потому что снижение цены выгодно заказчику и не может указывать на нарушение
      - text: Потому что этот показатель применим только к конкурсам, но не к аукционам
    explanation: >
      Снижение на 3 % подозрительно там, где обычно снижают на 40 %, и совершенно
      нормально там, где рынок работает с минимальной наценкой, — поэтому сравнивать
      надо внутри сопоставимого сегмента. Вариант про выгоду заказчику подменяет тему:
      признаком сговора служит не само снижение, а его аномальность для данного
      сегмента. Начальная цена публикуется всегда, а показатель осмыслен и для
      аукциона, и для процедур с однократной подачей предложений.

  - question: Какие из перечисленных данных участник дипломной работы получить из открытых источников не сможет?
    options:
      - text: Совпадение IP-адресов, с которых подавались заявки
        correct: true
      - text: Метаданные файлов заявок участников
        correct: true
      - text: Состав участников и их итоговые ценовые предложения
      - text: Начальную цену контракта и сведения о заказчике
    explanation: >
      IP-адреса и метаданные файлов существуют только внутри электронных площадок и
      доступны антимонопольному органу в рамках проверки; в открытые данные они не
      попадают, и планировать признаки на их основе нельзя. Состав участников,
      ценовые предложения, начальная цена и сведения о заказчике, наоборот,
      публикуются — на них и строится вся доступная вам часть анализа.
