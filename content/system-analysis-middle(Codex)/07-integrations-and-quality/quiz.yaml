pass_score: 70
questions:
  - question: Что лучше отправлять асинхронно после подтверждения записи?
    options: ["Уведомление клиенту", "Финальную проверку уникальности слота", "Валидацию обязательного поля"]
    answer: "Уведомление клиенту"
    explanation: Сбой SMS не должен отменять уже созданную запись.
  - question: Что сообщает событие AppointmentConfirmed?
    options: ["Факт, который уже произошёл", "Просьбу создать запись", "Версию браузера"]
    answer: "Факт, который уже произошёл"
    explanation: Команда просит действие, событие сообщает факт.
  - question: Что даёт outbox?
    options: ["Согласованную фиксацию записи и намерения отправить событие", "Гарантию отсутствия дубликатов", "Отмену всех таймаутов"]
    answer: "Согласованную фиксацию записи и намерения отправить событие"
    explanation: Дубликаты всё равно возможны, поэтому нужен идемпотентный потребитель.
  - question: Что нужно для безопасного retry?
    options: ["Ограничение попыток", "Экспоненциальная задержка", "Бесконечный цикл без DLQ"]
    answer: ["Ограничение попыток", "Экспоненциальная задержка"]
    explanation: Неисправимые сообщения должны попадать в DLQ.
  - question: Какое NFR можно принять?
    options: ["p95 поиска слотов не более 500 мс при 100 RPS", "Система должна быть быстрой", "Логи должны быть хорошими"]
    answer: "p95 поиска слотов не более 500 мс при 100 RPS"
    explanation: Оно измеримо и задаёт условия.
  - question: Что нельзя писать в обычный лог?
    options: ["Пароль или токен", "traceId", "Время ответа"]
    answer: "Пароль или токен"
    explanation: Секреты и лишние персональные данные нельзя раскрывать в логах.
