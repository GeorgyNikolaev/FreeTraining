pass_score: 70
questions:
  - question: Какой ответ ожидается после успешного создания записи?
    options: ["201 Created", "204 No Content", "409 Conflict"]
    answer: "201 Created"
    explanation: Создан новый ресурс.
  - question: Зачем нужен Idempotency-Key для POST?
    options: ["Чтобы повтор запроса не создал вторую запись", "Чтобы шифровать БД", "Чтобы удалить кэш"]
    answer: "Чтобы повтор запроса не создал вторую запись"
    explanation: Он защищает от повторов после таймаута или сбоя сети.
  - question: Какой код подходит, если слот успели занять?
    options: ["409 Conflict", "404 Not Found", "500 Internal Server Error"]
    answer: "409 Conflict"
    explanation: Запрос корректен, но конфликтует с текущим состоянием.
  - question: Что полезно вернуть в безопасной ошибке?
    options: ["Стабильный code", "traceId", "Stack trace базы данных"]
    answer: ["Стабильный code", "traceId"]
    explanation: Код и traceId помогают клиенту и поддержке, не раскрывая внутренности.
  - question: Какое изменение обычно обратно совместимо?
    options: ["Добавить необязательное поле", "Удалить поле ответа", "Поменять смысл существующего статуса"]
    answer: "Добавить необязательное поле"
    explanation: Старый клиент может проигнорировать незнакомое поле.
