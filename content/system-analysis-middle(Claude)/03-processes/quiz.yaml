pass_score: 70
questions:
  - question: Почему статус «На проверке СБ» считается неудачным названием состояния заявки?
    options:
      - "Он описывает не заявку, а исполнителя, и требует переименования при передаче работы другому подразделению"
      - "Названия статусов не должны содержать пробелов"
      - "Он не переводится на латиницу однозначно"
      - "Служба безопасности не должна фигурировать в бизнес-модели"
    answer: "Он описывает не заявку, а исполнителя, и требует переименования при передаче работы другому подразделению"
    explanation: >
      Состояние — свойство объекта; исполнитель и очередь хранятся отдельным
      полем, поэтому смена подразделения не ломает модель и отчётность. Довод
      про упоминание СБ звучит правдоподобно, но проблема не в самом
      подразделении: «На проверке андеррайтером» был бы ничем не лучше.
  - question: Заявка одобрена автоматически, клиент 30 дней не подписал договор. Кто инициатор перехода в expired и что обязательно указать в описании?
    options:
      - "Таймер; от какого события считается срок и что происходит с резервом лимита в АБС"
      - "Менеджер; текст уведомления клиенту"
      - "АБС; код ошибки, который она возвращает"
      - "Андеррайтер; причину отказа для отчётности"
    answer: "Таймер; от какого события считается срок и что происходит с резервом лимита в АБС"
    explanation: >
      Переход по времени требует точки отсчёта и описания эффекта, иначе резерв
      останется занятым и уменьшит доступный лимит клиента. Менеджер здесь не
      инициатор: он получает уведомление, но переход происходит и без его
      участия — иначе заявка зависнет при его отпуске.
  - question: В таблице решений строка 4 «сумма ≤ 5 млн, есть стоп-факторы → manual_review» совпала по смыслу со строкой 10 «любая сумма, есть стоп-факторы → manual_review». Что делать?
    options:
      - "Удалить частный случай, оставив общее правило"
      - "Оставить обе строки: дублирование повышает надёжность"
      - "Удалить общее правило, оставив частные случаи для каждой суммы"
      - "Разнести строки по разным таблицам решений"
    answer: "Удалить частный случай, оставив общее правило"
    explanation: >
      Две строки с одинаковым результатом — избыточность, которая при следующей
      правке разойдётся и даст противоречие. Сохранение частных случаев вместо
      общего правила кажется более явным, но умножает число строк при каждом
      новом диапазоне суммы и увеличивает шанс пропуска.
  - question: Внешний сервис ЕГРЮЛ не ответил за 5 секунд. Что показать кредитному менеджеру?
    options:
      - "Что поля реквизитов открыты для ручного ввода, а проверка повторится автоматически"
      - "Код ошибки и текст ответа внешнего сервиса"
      - "Сообщение о технической ошибке с просьбой повторить попытку позже"
      - "Ничего: заявка должна быть отклонена до восстановления сервиса"
    answer: "Что поля реквизитов открыты для ручного ввода, а проверка повторится автоматически"
    explanation: >
      Пользователю нужно знать, что делать дальше, а не в какой системе сбой;
      деградация описана заранее и не останавливает работу. Показ кода ошибки
      выглядит честным, но для менеджера он бесполезен и вдобавок выносит
      детали внутренней интеграции на экран отделения.
  - question: Почему после отказа АБС в выдаче по одобренной заявке запрещён автоматический повтор?
    options:
      - "Неизвестно, была ли операция выполнена: ответ мог потеряться, и повтор рискует двойной выдачей"
      - "АБС блокирует клиента после первой ошибки"
      - "Повторы запрещены квотой в 50 запросов в секунду"
      - "Автоматический повтор нарушает правило четырёх глаз"
    answer: "Неизвестно, была ли операция выполнена: ответ мог потеряться, и повтор рискует двойной выдачей"
    explanation: >
      Отсутствие ответа не равно отсутствию эффекта — это ключевое свойство
      распределённых вызовов, и до введения идемпотентного ключа безопасен
      только ручной разбор. Квота в 50 запросов в секунду ограничивает темп, но
      не имеет отношения к риску повторной выдачи денег.
  - question: Зачем администратору продукта дают право вручную перевести зависшую заявку в manual_review?
    options:
      - "Иначе систему всё равно будут чинить запросами в базу, но без следов и контроля"
      - "Чтобы ускорить рассмотрение заявок в пиковые дни"
      - "Чтобы снять нагрузку с андеррайтеров при переполнении очереди"
      - "Чтобы обойти правило четырёх глаз в срочных случаях"
    answer: "Иначе систему всё равно будут чинить запросами в базу, но без следов и контроля"
    explanation: >
      Легальный, журналируемый выход из тупика заменяет нелегальный: действие
      фиксируется с комментарием и попадает в отчёт для аудита. Использовать это
      право для ускорения потока нельзя — оно не меняет очередь и не отменяет
      правило четырёх глаз, а лишь возвращает заявку в рабочее состояние.
