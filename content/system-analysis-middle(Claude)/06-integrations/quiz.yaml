pass_score: 70
questions:
  - question: Отправка заявки синхронно зависит от четырёх сервисов с доступностью 99,0%, 99,5%, 98,5% и 99,7%. Что это означает и что с этим делать в первую очередь?
    options:
      - "Верхняя граница доступности отправки — около 96,7%; самую ненадёжную зависимость переводят в асинхронную схему с деградацией"
      - "Доступность отправки равна минимальной из четырёх — 98,5%; нужно улучшать именно этот сервис"
      - "Доступность не меняется: отказ одного сервиса компенсируется повторами"
      - "Нужно увеличить таймауты, чтобы дождаться ответа при замедлениях"
    answer: "Верхняя граница доступности отправки — около 96,7%; самую ненадёжную зависимость переводят в асинхронную схему с деградацией"
    explanation: >
      Доступности синхронной цепочки перемножаются, поэтому результат хуже самого
      слабого звена, а не равен ему. Увеличение таймаутов не помогает и вредит:
      пользователь ждёт дольше, а недоступность из короткой становится долгой.
  - question: Почему в событие application.decided не кладут сумму заявки и ИНН клиента?
    options:
      - "Брокер отдаёт сообщение подписчику целиком, без проверки прав, и данные оседают в его журналах и резервных копиях"
      - "Размер сообщения влияет на пропускную способность брокера"
      - "Эти поля меняются, и в событии они быстро устареют"
      - "Формат события не позволяет передавать числовые значения"
    answer: "Брокер отдаёт сообщение подписчику целиком, без проверки прав, и данные оседают в его журналах и резервных копиях"
    explanation: >
      Событие-уведомление с идентификаторами заставляет потребителя прийти за
      данными по API, где работают права доступа и журналирование. Довод про
      устаревание верен для изменяемых полей, но сумма одобренной заявки как раз
      неизменна — проблема именно в бесконтрольном распространении.
  - question: Зачем нужна таблица исходящих сообщений, если брокер и так гарантирует доставку?
    options:
      - "Запись в базу и отправку в брокер нельзя выполнить атомарно, и без общей транзакции событие либо теряется, либо возникает без изменения данных"
      - "Она ускоряет публикацию, снимая нагрузку с брокера в пиковые часы"
      - "Она позволяет отправлять события в правильном порядке"
      - "Она заменяет очередь неудачных сообщений"
    answer: "Запись в базу и отправку в брокер нельзя выполнить атомарно, и без общей транзакции событие либо теряется, либо возникает без изменения данных"
    explanation: >
      Гарантии брокера начинаются с момента, когда он сообщение принял; разрыв
      между фиксацией в базе и публикацией они не закрывают. Порядок таблица
      исходящих сама по себе не обеспечивает — за него отвечает ключ
      партиционирования.
  - question: АБС подтвердила выдачу, но ответ не дошёл, и заявка осталась в approved. Какой механизм должен это обнаружить?
    options:
      - "Ежедневная сверка по application_id, которая переведёт заявку в issued"
      - "Повтор запроса с тем же ключом идемпотентности"
      - "Очередь неудачных сообщений с разбором дежурным аналитиком"
      - "Компенсирующая операция снятия резерва"
    answer: "Ежедневная сверка по application_id, которая переведёт заявку в issued"
    explanation: >
      Идемпотентный повтор защищает от второй выдачи, но не восстанавливает
      знание о первой — расхождение состояний ловит именно сверка по ключу.
      Компенсация здесь была бы прямым вредом: снятие резерва по фактически
      выданной сделке создаст второе расхождение.
  - question: Операционист вручную уменьшил сумму при выдаче, сверка нашла расхождение. Какое решение верное?
    options:
      - "Признать случай легальным, фиксировать без сигнала тревоги и отражать в отчётности"
      - "Считать инцидентом и автоматически приводить сумму в «Конвейере» к сумме АБС"
      - "Блокировать передачу новых сделок до разбора"
      - "Автоматически создавать новую заявку на разницу сумм"
    answer: "Признать случай легальным, фиксировать без сигнала тревоги и отражать в отчётности"
    explanation: >
      Расхождение, у которого есть законная причина в процессе, должно быть
      описано как ожидаемое, иначе сигналы тревоги обесцениваются и настоящие
      расхождения тонут в шуме. Автоматическое исправление суммы в «Конвейере»
      тоже неверно: решение принималось по другой сумме, и переписывать его
      задним числом нельзя.
  - question: Какие ошибки внешнего сервиса имеет смысл повторять автоматически?
    options:
      - "Таймауты, 5xx и 429 с учётом Retry-After"
      - "Любые ошибки, кроме 404"
      - "Только 429, остальные требуют разбора"
      - "Ошибки 4xx, поскольку они означают временную несогласованность данных"
    answer: "Таймауты, 5xx и 429 с учётом Retry-After"
    explanation: >
      Повторять стоит то, что может пройти при следующей попытке без изменения
      запроса: сбой на стороне сервиса или ограничение темпа. Ошибки 4xx говорят
      о самом запросе — повтор даст тот же ответ и лишь добавит нагрузки.
