pass_score: 70
questions:
  - question: По заявке свыше 20 млн ₽ высказываются два андеррайтера и кредитный комитет. Как это отражается в модели данных?
    options:
      - "Решение — отдельная сущность со связью «многие к одной» с заявкой"
      - "В заявке добавляются поля «решение 1», «решение 2», «решение комитета»"
      - "Хранится последнее решение, предыдущие уходят в журнал событий"
      - "Создаются три заявки, связанные ссылкой на исходную"
    answer: "Решение — отдельная сущность со связью «многие к одной» с заявкой"
    explanation: >
      У каждого решения свои автор, время, версия правил и обоснование, а их
      число заранее не ограничено — комитет может вернуть заявку на пересмотр.
      Вариант с журналом событий выглядит экономным, но журнал не предназначен
      для данных, на которые ссылается отчётность и последующие проверки.
  - question: Почему customer_id из АБС не делают первичным ключом клиента в «Конвейере»?
    options:
      - "Внешний идентификатор может измениться при слиянии дублей, и тогда придётся переписывать все ссылки"
      - "АБС не гарантирует уникальность своих идентификаторов"
      - "Формат идентификатора АБС несовместим с UUID"
      - "Это запрещено требованиями информационной безопасности"
    answer: "Внешний идентификатор может измениться при слиянии дублей, и тогда придётся переписывать все ссылки"
    explanation: >
      Суррогатный ключ развязывает вашу модель с чужим жизненным циклом: после
      слияния достаточно обновить поле-ссылку. Предположение о неуникальности
      неверно — АБС свои идентификаторы контролирует, проблема не в уникальности,
      а в изменяемости.
  - question: Какая запись НЕ должна попадать в журнал доступа?
    options:
      - "Значение поля «телефон руководителя», которое просмотрел сотрудник"
      - "Идентификатор сотрудника и его роль"
      - "Основание доступа: назначенная задача или расследование"
      - "Перечень разделов карточки, которые были раскрыты"
    answer: "Значение поля «телефон руководителя», которое просмотрел сотрудник"
    explanation: >
      Журнал доступа живёт дольше и доступен другому кругу лиц, поэтому значения
      данных в нём создают вторую копию чувствительных сведений без
      маскирования. Перечень раскрытых разделов, наоборот, нужен: он показывает
      объём доступа, не раскрывая содержимого.
  - question: Заявка отклонена, отчёт БКИ получен 3 дня назад. Что произойдёт с отчётом через 30 дней по политике банка из урока?
    options:
      - "Файл отчёта удаляется, в результате проверки остаются агрегированные показатели"
      - "Отчёт хранится 5 лет вместе с заявкой"
      - "Отчёт помечается deleted_at и остаётся в базе"
      - "Отчёт переносится в архив и доступен менеджеру по запросу"
    answer: "Файл отчёта удаляется, в результате проверки остаются агрегированные показатели"
    explanation: >
      Срок хранения чувствительной копии отвязан от срока хранения заявки:
      объяснить решение позволяют агрегаты в результате проверки, а сам отчёт
      для этого не нужен. Пометка deleted_at не является удалением — данные
      остаются в базе, индексах и резервных копиях.
  - question: Клиент отозвал согласие на запрос кредитной истории. Что из перечисленного остаётся в системе?
    options:
      - "Запись журнала о факте запроса отчёта в бюро"
      - "Файл отчёта БКИ в объектном хранилище"
      - "Значения показателей из отчёта в карточке заявки"
      - "Ничего, связанного с обращением в бюро"
    answer: "Запись журнала о факте запроса отчёта в бюро"
    explanation: >
      Факт обращения подтверждает, что на момент запроса согласие было, — это
      защита банка при проверке, и она не раскрывает содержания отчёта. Сам файл
      и извлечённые из него показатели после отзыва хранить нет оснований.
  - question: Менеджер просит разрешить исправлять телефон клиента прямо в «Конвейере», потому что в АБС данные устарели. Что предложить?
    options:
      - "Исправление в АБС как системе-владельце, с отображением обновлённого значения в «Конвейере»"
      - "Разрешить правку в «Конвейере» и синхронизировать значение в АБС ночью"
      - "Разрешить правку локально без синхронизации: для звонка достаточно локального значения"
      - "Добавить поле «телефон для связи» в заявку и не трогать данные клиента"
    answer: "Исправление в АБС как системе-владельце, с отображением обновлённого значения в «Конвейере»"
    explanation: >
      Система, не владеющая данными, не редактирует их у себя — иначе появляются
      два «правильных» телефона и расхождения, которые сверки не устраняют.
      Локальное поле «телефон для связи» кажется безобидным компромиссом, но оно
      создаёт ровно тот же второй источник истины, только под другим именем.
