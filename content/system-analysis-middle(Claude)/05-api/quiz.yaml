pass_score: 70
questions:
  - question: Менеджер отделения М-12 запрашивает GET /applications/{id} по заявке отделения М-07. Какой ответ правильный и почему?
    options:
      - "404 — существование чужой заявки само по себе является чувствительной информацией"
      - "403 — так клиент точно понимает, что дело в правах, а не в опечатке"
      - "200 с урезанным телом — базовые поля не относятся к тайне"
      - "401 — доступ к объекту не подтверждён"
    answer: "404 — существование чужой заявки само по себе является чувствительной информацией"
    explanation: >
      Ответ 403 подтверждает, что заявка по такому идентификатору есть, и
      перебор превращается в способ узнать, кто обращался за кредитом. Довод про
      ясность для клиента верен по существу, но применим там, где факт
      существования объекта не является тайной; здесь он является, а событие
      отказа при этом всё равно попадает в журнал доступа.
  - question: Почему поиск заявок по ИНН реализован как POST /applications/search, а не GET с query-параметром?
    options:
      - "Query-строка попадает в логи прокси, историю браузера и заголовок Referer, а тело POST — нет"
      - "GET не поддерживает передачу нескольких критериев поиска"
      - "POST быстрее обрабатывается и лучше кешируется"
      - "Так требует спецификация OpenAPI для операций поиска"
    answer: "Query-строка попадает в логи прокси, историю браузера и заголовок Referer, а тело POST — нет"
    explanation: >
      ИНН показывает, кто обращался в банк, поэтому его не помещают в URL — это
      осознанное отступление от привычки «поиск делается GET». Про кеширование
      верно обратное: GET как раз кешируется, а POST нет, и это плата за
      безопасность передачи.
  - question: "В ответ на передачу сделки АБС не прислала ответ: сетевой таймаут. Что должен сделать «Конвейер»?"
    options:
      - "Повторить запрос с тем же детерминированным ключом идемпотентности"
      - "Повторить запрос с новым ключом идемпотентности"
      - "Оставить заявку в approved и передать разбор в поддержку без повторов"
      - "Считать операцию неуспешной и вернуть заявку в manual_review"
    answer: "Повторить запрос с тем же детерминированным ключом идемпотентности"
    explanation: >
      Отсутствие ответа не означает отсутствие эффекта, и тот же ключ гарантирует,
      что АБС создаст сделку один раз, а на повтор вернёт сохранённый результат.
      Ручной разбор был правильным ответом ровно до введения ключа — он не
      масштабируется и не нужен, когда идемпотентность согласована с АБС.
  - question: Два андеррайтера открыли одну заявку. Какой механизм здесь уместнее и почему?
    options:
      - "Пессимистическая блокировка с ограниченным сроком: человек работает с карточкой долго"
      - "Оптимистическая блокировка через ETag: конфликты редки и разрешаются повтором"
      - "Очередь запросов на стороне сервера: решения исполняются по очереди"
      - "Ограничение на уровне прав: заявку видит только назначенный андеррайтер"
    answer: "Пессимистическая блокировка с ограниченным сроком: человек работает с карточкой долго"
    explanation: >
      Рассмотрение занимает минуты, и при оптимистической схеме второй
      андеррайтер узнает о конфликте только в конце, потеряв работу. Ограничение
      прав видимостью не решает задачу: у заявки свыше 20 млн ₽ по правилам
      двое законных рассматривающих, и одновременность между ними всё равно
      возможна.
  - question: Какое изменение контракта является ломающим для существующих клиентов?
    options:
      - "Добавление нового значения в перечисление статусов заявки"
      - "Добавление необязательного поля в тело ответа"
      - "Расширение диапазона допустимых сумм вверх"
      - "Изменение текста сообщения об ошибке при неизменном коде"
    answer: "Добавление нового значения в перечисление статусов заявки"
    explanation: >
      Клиент, написанный под старый список, встретит неизвестное значение и либо
      упадёт, либо покажет пустоту — поэтому правило «игнорировать неизвестные
      значения» фиксируют в контракте заранее. Новое необязательное поле
      совместимо: клиент его просто не читает.
  - question: Повтор пришёл с тем же Idempotency-Key, но с другим телом запроса. Что вернуть?
    options:
      - "409 с кодом duplicate_request — ключ уже связан с другим намерением"
      - "200 с сохранённым ответом первой операции"
      - "422 — тело запроса не прошло валидацию"
      - "201 — выполнить операцию с новым телом"
    answer: "409 с кодом duplicate_request — ключ уже связан с другим намерением"
    explanation: >
      Один ключ соответствует одному намерению пользователя; другое тело при том
      же ключе означает ошибку клиента, и молчаливое выполнение здесь опаснее
      отказа. Возврат сохранённого ответа подходит только при совпадении тела —
      иначе клиент решит, что сервер выполнил его новый запрос.
