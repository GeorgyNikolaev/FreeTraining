pass_score: 70
questions:
  - question: "Разработчик предлагает скрывать скоринговый балл от менеджера средствами интерфейса: поле приходит в ответе API, но не отображается. Чем это плохо?"
    options:
      - "Значение доступно в инструментах разработчика и в журналах трафика — ограничение фиктивно"
      - "Интерфейс будет медленнее из-за передачи лишнего поля"
      - "Такое решение невозможно протестировать автоматически"
      - "Ничем: если поле не отображается, требование выполнено"
    answer: "Значение доступно в инструментах разработчика и в журналах трафика — ограничение фиктивно"
    explanation: >
      Ограничение доступа выполняется на сервере: ответ API не должен содержать
      того, что роли не положено. Аргумент про скорость верен, но второстепенен —
      проблема не в размере ответа, а в том, что данные фактически выданы.
  - question: Почему аудитору в «Конвейере» закрыты ФИО и телефон руководителя клиента, хотя менеджеру они видны?
    options:
      - "Задача аудитора — проверить соблюдение процедуры, и персональные данные для этого не нужны"
      - "Аудитор работает вне периметра банка"
      - "Аудитор не подписывал соглашение о неразглашении"
      - "Персональные данные доступны только тем, кто общается с клиентом лично"
    answer: "Задача аудитора — проверить соблюдение процедуры, и персональные данные для этого не нужны"
    explanation: >
      Минимизация определяется задачей, а не статусом сотрудника: аудитору нужны
      роли, время, версия правил и полнота проверок. Соображение про личное
      общение звучит логично, но андеррайтер тоже не общается с клиентом, а
      паспорт видит целиком — потому что этого требует его проверка.
  - question: Служба безопасности просит для расследований постоянный доступ ко всем заявкам банка. Что предложить?
    options:
      - "Временный режим расследования: 8 часов, с указанием номера расследования, журналированием и уведомлением руководителя ИБ"
      - "Выдать постоянный доступ только на чтение: изменять данные СБ всё равно не может"
      - "Отказать: расследования проводятся по выгрузкам, подготовленным администратором"
      - "Выдать доступ, но ограничить его заявками в статусах manual_review и rejected"
    answer: "Временный режим расследования: 8 часов, с указанием номера расследования, журналированием и уведомлением руководителя ИБ"
    explanation: >
      Экстренный доступ должен существовать легально, но быть заметным и
      ограниченным по времени — иначе в критической ситуации его получат в
      обход системы. Постоянный доступ на чтение не решает задачу контроля:
      именно чтение и составляет риск утечки, а его объём становится
      неотличимым от нормальной работы.
  - question: Отчёт показал, что 11 менеджеров ежедневно выгружают весь список заявок отделения. Какой вывод сделать первым?
    options:
      - "Проверить, не отсутствует ли в интерфейсе функция, ради которой делают выгрузку"
      - "Ограничить выгрузку десятью строками в сутки"
      - "Инициировать служебное расследование по каждому сотруднику"
      - "Отключить экспорт для роли менеджера"
    answer: "Проверить, не отсутствует ли в интерфейсе функция, ради которой делают выгрузку"
    explanation: >
      Массовый регулярный экспорт почти всегда означает нехватку возможностей на
      экране — в разобранном случае не хватало сортировки по сроку, и после
      доработки выгрузки сократились в двадцать раз. Запретить экспорт до
      выяснения причины означает сломать работу и получить обходной путь через
      копирование с экрана.
  - question: Что из перечисленного обязательно записывать в журнал доступа, чтобы расследование не зашло в тупик?
    options:
      - "Состав фильтров выгрузки и число строк"
      - "Содержимое выгруженного файла"
      - "IP-адрес и версию браузера сотрудника"
      - "Комментарий сотрудника о цели выгрузки"
    answer: "Состав фильтров выгрузки и число строк"
    explanation: >
      Система не хранит сам файл, поэтому объём и критерии отбора — единственный
      способ понять, что именно ушло. Хранение содержимого файла создало бы
      вторую копию чувствительных данных в журнале, который живёт дольше и
      доступен другому кругу лиц.
  - question: Почему журнал доступа хранят отдельно от основной базы и только на добавление?
    options:
      - "Иначе администратор системы или базы может удалить следы собственных действий"
      - "Так журнал занимает меньше места и быстрее ищется"
      - "Требования к резервному копированию журнала мягче, чем к базе"
      - "Это ускоряет основную базу, снимая с неё нагрузку записи"
    answer: "Иначе администратор системы или базы может удалить следы собственных действий"
    explanation: >
      Журнал имеет смысл ровно настолько, насколько его нельзя изменить задним
      числом, — поэтому доступ к нему ограничен добавлением и чтением.
      Производительность здесь не аргумент: неизменяемое хранилище обычно не
      быстрее обычной таблицы, и выбирают его не за это.
