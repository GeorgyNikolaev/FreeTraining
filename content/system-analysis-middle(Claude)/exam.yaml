pass_score: 80
questions:
  - question: Команда предлагает хранить в «Конвейере» лимит на группу связанных заёмщиков, чтобы не ходить в АБС при каждом расчёте. Что ответить?
    options:
      - "Отказать: источник истины по обязательствам группы — АБС, вторая копия разойдётся, и сверки этого не исправят"
      - "Согласиться при условии ночной синхронизации лимитов из АБС"
      - "Согласиться: расчёт ускорится, а расхождения выявит ежедневная сверка"
      - "Вынести решение на кредитный комитет как спор о бизнес-правиле"
    answer: "Отказать: источник истины по обязательствам группы — АБС, вторая копия разойдётся, и сверки этого не исправят"
    explanation: >
      Владение данными — сильнейший признак границы: обязательства группы
      меняются любыми операциями банка, и ночная копия будет устаревшей ровно в
      тот момент, когда решение принимается. Сверка обнаруживает расхождение
      постфактум, но решение по заявке к тому времени уже принято на неверных
      данных.
  - question: Комплаенс требует хранить согласие на запрос кредитной истории и предъявлять его по запросу. Как это оформить?
    options:
      - "Как ограничение в отдельном списке, не подлежащее приоритизации, с трассировкой в системное требование и тест-кейс"
      - "Как требование с наивысшим приоритетом в общем бэклоге"
      - "Как бизнес-правило в каталоге правил с владельцем «комплаенс»"
      - "Как нефункциональное требование категории «безопасность»"
    answer: "Как ограничение в отдельном списке, не подлежащее приоритизации, с трассировкой в системное требование и тест-кейс"
    explanation: >
      Невыполнение ведёт к нарушению нормативных требований, поэтому предмет не
      обсуждается и не конкурирует за место в спринте, а трассировка позволяет за
      минуту показать проверке подтверждение. Наивысший приоритет в бэклоге
      кажется равнозначным, но любой приоритет со временем уступает более
      высокому.
  - question: Какие утверждения о критериях приёмки верны? (несколько ответов)
    options:
      - "Негативных критериев обычно больше, чем позитивных"
      - "Критерий на права доступа нужен даже там, где функция доступна всем ролям текущего этапа"
      - "Критерий может ссылаться на внутреннее поле таблицы, если так точнее"
      - "Из хорошего критерия тест-кейс получается механически"
    answer: ["Негативных критериев обычно больше, чем позитивных", "Критерий на права доступа нужен даже там, где функция доступна всем ролям текущего этапа", "Из хорошего критерия тест-кейс получается механически"]
    explanation: >
      Исключения, отказы зависимостей и попытки действий без прав дают больше
      проверок, чем основной поток, а проверяемость критерия означает
      возможность превратить его в тест без домысливания. Ссылка на внутреннее
      поле неверна: она делает критерий зависимым от устройства хранилища и
      ломается при рефакторинге, не меняющем поведение.
  - question: Менеджер отделения М-12 запрашивает по API заявку отделения М-07. Что вернуть и что записать?
    options:
      - "404, событие в журнале доступа с результатом «отказано»"
      - "403 с кодом branch_scope_violation, событие в журнале"
      - "404 без записи: обращение не состоялось"
      - "403 без записи: отказ не является доступом к данным"
    answer: "404, событие в журнале доступа с результатом «отказано»"
    explanation: >
      Ответ 403 подтвердил бы существование заявки по этому идентификатору, а это
      само по себе сведения о том, кто обращался в банк; сотрудник отказа как
      такового не видит, а служба безопасности видит попытку. Не записывать
      отказы нельзя: именно последовательность отказов выдаёт перебор.
  - question: Скоринговый сервис отвечает медленнее 500 мс в 8% случаев. Какое проектное решение правильнее?
    options:
      - "Оставить таймаут и переводить такие заявки в manual_review с признаком score_unavailable"
      - "Увеличить таймаут до 5 секунд, чтобы дождаться ответа"
      - "Кешировать балл на 24 часа и использовать его при таймауте"
      - "Повторять запрос до трёх раз внутри того же пользовательского вызова"
    answer: "Оставить таймаут и переводить такие заявки в manual_review с признаком score_unavailable"
    explanation: >
      Деградация сохраняет поток заявок и передаёт сомнительный случай человеку —
      цена в виде ручного рассмотрения 8% заявок меньше, чем задержка для всех.
      Кеширование балла особенно опасно: балл привязан к состоянию клиента на
      момент расчёта, и использование вчерашнего значения означает решение по
      устаревшим данным.
  - question: Потребитель события application.decided должен показать в отчёте сумму одобренного кредита. Как это организовать?
    options:
      - "Потребитель запрашивает сумму по API с проверкой прав, получив из события только идентификатор заявки"
      - "Добавить сумму в событие: она неизменна после решения"
      - "Публиковать отдельное событие с суммой в закрытую очередь для отчётности"
      - "Передавать сумму в событии в зашифрованном виде"
    answer: "Потребитель запрашивает сумму по API с проверкой прав, получив из события только идентификатор заявки"
    explanation: >
      Брокер отдаёт сообщение подписчику целиком и не проверяет прав, а копии
      сообщения оседают в его журналах, резервных копиях и средствах
      мониторинга. Неизменность суммы здесь ни при чём — ограничение связано не с
      актуальностью данных, а с их распространением.
  - question: АБС подтвердила выдачу, ответ не дошёл, заявка осталась в approved. Что должно это исправить?
    options:
      - "Ежедневная сверка по application_id: находит сделку и переводит заявку в issued"
      - "Повтор передачи сделки с тем же идемпотентным ключом"
      - "Компенсирующая операция снятия резерва лимита"
      - "Ручной разбор дежурным аналитиком по обращению менеджера"
    answer: "Ежедневная сверка по application_id: находит сделку и переводит заявку в issued"
    explanation: >
      Идемпотентный повтор защищает от второй выдачи, но не восстанавливает
      знание о первой; расхождение состояний двух систем — ровно та задача, для
      которой существует сверка. Снятие резерва по фактически выданной сделке
      создало бы второе, более опасное расхождение.
  - question: Риск-подразделение просит показывать менеджерам скоринговый балл, чтобы они «лучше готовили заявки». Что ответить?
    options:
      - "Отказать: зная балл, менеджеры начнут подбирать параметры заявки под порог, и модель перестанет отражать реальность"
      - "Согласиться: риск-подразделение является владельцем скоринговых правил"
      - "Согласиться при условии журналирования каждого просмотра балла"
      - "Показывать балл только по заявкам, уже получившим решение"
    answer: "Отказать: зная балл, менеджеры начнут подбирать параметры заявки под порог, и модель перестанет отражать реальность"
    explanation: >
      Ограничение здесь не из требований безопасности, а из качества модели, но
      реализуется теми же средствами разграничения полей. Владение правилами не
      означает права менять состав данных на экране другой роли: это решение
      затрагивает и комплаенс, и качество портфеля.
  - question: Порог автоматического решения решено вынести в настройку, изменяемую риск-аналитиком. Что обязательно добавить к этому решению?
    options:
      - "Журналирование изменения настройки и фиксацию версии правил в каждой заявке"
      - "Согласование изменения с командой разработки перед применением"
      - "Ограничение на частоту изменения настройки — не чаще раза в квартал"
      - "Дублирование значения в коде на случай недоступности хранилища настроек"
    answer: "Журналирование изменения настройки и фиксацию версии правил в каждой заявке"
    explanation: >
      Без журнала и версии невозможно объяснить, почему сходные заявки получили
      разные решения, — а именно этот вопрос задаёт аудит. Ограничение частоты не
      требуется: смысл вынесения порога в настройку как раз в том, чтобы
      менять его без релиза, когда этого требует политика.
  - question: Аудитор просит доступ ко всем полям карточки заявки, включая ФИО и телефон руководителя клиента. Что предложить?
    options:
      - "Дать доступ к процедурным данным — ролям, времени, версии правил, полноте проверок — без персональных данных"
      - "Дать полный доступ на чтение: аудит проверяет всё"
      - "Дать полный доступ, но журналировать каждое обращение"
      - "Отказать в доступе: аудит работает по выгрузкам от администратора"
    answer: "Дать доступ к процедурным данным — ролям, времени, версии правил, полноте проверок — без персональных данных"
    explanation: >
      Минимизация определяется задачей: аудитор проверяет соблюдение процедуры, и
      для этого достаточно сведений о том, кто и на каком основании принял
      решение. Журналирование полного доступа не заменяет ограничения состава
      полей — оно фиксирует, но не предотвращает избыточное раскрытие.
  - question: Что должно происходить с заявками, находящимися в статусе checks_running, в момент изменения бизнес-правила?
    options:
      - "Они рассматриваются по версии правил, зафиксированной при переходе в submitted"
      - "Они пересчитываются по новой версии правил автоматически"
      - "Они возвращаются в draft для повторной отправки"
      - "Решение принимает система по более мягкой из двух редакций"
    answer: "Они рассматриваются по версии правил, зафиксированной при переходе в submitted"
    explanation: >
      Обратная сила применяется только по отдельному решению заказчика, а по
      умолчанию действует редакция на момент подачи — именно это фиксирует поле
      rules_version. Выбор «более мягкой редакции» выглядит клиентоориентированным,
      но создаёт правило, которого нет ни в одном документе, и делает решения
      необъяснимыми.
  - question: На пилоте два отделения, 186 заявок за 4 недели, все целевые показатели выполнены, кроме доли возвратов на доработку. Какое решение обоснованно?
    options:
      - "Устранить причину возвратов и после этого расширять пилот волнами"
      - "Расширять пилот параллельно с разбором причины"
      - "Смягчить критерий: отклонение невелико"
      - "Продлить пилот ещё на 4 недели без изменений"
    answer: "Устранить причину возвратов и после этого расширять пилот волнами"
    explanation: >
      Критерий сработал как задумано — показал дефект процесса при ограниченном
      ущербе, и тиражирование до его устранения умножит проблему на 38 отделений.
      Продление пилота без изменений ничего не даст: показатель сам по себе не
      улучшится, пока причина на месте.
  - question: Какие из решений уменьшают последствия отказа смежной системы? (несколько ответов)
    options:
      - "Перевод обмена в асинхронную схему там, где результат не нужен немедленно"
      - "Описанная деградация с понятным пользователю поведением"
      - "Предохранитель, прекращающий вызовы после серии ошибок"
      - "Увеличение таймаута синхронного вызова до времени ответа сервиса в худшем случае"
    answer: ["Перевод обмена в асинхронную схему там, где результат не нужен немедленно", "Описанная деградация с понятным пользователю поведением", "Предохранитель, прекращающий вызовы после серии ошибок"]
    explanation: >
      Первые три решения снимают зависимость доступности, дают предсказуемое
      поведение и не дают накапливаться ожидающим запросам. Увеличение таймаута
      действует наоборот: пользователь ждёт дольше, ресурсы заняты, и короткая
      недоступность превращается в долгую.
  - question: Тестировщик просит копию промышленной базы для проверки производительности на реальных объёмах. Что предложить?
    options:
      - "Синтетические данные с промышленными объёмами и распределениями, плюс набор эталонных заявок под сценарии приёмки"
      - "Копию с удалёнными полями ФИО и телефонов"
      - "Копию с доступом только для двух тестировщиков и журналированием"
      - "Тестирование производительности на промышленной среде в нерабочие часы"
    answer: "Синтетические данные с промышленными объёмами и распределениями, плюс набор эталонных заявок под сценарии приёмки"
    explanation: >
      Нужны объёмы и распределения, а не настоящие люди, и генератор даёт их без
      выноса персональных данных за периметр. Удаление ФИО обезличиванием не
      является: сочетание ИНН, суммы, даты и отделения идентифицирует клиента не
      хуже фамилии.
  - question: Через полгода после запуска служба безопасности спрашивает, кто из сотрудников обращался к заявке конкретного клиента. Что делает возможным ответ за минуты?
    options:
      - "Журнал доступа с поиском по объекту, где записаны факты чтения, раскрытые разделы и основание доступа"
      - "История изменений заявки с указанием авторов переходов статусов"
      - "Технические логи приложения со сквозным идентификатором запроса"
      - "Отчёт из корпоративного хранилища по ночной выгрузке"
    answer: "Журнал доступа с поиском по объекту, где записаны факты чтения, раскрытые разделы и основание доступа"
    explanation: >
      Утечка выглядит как последовательность обычных чтений, а их фиксирует
      только журнал доступа — и требование искать по объекту формулируется
      заранее, иначе поиск займёт недели. История изменений показывает лишь тех,
      кто менял заявку, а просмотры в ней не отражаются вовсе.
