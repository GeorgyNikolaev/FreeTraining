pass_score: 70
questions:
  - question: Какой признак сильнее прочих говорит, что функция должна остаться за границей системы?
    options:
      - "Источником истины по данным является другая система"
      - "Функцию сложно реализовать в срок"
      - "Пользователи обращаются к ней реже раза в неделю"
      - "Для неё нужна интеграция по HTTP"
    answer: "Источником истины по данным является другая система"
    explanation: >
      Вторая «настоящая» копия чужих данных неизбежно расходится с оригиналом, и
      сверки этого не лечат — лечит только отказ от копии. Сложность реализации
      соблазнительна как критерий, но она говорит об оценке и сроках, а не о
      том, кто отвечает за данные: тяжёлая функция со своим источником истины
      всё равно остаётся внутри.
  - question: Что обязательно содержит строка списка «вне границ»?
    options:
      - "Формулировку, чего система не делает, и указание, кто делает это вместо неё"
      - "Только формулировку, чего система не делает"
      - "Оценку трудозатрат на отклонённую функцию"
      - "Ссылку на требование, из которого функция была исключена"
    answer: "Формулировку, чего система не делает, и указание, кто делает это вместо неё"
    explanation: >
      Без второй половины список не снимает вопрос, а прячет его: на приёмке
      заказчик всё равно спросит, где отчётность, и ответ «не у нас» его не
      устроит. Голая формулировка отказа выглядит достаточной, но именно она
      порождает спор о том, кто закрывает пробел.
  - question: Чем контекстная диаграмма отличается от диаграммы архитектуры?
    options:
      - "Система показана одним блоком, внутреннее устройство не раскрывается"
      - "На ней запрещены смежные системы, есть только люди"
      - "Она рисуется в BPMN, а не в UML"
      - "На ней не подписывают стрелки"
    answer: "Система показана одним блоком, внутреннее устройство не раскрывается"
    explanation: >
      Задача контекста — обсуждать границу, а не устройство; как только на схеме
      появляются очередь и база, разговор уходит в технологии. Вариант про
      «только людей» правдоподобен, потому что акторы на контексте действительно
      есть, но смежные системы — обязательная часть контекста.
  - question: Служба безопасности требует запретить экспорт заявок в файл. Как это классифицировать?
    options:
      - "Как ограничение, если невыполнение ведёт к нарушению нормативных требований"
      - "Как требование с высоким приоритетом в общем бэклоге"
      - "Как пожелание, пока не подтверждено заказчиком"
      - "Как дефект текущего процесса"
    answer: "Как ограничение, если невыполнение ведёт к нарушению нормативных требований"
    explanation: >
      Проверка простая: что будет, если не сделать. Ответ «нарушим требования и
      не пройдём проверку» означает ограничение — его не приоритизируют и не
      двигают по спринтам. Поместить его в общий бэклог с высоким приоритетом
      кажется аккуратным, но любой высокий приоритет рано или поздно уступает
      более высокому.
  - question: Почему акторов на контекстной диаграмме записывают ролями, а не фамилиями?
    options:
      - "Роль переживает кадровые изменения и напрямую связана с правами доступа"
      - "Фамилии запрещено указывать в проектной документации"
      - "Роли короче и лучше помещаются на схеме"
      - "Иначе диаграмму нельзя согласовать с заказчиком"
    answer: "Роль переживает кадровые изменения и напрямую связана с правами доступа"
    explanation: >
      Из ролей вырастает матрица прав, а фамилия устаревает при первом переводе
      сотрудника. Запрет на фамилии в документации звучит убедительно, но такого
      общего запрета нет: причина именно в устойчивости модели, а не в форме
      документа.
  - question: Почему выгрузку заявок в Excel описывают наравне с интеграциями?
    options:
      - "Это канал выхода данных за пределы системы, и он даёт часть инцидентов с конфиденциальностью"
      - "Excel-файлы нужно версионировать так же, как контракты API"
      - "Без описания выгрузки платформа не примет курс требований"
      - "Любой файл считается внешней системой по стандартам разработки"
    answer: "Это канал выхода данных за пределы системы, и он даёт часть инцидентов с конфиденциальностью"
    explanation: >
      Данные, покинувшие систему через выгрузку, перестают подчиняться её правам
      доступа, поэтому канал описывают, ограничивают состав полей и
      журналируют. Аргумент про версионирование звучит технично, но проблема
      выгрузки не в совместимости формата, а в утечке содержимого.
