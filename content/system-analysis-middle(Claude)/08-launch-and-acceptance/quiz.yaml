pass_score: 70
questions:
  - question: На пилоте доля возвратов на доработку составила 31% при целевых 25%. Какое действие правильное?
    options:
      - "Разобрать причину возвратов и устранить её до расширения пилота"
      - "Расширять пилот: превышение на 6 процентных пунктов несущественно"
      - "Смягчить критерий до 35%, раз фактическое значение выше"
      - "Остановить проект и вернуться к почтовому процессу"
    answer: "Разобрать причину возвратов и устранить её до расширения пилота"
    explanation: >
      Критерий сработал ровно так, как задумано: он показал проблему, которую в
      промышленной эксплуатации заметили бы через полгода — менеджеры не
      понимали, какие страницы отчётности требуются. Смягчение критерия задним
      числом обесценивает всю конструкцию пилота: тогда любой результат окажется
      приемлемым.
  - question: Почему заявки, поданные до даты перехода, дорабатываются в старом процессе, а не мигрируют в «Конвейер»?
    options:
      - "Сопоставление старых состояний с новыми порождает грязные данные, а часть нужных сведений в старом процессе просто отсутствует"
      - "Миграция состояний технически невозможна"
      - "Пользователи не согласились работать с перенесёнными заявками"
      - "Старые заявки не соответствуют новым бизнес-правилам и должны быть отклонены"
    answer: "Сопоставление старых состояний с новыми порождает грязные данные, а часть нужных сведений в старом процессе просто отсутствует"
    explanation: >
      Незавершённые объекты — самая дорогая часть миграции, и отказ от их
      переноса убирает целый класс дефектов ценой временного сосуществования
      двух процессов с жёсткой датой закрытия. Отклонять их из-за новых правил
      нельзя: правила применяются по редакции на дату подачи.
  - question: Какая декомпозиция задачи правильная?
    options:
      - "Менеджер не видит заявки чужого отделения ни в списке, ни по прямой ссылке"
      - "Спроектировать и создать таблицы заявок и решений"
      - "Реализовать серверную часть интеграции с БКИ"
      - "Настроить роли и права во всех разделах системы"
    answer: "Менеджер не видит заявки чужого отделения ни в списке, ни по прямой ссылке"
    explanation: >
      Вертикальный срез даёт проверяемый результат целиком и позволяет
      остановить работу, не выбросив сделанное. Задачи вида «сделать таблицы»
      или «сделать бэкенд» удобны исполнителю, но до самого конца ничего нельзя
      показать, принять или отменить.
  - question: "Проверка «ответ API менеджеру не содержит поля score» на первой приёмке не прошла: поле присутствовало со значением null. Почему это дефект, а не мелочь?"
    options:
      - "Состав ответа определяется правами, и для другой роли то же поле возвращалось со значением — ограничение выполнялось не на сервере"
      - "Поле null нарушает схему OpenAPI"
      - "Наличие поля увеличивает размер ответа и замедляет интерфейс"
      - "Клиентское приложение может упасть при обработке null"
    answer: "Состав ответа определяется правами, и для другой роли то же поле возвращалось со значением — ограничение выполнялось не на сервере"
    explanation: >
      Присутствие поля выдаёт, что фильтрация делается не на уровне права, а
      где-то ближе к интерфейсу, и достаточно другой роли или другой ручки, чтобы
      значение утекло. Нарушение схемы и размер ответа — следствия, которые сами
      по себе дефекта такого уровня не образуют.
  - question: Порог автоматического решения поднят с 5 до 7 млн ₽. Что обязательно определить помимо нового значения?
    options:
      - "Что происходит с заявками, уже находящимися в работе на момент изменения"
      - "Кто из разработчиков внесёт изменение в код"
      - "Нужно ли уведомлять клиентов о смене политики"
      - "Как изменение отразится на нагрузке на АБС"
    answer: "Что происходит с заявками, уже находящимися в работе на момент изменения"
    explanation: >
      Вопрос обратной силы — обязательная часть любого изменения правила, и
      ответ на него даёт владелец правила: заявки дорабатываются по версии,
      зафиксированной при подаче. Вопрос о разработчике здесь не возникает
      вовсе: порог был вынесен в настройку на этапе требований именно ради
      такого случая.
  - question: На приёмке два сценария из 64 приняты с оговорками. Что с ними сделать?
    options:
      - "Записать в протокол как принятые отклонения с датой устранения"
      - "Считать их выполненными: заказчик не возражал"
      - "Заблокировать приёмку до полного устранения"
      - "Перенести в бэклог без указания в протоколе, чтобы не портить результат"
    answer: "Записать в протокол как принятые отклонения с датой устранения"
    explanation: >
      Зафиксированное отклонение остаётся обязательством с понятным сроком, и к
      нему можно вернуться. Отклонение, не попавшее в протокол, через месяц
      перестаёт считаться отклонением и становится нормой, а блокировать запуск
      из-за двух непринципиальных сценариев дороже, чем принять их с записью.
