pass_score: 70
questions:
  - question: К какому уровню относится формулировка «при переходе заявки в статус checks_running система запрашивает отчёт в двух БКИ параллельно с таймаутом 5 секунд»?
    options:
      - "Системное требование"
      - "Бизнес-требование"
      - "Пользовательское требование"
      - "Бизнес-правило"
    answer: "Системное требование"
    explanation: >
      Формулировка описывает поведение системы в конкретном состоянии с
      конкретным значением таймаута — это системный уровень. Бизнес-правилом её
      считать соблазнительно из-за числа 5 секунд, но правило описывает
      предметную область банка, а таймаут интеграции — свойство реализации
      обмена, и владелец у него технический.
  - question: Почему системное требование ссылается на BRULE-4, а не пишет «5 000 000 ₽» прямо в тексте?
    options:
      - "Порог меняет владелец правила, и при изменении не нужно править все ссылающиеся требования"
      - "Числа в требованиях запрещены, они уходят в конфигурацию"
      - "Так требование становится короче и читается легче"
      - "Иначе невозможно построить матрицу трассируемости"
    answer: "Порог меняет владелец правила, и при изменении не нужно править все ссылающиеся требования"
    explanation: >
      Правило живёт отдельно, потому что участвует в нескольких сценариях и
      меняется чаще требований; ссылка гарантирует одно место правки и одну
      историю версий. Утверждение «числа в требованиях запрещены» неверно: в
      нефункциональных требованиях числа обязательны — там они и есть предмет
      договорённости.
  - question: Какой критерий приёмки пригоден для проверки?
    options:
      - "Тогда система возвращает 403 Forbidden и записывает событие в журнал доступа"
      - "Тогда система корректно обрабатывает попытку доступа"
      - "Тогда в таблице applications выставляется status = 3"
      - "Тогда кнопка «Решение» становится серой и смещается вправо"
    answer: "Тогда система возвращает 403 Forbidden и записывает событие в журнал доступа"
    explanation: >
      Проверяемый результат виден снаружи и не зависит от устройства системы.
      Вариант с полем status = 3 выглядит самым конкретным, но он описывает
      внутреннее хранилище: после рефакторинга критерий станет ложным, хотя
      поведение не изменится.
  - question: Зачем в заявке хранится номер версии правил, по которым она рассматривалась?
    options:
      - "Чтобы объяснить, почему похожие заявки разных дат получили разные решения"
      - "Чтобы можно было пересчитать старые заявки по новым правилам"
      - "Чтобы разработчики знали, какую ветку кода развернуть"
      - "Чтобы правила нельзя было изменить задним числом"
    answer: "Чтобы объяснить, почему похожие заявки разных дат получили разные решения"
    explanation: >
      Версия фиксирует редакцию, действовавшую на момент подачи, и снимает
      вопрос аудита о расхождении решений. Пересчёт старых заявок по новым
      правилам — как раз то, чего версия позволяет избежать: обратная сила
      применяется только по отдельному решению заказчика.
  - question: Почему в нефункциональных требованиях используют перцентиль, а не среднее время ответа?
    options:
      - "Среднее скрывает хвост: при среднем 300 мс часть пользователей может ждать секунды"
      - "Перцентиль проще измерить имеющимися средствами мониторинга"
      - "Среднее нельзя посчитать до запуска системы"
      - "Перцентиль требуется стандартами информационной безопасности"
    answer: "Среднее скрывает хвост: при среднем 300 мс часть пользователей может ждать секунды"
    explanation: >
      Жалуются именно те, кто попал в хвост распределения, а среднее их не
      видит. Простота измерения тут ни при чём: и среднее, и перцентили берутся
      из одних и тех же данных мониторинга.
  - question: Что обязательно указать для каждой внешней зависимости в таблице деградации?
    options:
      - "Поведение системы при её недоступности и то, что видит пользователь"
      - "Стоимость лицензии и контакты владельца сервиса"
      - "Протокол обмена и формат сообщений"
      - "Планируемую дату вывода зависимости из эксплуатации"
    answer: "Поведение системы при её недоступности и то, что видит пользователь"
    explanation: >
      Без явного ответа решение принимает разработчик в момент отказа, и обычно
      не то, которое устроит бизнес: например, отклонит заявку вместо перевода
      на ручную проверку. Протокол и формат нужны для контракта интеграции, но
      они не отвечают на вопрос, что делать, когда ответа нет.
