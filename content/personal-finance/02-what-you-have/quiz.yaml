pass_score: 70
questions:
  - question: >
      Человек купил машину за 1 800 000 ₽ два года назад. Сегодня такие же
      продают за 1 100 000 ₽, а остаток автокредита — 700 000 ₽. Какие числа
      попадут в расчёт чистого капитала?
    options:
      - text: "Имущество 1 100 000 ₽, долг 700 000 ₽"
        correct: true
      - text: "Имущество 1 800 000 ₽, долг 700 000 ₽"
      - text: "Имущество 400 000 ₽, долгов нет"
      - text: "Имущество 1 100 000 ₽, долгов нет — кредит уже учтён в цене машины"
    explanation: >
      Имущество считается по цене, за которую его можно продать сегодня, —
      это 1 100 000 ₽. Цена покупки 1 800 000 ₽ не значит ничего: машина
      подешевела, и продать её за эти деньги нельзя. Долг идёт отдельной
      строкой полностью, а не вычитается из стоимости заранее: вариант с
      400 000 ₽ даёт тот же итог только в этом примере и ломается, как только
      машин или кредитов становится несколько.
  - question: >
      На кредитной карте одобрен лимит 250 000 ₽, потрачено 40 000 ₽. Как это
      отражается в чистом капитале?
    options:
      - text: "Долг 40 000 ₽; свободный лимит не учитывается вообще"
        correct: true
      - text: "Имущество 210 000 ₽ и долг 40 000 ₽"
      - text: "Имущество 250 000 ₽ и долг 40 000 ₽"
      - text: "Ничего не учитывается: кредитная карта — не кредит, пока не пришёл счёт"
    explanation: >
      Потраченные 40 000 ₽ — это заём, он идёт в долги. Свободный лимит —
      возможность взять в долг, а не деньги: пока вы им не воспользовались,
      у вас ничего не прибавилось. Учитывать лимит как имущество — самая
      частая ошибка, после которой чистый капитал завышается на сотни тысяч.
  - question: >
      Почему поток, посчитанный по одному обычному месяцу, обычно получается
      оптимистичнее реального?
    options:
      - text: "В него не попадают расходы, которые приходят раз в год: страховка, отпуск, налоги, подарки"
        correct: true
      - text: "Потому что зарплата в разные месяцы разная"
      - text: "Потому что банки показывают в приложении не все операции"
      - text: "Потому что инфляция обесценивает расходы прошлых месяцев"
    explanation: >
      Годовые расходы реальны и предсказуемы, но в «обычный» месяц не попадают:
      ОСАГО, отпуск, налоги и подарки в сумме дают заметную величину — в примере
      урока около 10 400 ₽ в месяц. Неровность зарплаты бывает, но она не
      объясняет систематический перекос именно в оптимистичную сторону, а
      операции банк показывает все.
  - question: >
      У человека месячный минус 12 000 ₽. Какие два варианта стоит рассмотреть
      первыми?
    options:
      - text: "Пересмотреть платёж по автокредиту"
        correct: true
      - text: "Переехать в жильё дешевле или пересдать комнату"
        correct: true
      - text: "Отказаться от подписок на музыку и кино"
      - text: "Реже заказывать доставку еды"
    explanation: >
      Начинать нужно с самых крупных строк — жильё, транспорт и долги, —
      потому что там решение принимается один раз и действует годами. Подписки
      и доставка закрывают несколько процентов минуса, но требуют усилия каждый
      день. Это не значит, что мелкие траты не важны: это значит, что они не
      первые в очереди.
  - question: >
      Зачем в схеме «сначала отложить» нужен отдельный счёт под годовые расходы,
      если деньги всё равно будут потрачены?
    options:
      - text: "Чтобы отпуск и страховка оплачивались из накопленного, а не из кредитной карты в момент, когда счёт пришёл"
        correct: true
      - text: "Чтобы на эти деньги начислялись проценты и расходы покрывались сами собой"
      - text: "Чтобы эти расходы можно было вычесть из налога"
      - text: "Чтобы банк видел регулярные накопления и дал более выгодную ставку по кредиту"
    explanation: >
      Смысл отдельного счёта — во времени, а не в доходности: расход известен
      заранее, но приходит разово и крупно, и без накопления его нечем закрыть,
      кроме долга. Проценты на таком счёте будут, но они не покрывают расход;
      на налоги и на кредитную ставку это никак не влияет.
  - question: >
      Человек с зарплатой 400 000 ₽ в месяц имеет отрицательный чистый капитал.
      Это возможно?
    options:
      - text: "Да: доход и капитал — независимые числа, долги могут превышать имущество при любом доходе"
        correct: true
      - text: "Нет: при такой зарплате капитал не может быть отрицательным"
      - text: "Да, но только если он не работает официально"
      - text: "Да, но только в первый месяц после покупки жилья в ипотеку"
    explanation: >
      Чистый капитал — снимок имущества и долгов, доход в него не входит вообще.
      Человек с высоким доходом и несколькими крупными кредитами легко оказывается
      в минусе по капиталу. Ипотека сама по себе минуса не создаёт: квартира идёт
      в имущество целиком, и в момент покупки капитал меняется примерно на размер
      расходов по сделке.
