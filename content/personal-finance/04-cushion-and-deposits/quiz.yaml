pass_score: 70
questions:
  - question: >
      От чего считается размер подушки безопасности?
    options:
      - text: "От ежемесячных расходов, включая годовые в пересчёте на месяц"
        correct: true
      - text: "От ежемесячного дохода"
      - text: "От суммы всех кредитных платежей"
      - text: "От размера страхового лимита АСВ"
    explanation: >
      Подушка нужна на период, когда доход прекратился, — значит, считать её надо
      от того, что вы будете тратить. При зарплате 200 000 ₽ и расходах 125 000 ₽
      подушка на три месяца — это 375 000 ₽, а не 600 000 ₽. Кредитные платежи
      входят в расходы, но одними ими дело не ограничивается.
  - question: >
      На накопительном счёте лежало 300 000 ₽ под 12% годовых. Десятого числа
      сняли 200 000 ₽, двадцатого вернули. Банк начисляет проценты на минимальный
      остаток за месяц. Что произойдёт с доходом за этот месяц?
    options:
      - text: "Проценты начислят на 100 000 ₽ за весь месяц — доход упадёт примерно втрое"
        correct: true
      - text: "Проценты начислят на 300 000 ₽: деньги вернулись до конца месяца"
      - text: "Проценты начислят по дням: 300 000 ₽ за 20 дней и 100 000 ₽ за 10 дней"
      - text: "Проценты не начислят вообще: были расходные операции"
    explanation: >
      При начислении на минимальный остаток берётся наименьшая сумма за месяц —
      100 000 ₽ — и на неё начисляется процент за весь месяц: 986 ₽ вместо
      2 301 ₽ при ежедневном начислении. Расчёт по дням — это другой способ
      начисления, и именно его стоит искать в условиях счёта.
  - question: >
      В одном банке у человека вклад 1 000 000 ₽, накопительный счёт 300 000 ₽ и
      400 000 ₽ на дебетовой карте. Сколько застраховано в АСВ?
    options:
      - text: "1 400 000 ₽ — лимит один на все счета в этом банке"
        correct: true
      - text: "1 700 000 ₽ — вклад и накопительный счёт страхуются, карта нет"
      - text: "Всё: по 1 400 000 ₽ на каждый счёт"
      - text: "1 000 000 ₽ — страхуется только вклад"
    explanation: >
      Лимит 1,4 млн ₽ действует на человека в банке и считается суммарно по всем
      счетам: вкладам, накопительным счетам, картам, счетам в валюте. Из 1,7 млн ₽
      застраховано 1,4 млн ₽, остальные 300 000 ₽ попадут в общую очередь
      кредиторов. Деньги на карте застрахованы так же, как на вкладе.
  - question: >
      Вклад открыт под 12,37% годовых на сумму ровно 1 400 000 ₽. Какая проблема
      возникнет к концу года?
    options:
      - text: "Начисленные проценты выйдут за лимит страхования и окажутся незастрахованными"
        correct: true
      - text: "Никакой: сумма равна лимиту"
      - text: "Банк не имеет права принимать вклад, равный лимиту"
      - text: "С процентов придётся заплатить повышенный налог 15%"
    explanation: >
      Лимит включает начисленные проценты. К концу года на счёте будет
      1 573 180 ₽, из которых 173 180 ₽ вне страховки. Поэтому под лимит кладут
      сумму с запасом на проценты. Ставка налога 15% применяется только к
      процентному доходу свыше 2,4 млн ₽ в год — здесь до неё далеко.
  - question: >
      За 2026 год человек получил 192 000 ₽ процентов по двум вкладам в разных
      банках и 1 900 ₽ по зарплатной карте со ставкой 0,5% годовых. Какой будет
      налог?
    options:
      - text: "4 160 ₽"
        correct: true
      - text: "4 407 ₽"
      - text: "0 ₽ — по каждому вкладу доход меньше необлагаемого минимума"
      - text: "24 960 ₽"
    explanation: >
      Проценты по счетам со ставкой не выше 1% годовых не учитываются, поэтому
      1 900 ₽ в расчёт не идут. База: 192 000 − 160 000 (необлагаемый минимум за
      2026 год) = 32 000 ₽, налог 13% — 4 160 ₽. Вариант 4 407 ₽ получается,
      если включить проценты по карте. Ноль получается, если применить
      необлагаемый минимум к каждому вкладу: он один на все банки сразу.
      24 960 ₽ — это 13% со всей суммы без вычета минимума.
  - question: >
      В сентябре 2026 года средняя ставка по вкладу на 3 месяца выше, чем по
      вкладу на 3 года. Что из этого следует?
    options:
      - text: "Рынок ожидает снижения ключевой ставки, и банкам невыгодно фиксировать высокий процент надолго"
        correct: true
      - text: "Длинные вклады всегда менее выгодны, чем короткие"
      - text: "Банки штрафуют вкладчиков за длинный срок размещения"
      - text: "По длинным вкладам выше страховой лимит, и это компенсируется ставкой"
    explanation: >
      Ставки по длинным вкладам отражают ожидания рынка: если ключевая ставка,
      по прогнозу, будет снижаться, банк не станет обещать высокий процент на
      три года вперёд. Это свойство момента, а не правило: когда рынок ждёт
      роста ставок, длинные вклады становятся выгоднее коротких. Повышенный
      страховой лимит существует только у безотзывных сберегательных
      сертификатов и со ставкой по обычным вкладам не связан.
  - question: >
      У человека есть подушка на один месяц расходов и долг по кредитной карте
      100 000 ₽ под 39,9% годовых. Накопительный счёт даёт 10% годовых. Что
      разумнее сделать со свободными 100 000 ₽?
    options:
      - text: "Погасить долг по карте: это эквивалент доходности около 40% годовых без риска"
        correct: true
      - text: "Положить на накопительный счёт и довести подушку до трёх месяцев"
      - text: "Разделить пополам между погашением и накоплением"
      - text: "Открыть вклад на три месяца под 13,63% — ставка выше, чем у накопительного счёта"
    explanation: >
      Погашение долга под 39,9% приносит те же 39,9% годовых гарантированно,
      тогда как любое размещение даёт 10–13,6%. Разница около 27 процентных
      пунктов в год, то есть примерно 27 000 ₽ на эту сумму. Подушка на один
      месяц уже есть — она защищает от того, чтобы при первой же поломке снова
      залезть в карту, а доводить её до трёх месяцев имеет смысл после того, как
      дорогой долг закрыт.
