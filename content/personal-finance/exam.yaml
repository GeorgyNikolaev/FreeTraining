pass_score: 80
questions:
  - question: >
      Человек зарабатывает 180 000 ₽ в месяц, ежемесячные расходы — 150 000 ₽,
      а раз в год он тратит ещё 180 000 ₽ на отпуск, страховки и налоги. Каков
      его реальный денежный поток?
    options:
      - text: "+15 000 ₽ в месяц"
        correct: true
      - text: "+30 000 ₽ в месяц"
      - text: "−15 000 ₽ в месяц"
      - text: "Посчитать нельзя: не хватает данных о его имуществе"
    explanation: >
      Годовые расходы переводятся в месячные: 180 000 / 12 = 15 000 ₽. Поток
      180 000 − 150 000 − 15 000 = +15 000 ₽. Ответ +30 000 ₽ получается, если
      учесть только ежемесячные расходы — именно так человек и приходит к
      ощущению, что «вроде хватает», а в декабре занимает. Имущество относится к
      чистому капиталу и на поток не влияет.
  - question: >
      Два предложения на один год: вклад под 12,8% с выплатой процентов в конце
      срока и вклад под 12,4% с ежемесячной капитализацией. Как сравнить их
      правильно?
    options:
      - text: "Посчитать эффективную ставку второго: (1 + 0,124/12)¹² − 1 ≈ 13,13% — он выгоднее"
        correct: true
      - text: "Выгоднее первый: 12,8% больше 12,4%"
      - text: "Выгоднее первый: при капитализации проценты облагаются налогом дважды"
      - text: "Предложения равны: капитализация не меняет итоговую сумму"
    explanation: >
      Капитализация превращает номинальные 12,4% в эффективные 13,13% — это
      больше 12,8%. Сравнение по числу из рекламы систематически вводит в
      заблуждение именно в таких случаях. Налог считается один раз с фактически
      полученного процентного дохода, независимо от способа начисления.
  - question: >
      Годовая инфляция 6,3%. Какая из позиций теряет покупательную способность?
    options:
      - text: "Наличные дома — реальная доходность −5,93% в год"
        correct: true
      - text: "Вклад под 9% — реальная доходность 2,54%"
      - text: "Вклад под 12% — реальная доходность 5,36%"
      - text: "Ни одна: рубли остаются рублями"
    explanation: >
      Реальная доходность считается как (1 + ставка) / (1 + инфляция) − 1. У
      наличных ставка нулевая, поэтому реальная доходность отрицательна: за год
      100 000 ₽ теряют около 5 930 ₽ покупательной способности. Вклады под 9% и
      12% при инфляции 6,3% дают положительную реальную доходность.
  - question: >
      Магазин предлагает товар за 240 000 ₽ при оплате сразу или 12 платежей по
      22 000 ₽ «без переплаты». Какова фактическая годовая ставка?
    options:
      - text: "Около 18% годовых"
        correct: true
      - text: "10% годовых — переплата 24 000 ₽ от 240 000 ₽"
      - text: "0% — так написано в договоре"
      - text: "24% годовых — по 2% в месяц"
    explanation: >
      Функция СТАВКА(12; −22000; 240000) даёт около 1,5% в месяц, то есть 17,97%
      годовых. Деление переплаты на полную цену (10%) занижает ставку примерно
      вдвое, потому что долг уменьшается с каждым платежом: к концу года вы
      должны гораздо меньше, а платите столько же.
  - question: >
      В одном банке у семьи: вклад мужа 1 300 000 ₽, накопительный счёт мужа
      200 000 ₽, вклад жены 1 200 000 ₽. Сколько застраховано в АСВ?
    options:
      - text: "2 600 000 ₽: у мужа из 1 500 000 ₽ покрыто 1 400 000 ₽, у жены — все 1 200 000 ₽"
        correct: true
      - text: "1 400 000 ₽ — лимит один на банк"
      - text: "2 700 000 ₽ — застраховано всё"
      - text: "2 800 000 ₽ — по 1 400 000 ₽ на каждого независимо от остатков"
    explanation: >
      Лимит персональный и считается суммарно по всем счетам человека в этом
      банке. У мужа 1 500 000 ₽, из них покрыто 1 400 000 ₽; у жены 1 200 000 ₽
      покрыты полностью. Итого 2 600 000 ₽, незастрахованными остаются 100 000 ₽.
      Вариант 2 800 000 ₽ путает размер лимита с фактическими остатками.
  - question: >
      За 2026 год человек получил 309 250 ₽ процентов по вкладам. Какой будет
      налог?
    options:
      - text: "19 402 ₽"
        correct: true
      - text: "40 203 ₽"
      - text: "0 ₽ — проценты по вкладам налогом не облагаются"
      - text: "46 388 ₽"
    explanation: >
      Необлагаемый минимум за 2026 год — 160 000 ₽ (1 млн × 16%, максимальная
      ключевая ставка на 1-е число месяца). База: 309 250 − 160 000 = 149 250 ₽,
      налог 13% — 19 402 ₽. Вариант 40 203 ₽ — это 13% со всей суммы без вычета
      минимума; 46 388 ₽ — 15% со всей суммы, но ставка 15% применяется только к
      доходу свыше 2,4 млн ₽.
  - question: >
      Почему вклад на 3 месяца в сентябре 2026 года давал более высокую ставку,
      чем вклад на 3 года?
    options:
      - text: "Рынок ожидал снижения ключевой ставки, и банкам невыгодно фиксировать высокий процент надолго"
        correct: true
      - text: "Короткие вклады всегда выгоднее длинных"
      - text: "По длинным вкладам выше налог на процентный доход"
      - text: "Длинные вклады не страхуются в АСВ, и ставка это компенсирует"
    explanation: >
      Ставки по длинным вкладам отражают ожидания: при ключевой ставке 14% и
      прогнозе её снижения банк не станет обещать высокий процент на три года.
      При обратных ожиданиях картина переворачивается, поэтому правило «короткие
      всегда выгоднее» неверно. Налог считается одинаково, а страхование АСВ
      распространяется на вклады любого срока.
  - question: >
      Кредит 800 000 ₽ под 20% годовых на 4 года. Что верно?
    options:
      - text: "Платёж около 24 344 ₽, переплата около 368 526 ₽ — почти половина суммы кредита"
        correct: true
      - text: "Переплата составит 640 000 ₽: 20% × 4 года от 800 000 ₽"
      - text: "Платёж 16 667 ₽: 800 000 разделить на 48 месяцев"
      - text: "Переплата зависит только от ставки, срок на неё не влияет"
    explanation: >
      Функция ПЛТ(0,2/12; 48; 800000) даёт 24 344,29 ₽, за 48 месяцев — 1 168 526 ₽.
      Умножать ставку на срок нельзя: долг уменьшается с каждым платежом, поэтому
      переплата выходит меньше 640 000 ₽. Срок влияет на переплату сильнее всего:
      растягивание срока увеличивает её в разы.
  - question: >
      По кредиту осталось 600 000 ₽ под 24% на 30 месяцев. Появились 200 000 ₽.
      Какой вариант досрочного погашения сэкономит больше и почему?
    options:
      - text: "Сократить срок: проценты начисляются за каждый месяц, поэтому меньше месяцев — меньше начислений"
        correct: true
      - text: "Уменьшить платёж: высвободившиеся деньги можно разместить под 12%"
      - text: "Варианты равноценны, отличается только удобство"
      - text: "Уменьшить платёж: банк при этом пересчитает ставку вниз"
    explanation: >
      При сокращении срока экономия примерно вдвое больше, чем при уменьшении
      платежа, — это следует из того, что проценты начисляются на остаток каждый
      месяц. Ставка при досрочном погашении не меняется ни в одном варианте.
      Размещение высвободившихся денег под 12% проигрывает кредиту под 24%.
      Уменьшение платежа выбирают ради устойчивости при нестабильном доходе, а
      не ради экономии.
  - question: >
      Вы потратили по кредитной карте 120 000 ₽ и в дату платежа внесли
      минимальный платёж 6 000 ₽. Что произойдёт с процентами?
    options:
      - text: "Льготный период нарушен: проценты начислят на всю сумму задолженности с даты каждой покупки"
        correct: true
      - text: "Проценты начислят только на остаток 114 000 ₽ и только со дня платежа"
      - text: "Процентов не будет: минимальный платёж сохраняет льготный период"
      - text: "Проценты начислят по ставке вклада до востребования"
    explanation: >
      Минимальный платёж защищает только от просрочки и от записи в кредитной
      истории. Льготный период сохраняется, лишь если погашена вся задолженность
      за расчётный период; после его нарушения проценты считаются на полную
      сумму и задним числом, с даты каждой покупки. Ставка до востребования
      относится к досрочному расторжению вклада, а не к кредитной карте.
  - question: >
      Квартира 8 000 000 ₽, взнос 1 600 000 ₽, кредит 6 400 000 ₽ на 20 лет.
      По рыночной ставке 18,7% полная цена квартиры составит 26,1 млн ₽, по
      семейной 6% — 12,6 млн ₽. Что из этого следует практически?
    options:
      - text: "Проверить право на льготную программу нужно раньше, чем выбирать квартиру"
        correct: true
      - text: "Покупать жильё в ипотеку невыгодно при любой ставке"
      - text: "Нужно брать максимальный срок, чтобы платёж был меньше"
      - text: "Разница возникает из-за страховок, а не из-за ставки"
    explanation: >
      Разница в 13,5 млн ₽ определяется ставкой и превышает стоимость самой
      квартиры, поэтому вопрос о доступе к программе важнее выбора объекта.
      Максимальный срок при высокой ставке, наоборот, увеличивает переплату
      многократно; страховки в этой разнице занимают малую долю. Вывод о
      невыгодности ипотеки как таковой из расчёта не следует — он зависит от
      ставки, срока и альтернативы.
  - question: >
      Что обязательно учитывать при сравнении аренды и покупки жилья, кроме
      платежа и арендной платы? Выберите все.
    options:
      - text: "Доход, который принесёт первоначальный взнос, если его вложить"
        correct: true
      - text: "Расходы владения: налог, страховка, капремонт"
        correct: true
      - text: "Ожидаемый рост цен на жильё и индексацию аренды"
        correct: true
      - text: "Коммунальные платежи"
    explanation: >
      Первые три величины различаются между вариантами и определяют результат:
      в примере курса точка безубыточности по росту цен сдвигалась с 3,5% до
      1,27% годовых только из-за учёта индексации аренды. Коммунальные платежи
      примерно одинаковы и у арендатора, и у собственника, поэтому на сравнение
      не влияют.
  - question: >
      Квартиру купили за 5 000 000 ₽, продали через 4 года за 7 000 000 ₽, она
      не единственная, документы о покупке есть. Что верно?
    options:
      - text: "Налог есть: минимальный срок 5 лет. Выгоднее вычесть расходы — база 2 000 000 ₽, налог 260 000 ₽"
        correct: true
      - text: "Налога нет: прошло больше трёх лет"
      - text: "Налог есть, но выгоднее вычет 1 млн ₽ — он не требует документов"
      - text: "Налог считается со всей цены продажи: 7 000 000 × 13%"
    explanation: >
      Три года достаточно только для единственного жилья, наследства, дарения от
      близких, приватизации и ренты; в остальных случаях срок пять лет. Вычитание
      расходов оставляет базу 2 000 000 ₽ и налог 260 000 ₽, а вычет в миллион
      дал бы базу 6 000 000 ₽ и налог существенно больше. Облагается доход после
      применения вычета, а не вся цена продажи.
  - question: >
      Годовой доход 5 200 000 ₽. Каков НДФЛ?
    options:
      - text: "738 000 ₽"
        correct: true
      - text: "780 000 ₽ — 15% со всей суммы"
      - text: "936 000 ₽ — 18% со всей суммы"
      - text: "676 000 ₽ — 13% со всей суммы"
    explanation: >
      Шкала применяется по ступеням: 2 400 000 × 13% = 312 000 ₽, следующие
      2 600 000 × 15% = 390 000 ₽, оставшиеся 200 000 × 18% = 36 000 ₽. Итого
      738 000 ₽, эффективная ставка 14,19%. Все остальные варианты исходят из
      того, что одна ставка применяется ко всему доходу, — это и есть самое
      распространённое заблуждение о прогрессивной шкале.
  - question: >
      За год потрачено: 200 000 ₽ на лечение с кодом «1», 60 000 ₽ на абонемент
      в спортзал и 130 000 ₽ на очное обучение ребёнка в вузе. Удержано НДФЛ
      180 000 ₽. Сколько вернут?
    options:
      - text: "33 800 ₽"
        correct: true
      - text: "50 700 ₽"
      - text: "19 500 ₽"
      - text: "23 400 ₽"
    explanation: >
      Лечение с кодом «1» и спорт складываются и упираются в общий лимит
      150 000 ₽ — возврат 19 500 ₽. Обучение ребёнка идёт по отдельному лимиту
      110 000 ₽ — возврат 14 300 ₽. Итого 33 800 ₽, удержанного налога хватает.
      50 700 ₽ получается, если вернуть 13% со всех расходов без лимитов;
      19 500 ₽ — если забыть про отдельный лимит на обучение детей.
  - question: >
      Человек с зарплатой 90 000 ₽ и ипотекой планирует заявить имущественный
      вычет 650 000 ₽, а также социальный вычет за лечение в текущем году. Что
      верно про сроки?
    options:
      - text: "Имущественный можно выбирать несколько лет, социальный нужно заявить в пределах трёх лет — иначе он сгорит"
        correct: true
      - text: "Оба вычета переносятся на следующие годы без ограничений"
      - text: "Оба сгорают по окончании года, в котором были расходы"
      - text: "Заявить оба в одной декларации нельзя"
    explanation: >
      Остаток имущественного вычета переносится на следующие годы без ограничения
      срока: при налоге около 140 000 ₽ в год на 650 000 ₽ уйдёт несколько лет.
      Социальный вычет привязан к году расходов, и после истечения трёхлетнего
      срока подачи он пропадает. В одной декларации за один год можно заявить
      оба вычета.
  - question: >
      Годовой доход от юридических лиц — 2 200 000 ₽. Что верно при сравнении
      НПД и ИП на УСН «Доходы»?
    options:
      - text: "Суммарные платежи почти совпадают, но у ИП часть денег идёт на его пенсию и медстрахование"
        correct: true
      - text: "НПД дешевле примерно на 76 000 ₽ — у ИП есть страховые взносы"
      - text: "ИП дешевле: налог после уменьшения на взносы меньше, чем налог на НПД"
      - text: "При таком доходе НПД применять нельзя"
    explanation: >
      На УСН «Доходы» без работников налог уменьшается на всю сумму уплаченных
      взносов, поэтому общий платёж остаётся около 6% дохода — столько же, сколько
      на НПД. Разница в том, куда идут деньги: у ИП значительная часть — это
      взносы, за которые начисляются стаж и баллы. Лимит НПД 2,4 млн ₽ ещё не
      превышен. Варианты «дешевле» получаются, если считать только взносы или
      только налог.
  - question: >
      Человек шесть лет работал самозанятым на НПД, добровольных взносов не
      платил. Ему не хватает двух лет стажа до страховой пенсии. Что верно?
    options:
      - text: "Годы на НПД стажа не дали; добавить два года можно добровольными взносами или наёмной работой, и второе дешевле"
        correct: true
      - text: "Стаж шёл: часть налога НПД направляется в пенсионный фонд"
      - text: "Добровольные взносы невыгодны: они окупаются 37 лет"
      - text: "Недостающий стаж можно докупить одномоментно в год выхода на пенсию"
    explanation: >
      Из НПД пенсионные взносы не платятся, поэтому стажа эти годы не дают; в
      фонд ОМС отчисления идут, но на пенсию это не влияет. Оценка «37 лет» верна
      для дополнительных баллов сверх минимума — здесь взносы решают другую
      задачу: дают право на страховую пенсию вместо социальной, которая меньше и
      назначается на пять лет позже. Взносы платятся за каждый год отдельно,
      докупить стаж разом нельзя. Наёмная работа даёт те же два года бесплатно,
      потому что взносы платит работодатель.
  - question: >
      Перед подачей заявки на ипотеку человек обнаружил в кредитной истории:
      неиспользуемую карту с лимитом 500 000 ₽, погашенную просрочку 2019 года и
      семь запросов от банков за последний месяц. Что требует действий? Выберите все.
    options:
      - text: "Закрыть неиспользуемую карту — банк учитывает весь одобренный лимит как долговую нагрузку"
        correct: true
      - text: "Прекратить подавать новые заявки и выждать — веер запросов ухудшает оценку"
        correct: true
      - text: "Добиться удаления просрочки 2019 года — иначе ипотеку не одобрят"
      - text: "Открыть ещё одну карту и аккуратно ей пользоваться, чтобы улучшить рейтинг"
    explanation: >
      Лимит неиспользуемой карты уменьшает сумму, которую одобрят, а частые
      заявки читаются банком как признак проблем — обе ситуации исправляются до
      подачи. Просрочка 2019 года хранится семь лет и удалению не подлежит, если
      она была реальной, но на решение спустя столько лет влияет слабо. Новая
      карта увеличит долговую нагрузку, а не улучшит положение.
  - question: >
      Знакомый предлагает вложиться в проект с «гарантированной доходностью 30%
      годовых, полностью без риска». Ключевая ставка 14%, вклады дают около 13%.
      Что это означает?
    options:
      - text: "Доходность вдвое выше безрисковой ставки не бывает безрисковой: риск есть, и его либо скрывают, либо это обман"
        correct: true
      - text: "Предложение выгодное: главное — проверить, есть ли письменная гарантия"
      - text: "Это нормально: частные проекты всегда доходнее банков"
      - text: "Решение зависит только от того, доверяете ли вы знакомому"
    explanation: >
      Всё, что обещает доходность выше безрисковой ставки, предлагает её в обмен
      на риск — иначе деньги перетекли бы туда, и доходность сравнялась бы с
      рыночной. Слово «гарантированно» рядом с 30% годовых является признаком
      схемы, а письменная гарантия от лица без лицензии ничего не стоит.
      Проверяется предложение в реестрах Банка России, а не степенью доверия к
      человеку.
