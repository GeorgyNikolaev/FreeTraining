pass_score: 70
questions:
  - question: >
      Чем сложный процент отличается от простого?
    options:
      - text: "Сложный начисляется на сумму вместе с уже начисленными процентами, простой — всегда на первоначальную"
        correct: true
      - text: "Сложный применяется к кредитам, простой — к вкладам"
      - text: "Сложный считается по более высокой ставке"
      - text: "Сложный учитывает инфляцию, простой — нет"
    explanation: >
      Разница только в базе начисления: у сложного процента база растёт, у
      простого остаётся прежней. Ставка при этом может быть любой, и к вкладам
      и кредитам применяются оба варианта. Инфляция к этому различию отношения
      не имеет — это отдельная поправка.
  - question: >
      Вклад 100 000 ₽ под 12% годовых. В первом банке проценты начисляют раз в
      год, во втором — каждый месяц с капитализацией. Через год разница составит:
    options:
      - text: "Около 683 ₽ в пользу второго банка"
        correct: true
      - text: "Ровно 0 ₽: ставка одинаковая"
      - text: "Около 12 000 ₽ в пользу второго банка"
      - text: "В пользу первого банка, потому что ежемесячное начисление дробит сумму"
    explanation: >
      Раз в год: 112 000 ₽. Каждый месяц: 100 000 × (1 + 0,12/12)¹² = 112 683 ₽,
      то есть эффективная ставка 12,68%. Разница мала за один год именно потому,
      что проценты успевают поработать недолго, — но за десять лет она вырастает
      в разы. Вариант «ровно 0» — самая частая ошибка: одинаковая цифра в
      договоре не означает одинаковый доход.
  - question: >
      Годовая инфляция 6,3%, вклад под 9% годовых. Какова реальная ставка?
    options:
      - text: "2,54%"
        correct: true
      - text: "2,70%"
      - text: "15,30%"
      - text: "0,63%"
    explanation: >
      Точный расчёт: (1 + 0,09) / (1 + 0,063) − 1 = 2,54%. Вариант 2,70% —
      результат простого вычитания 9 − 6,3; так прикидывают в уме, но ответ
      получается завышенным, и чем выше числа, тем сильнее расхождение.
      Складывать ставку с инфляцией (15,30%) нельзя: инфляция уменьшает доход,
      а не увеличивает.
  - question: >
      В таблице набрана формула =ПЛТ(0,18; 60; 900000) для кредита 900 000 ₽ на
      5 лет под 18% годовых с ежемесячными платежами. Что в ней не так?
    options:
      - text: "Ставка задана годовой, а срок — в месяцах; нужно 0,18/12"
        correct: true
      - text: "Срок нужно указывать в годах: 5, а не 60"
      - text: "Сумму кредита нужно записать со знаком минус"
      - text: "Всё верно, формула вернёт правильный платёж"
    explanation: >
      Ставка и срок должны быть в одних единицах. Здесь срок в месяцах, значит
      и ставка нужна месячная — 0,18/12. Как есть формула посчитает кредит под
      18% в месяц и вернёт платёж около 162 000 ₽ вместо примерно 22 850 ₽.
      Менять срок на 5 нельзя — платежи-то ежемесячные; знак суммы влияет только
      на знак результата, а не на его величину.
  - question: >
      Магазин предлагает товар за 60 000 ₽ сразу или 12 платежей по 5 500 ₽ «без
      процентов». Как правильно оценить это предложение?
    options:
      - text: "Найти ставку функцией СТАВКА по платежу, сроку и цене при оплате сразу"
        correct: true
      - text: "Разделить переплату 6 000 ₽ на 60 000 ₽ и получить ставку 10% годовых"
      - text: "Никак: раз в договоре написано 0%, процентов действительно нет"
      - text: "Сравнить 5 500 ₽ со ставкой по вкладу"
    explanation: >
      Долг уменьшается с каждым платежом, поэтому переплата, делённая на полную
      цену, занижает ставку примерно вдвое: здесь 10% против фактических
      примерно 18% годовых. Надпись «0%» относится к тому, что проценты не
      называются отдельной строкой, — они уже включены в цену товара при покупке
      в рассрочку.
  - question: >
      Почему одинаковая надбавка к ставке сильнее сказывается на длинном сроке,
      чем на коротком?
    options:
      - text: "Потому что проценты начисляются на сумму с уже начисленными процентами, и эффект нарастает с каждым периодом"
        correct: true
      - text: "Потому что на длинном сроке выше инфляция"
      - text: "Потому что банки на длинных сроках берут дополнительные комиссии"
      - text: "Это неверно: разница в ставке всегда даёт одинаковый эффект"
    explanation: >
      Сумма растёт как ставка в степени числа периодов, поэтому разница в
      ставке умножается сама на себя раз за разом: за год 12% и 14% отличаются
      на 2 000 ₽ со 100 000 ₽, за десять лет — на 60 000 ₽. Инфляция и комиссии
      могут присутствовать, но эффект возникает и без них — это свойство самой
      формулы.
