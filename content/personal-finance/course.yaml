title: "Личные финансы: вклады, кредиты, налоги, ипотека"
description: >
  Как считать и проверять решения о собственных деньгах: сколько на самом деле
  стоит кредит, сколько приносит вклад после налога, что можно вернуть у
  государства, стоит ли брать квартиру в ипотеку и когда пора оформлять
  самозанятость. Все числа — на сентябрь 2026 года.
tags: [личные финансы, вклады, кредиты, ипотека, налоги, самозанятость]
level: beginner
prerequisites:
  - "Считать проценты от числа: сколько будет 7% от 40 000"
  - "Вводить формулу в Google Таблицах или Excel (=A1*B1) и протягивать её вниз по столбцу"
  - "Пользоваться личным кабинетом банка и порталом Госуслуг"
