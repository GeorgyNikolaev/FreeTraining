pass_score: 70
questions:
  - question: >
      Кредит 1 000 000 ₽ под 25% годовых на 5 лет, аннуитетные платежи. Какая
      часть первого платежа 29 351 ₽ пойдёт на погашение самого долга?
    options:
      - text: "8 518 ₽ — остальное проценты за первый месяц"
        correct: true
      - text: "16 667 ₽ — 1 000 000 разделить на 60 месяцев"
      - text: "29 351 ₽ — весь платёж идёт на долг, проценты платятся в конце"
      - text: "20 833 ₽ — долг и проценты делятся поровну ближе к началу"
    explanation: >
      Сначала берутся проценты за прошедший месяц на текущий остаток:
      1 000 000 × 25% / 12 = 20 833,33 ₽. Остаток платежа, 8 517,99 ₽, идёт на
      долг. Вариант 16 667 ₽ — это погашение долга при дифференцированном
      платеже, а не при аннуитетном; 20 833 ₽ — это как раз сумма процентов, а
      не долга.
  - question: >
      Почему при аннуитетных платежах к середине срока выплачено меньше
      половины долга?
    options:
      - text: "Проценты считаются на остаток долга, а в начале срока остаток максимален, поэтому на сам долг идёт малая часть платежа"
        correct: true
      - text: "Банк сначала списывает комиссии, а уже потом долг"
      - text: "Потому что в начале срока ставка выше, чем в конце"
      - text: "Это неверно: к середине срока всегда выплачено ровно половина"
    explanation: >
      Состав платежа меняется: в первые месяцы почти весь платёж уходит на
      проценты, потому что остаток велик. В примере урока за 30 месяцев из 60
      долг уменьшился с 1 000 000 ₽ до 650 000 ₽, то есть на 35%. Ставка при
      этом постоянна, а отдельных комиссий в аннуитете нет.
  - question: >
      Кредит 500 000 ₽ под 19% годовых, страховка 60 000 ₽ включена в сумму
      кредита. Что показывает ПСК в квадратной рамке договора?
    options:
      - text: "Около 27% — стоимость денег с учётом обязательной страховки"
        correct: true
      - text: "19% — ставка по договору, страховка указывается отдельно"
      - text: "Около 12% — ПСК учитывает, что часть суммы вернётся"
      - text: "Число, которое банк выбирает сам"
    explanation: >
      ПСК включает все обязательные расходы, в том числе навязанную страховку,
      и приводит их к годовой ставке. Здесь получается 27,43%: вы платите
      проценты на 560 000 ₽, а пользуетесь 500 000 ₽. Ставка 19% в рамке не
      появится именно потому, что она не отражает реальную стоимость денег, а
      форму и содержание рамки задаёт закон, а не банк.
  - question: >
      Вы потратили по кредитной карте 80 000 ₽ и в дату платежа внесли
      минимальный платёж 4 000 ₽. Что произойдёт?
    options:
      - text: "Просрочки не будет, но льготный период нарушен и проценты начислятся на всю сумму задолженности"
        correct: true
      - text: "Ничего: минимальный платёж сохраняет льготный период"
      - text: "Проценты начислятся только на остаток 76 000 ₽ и только со следующего дня"
      - text: "Банк заблокирует карту до полного погашения"
    explanation: >
      Минимальный платёж защищает только от просрочки и от порчи кредитной
      истории. Льготный период сохраняется, лишь если погашена вся
      задолженность за расчётный период. После его нарушения проценты
      начисляются на полную сумму и с даты каждой покупки, а не на остаток
      после платежа.
  - question: >
      По кредиту осталось 500 000 ₽ под 22% на 36 месяцев, вы вносите досрочно
      150 000 ₽. Какие варианты сэкономят больше и почему?
    options:
      - text: "Сократить срок: проценты начисляются за каждый месяц, и чем меньше месяцев, тем меньше начислений"
        correct: true
      - text: "Уменьшить платёж: освободившиеся деньги можно положить на вклад"
      - text: "Оба варианта дают одинаковую экономию, разница только в удобстве"
      - text: "Уменьшить платёж: банк пересчитает ставку в меньшую сторону"
    explanation: >
      Сокращение срока экономит 106 985 ₽ процентов, уменьшение платежа —
      56 228 ₽, разница около 50 757 ₽. Ставка при досрочном погашении не
      меняется ни в одном из вариантов. Вклад из освободившихся денег приносит
      12–13% годовых, а кредит стоит 22%, поэтому эта комбинация проигрывает.
  - question: >
      В каких ситуациях досрочное погашение ипотеки под 6% годовых —
      сомнительное решение? Выберите все подходящие.
    options:
      - text: "Когда есть долг по кредитной карте под 39,9% годовых"
        correct: true
      - text: "Когда вклады дают 12% годовых, а свободные деньги можно разместить"
        correct: true
      - text: "Когда до конца ипотеки осталось больше десяти лет"
      - text: "Когда платёж по ипотеке занимает больше трети дохода"
    explanation: >
      Досрочное погашение даёт доходность, равную ставке кредита: по ипотеке
      это 6%. Поэтому дорогой долг под 39,9% и вклад под 12% обгоняют её —
      сначала стоит закрыть карту и разместить деньги. Длинный остаток срока,
      наоборот, усиливает эффект досрочного погашения, а высокая доля платежа в
      доходе — довод за погашение, а не против.
  - question: >
      Банк предлагает рефинансировать кредит: ставка снижается с 25% до 21%,
      платёж падает с 29 000 ₽ до 19 500 ₽. Чего не хватает, чтобы понять,
      выгодно ли это?
    options:
      - text: "Срока нового кредита и расходов на оформление — без них сумму всех платежей не посчитать"
        correct: true
      - text: "Ничего: ставка ниже и платёж ниже, значит выгодно"
      - text: "Размера кешбэка по карте нового банка"
      - text: "Кредитного рейтинга заёмщика"
    explanation: >
      Падение платежа на треть при снижении ставки всего на 4 процентных пункта
      почти наверняка означает, что срок растянут, — и тогда переплата вырастет,
      несмотря на меньшую ставку. Сравнивать нужно сумму всех оставшихся
      платежей по старому кредиту с суммой всех платежей по новому плюс
      расходы на оформление: новую страховку, оценку, пошлины.
