pass_score: 70
questions:
  - question: >
      Годовой доход вырос с 2 400 000 ₽ до 2 500 000 ₽, то есть перешёл порог
      первой ступени. Что произойдёт с суммой на руки?
    options:
      - text: "Вырастет на 85 000 ₽: по ставке 15% облагается только превышение в 100 000 ₽"
        correct: true
      - text: "Упадёт: весь доход теперь облагается по 15%"
      - text: "Вырастет на 87 000 ₽: ставка не меняется до 5 млн ₽"
      - text: "Не изменится: разницу съест повышенная ставка"
    explanation: >
      Повышенная ставка применяется только к части дохода выше порога: налог
      растёт с 312 000 ₽ до 327 000 ₽, на руки — с 2 088 000 ₽ до 2 173 000 ₽.
      Перейти порог и получить меньше невозможно ни на одной ступени. Вариант
      87 000 ₽ предполагал бы ставку 13% и на превышение — она уже 15%.
  - question: >
      За год потрачено: 120 000 ₽ на своё обучение, 90 000 ₽ на лечение с кодом
      «1» и 130 000 ₽ на очное обучение ребёнка в вузе. Какой будет вычет?
    options:
      - text: "150 000 ₽ по общему лимиту плюс 110 000 ₽ за обучение ребёнка"
        correct: true
      - text: "150 000 ₽ — общий лимит на все социальные вычеты"
      - text: "340 000 ₽ — вся потраченная сумма"
      - text: "260 000 ₽ — 150 000 ₽ плюс 110 000 ₽, но только если ребёнку меньше 18 лет"
    explanation: >
      Своё обучение и лечение с кодом «1» складываются и упираются в общий лимит
      150 000 ₽. Обучение детей — отдельный лимит 110 000 ₽ на каждого ребёнка,
      и он не входит в общий. Возраст ребёнка при очной форме обучения
      учитывается до 24 лет, а не до 18.
  - question: >
      В справке из клиники за операцию стоимостью 300 000 ₽ указан код «2».
      Что это значит?
    options:
      - text: "Это дорогостоящее лечение, вычет не ограничен 150 000 ₽ — вернут 39 000 ₽"
        correct: true
      - text: "Это обычное лечение, вычет войдёт в общий лимит 150 000 ₽"
      - text: "Код означает, что услуга оказана по полису ОМС и вычет не положен"
      - text: "Код влияет только на порядок подачи документов, не на сумму"
    explanation: >
      Код «2» в справке об оплате медицинских услуг означает дорогостоящее
      лечение: вычет по нему не ограничен общим лимитом, и вернуть можно 13% от
      всей суммы, если удержанного за год налога достаточно. Код «1» —
      обычное лечение, оно попадает в общие 150 000 ₽. Разница на этом примере —
      39 000 ₽ против 19 500 ₽ на весь общий лимит.
  - question: >
      Самозанятый на НПД с доходом 1 500 000 ₽ в год потратил 100 000 ₽ на
      лечение. Сколько он вернёт?
    options:
      - text: "Ничего: вычет возвращает уплаченный НДФЛ, а он платит налог на профессиональный доход"
        correct: true
      - text: "13 000 ₽ — как и любой человек с доходом"
      - text: "6 000 ₽ — по ставке НПД 6%"
      - text: "4 000 ₽ — по ставке НПД 4%"
    explanation: >
      Вычет уменьшает базу по НДФЛ и возвращает именно этот налог. Налог на
      профессиональный доход — другой налог, вычеты по НДФЛ к нему не
      применяются. Если у самозанятого есть ещё и работа по трудовому договору,
      он вернёт налог, удержанный с зарплаты, — но не с дохода на НПД.
  - question: >
      В чём принципиальная разница между социальным и имущественным вычетом,
      если удержанного за год налога не хватает, чтобы выбрать их полностью?
    options:
      - text: "Неиспользованный социальный вычет сгорает по окончании года, имущественный переносится на следующие годы"
        correct: true
      - text: "Разницы нет: оба переносятся на следующие годы"
      - text: "Социальный переносится, имущественный сгорает"
      - text: "Оба сгорают, но социальный можно заявить повторно через три года"
    explanation: >
      Имущественный вычет выбирается столько лет, сколько нужно: при налоге
      109 200 ₽ в год и вычете 403 000 ₽ на это уйдёт около четырёх лет.
      Социальный вычет привязан к году расходов: не хватило дохода — остаток
      пропал, и заявить его позже нельзя.
  - question: >
      Какие утверждения о сроках подачи документов на вычет верны? Выберите все.
    options:
      - text: "Декларацию только ради вычета можно подать в любой день года"
        correct: true
      - text: "Вычет заявляется за три предшествующих года, на каждый год — своя декларация"
        correct: true
      - text: "Все декларации на вычет нужно подать до 30 апреля, иначе штраф"
      - text: "Право на имущественный вычет сгорает через три года после покупки жилья"
    explanation: >
      Срок 30 апреля установлен для тех, кто обязан отчитаться о доходах,
      например при продаже имущества; для вычета его нет, и штрафа за
      «просрочку» тоже. Право на имущественный вычет не сгорает — квартиру
      можно было купить давно, — но вернуть налог получится только за три
      последних года.
  - question: >
      Супруги купили квартиру за 5 500 000 ₽ в ипотеку, оба работают. Какова
      максимальная сумма, которую семья может вернуть?
    options:
      - text: "До 1 300 000 ₽: у каждого супруга свои лимиты 2 млн ₽ за покупку и 3 млн ₽ по процентам"
        correct: true
      - text: "650 000 ₽ — лимиты даются на объект недвижимости"
      - text: "715 000 ₽ — 13% от стоимости квартиры"
      - text: "260 000 ₽ — вычет по процентам при совместной собственности не положен"
    explanation: >
      Лимиты персональные, а не на квартиру: каждый супруг заявляет до 2 млн ₽
      за покупку (260 000 ₽ возврата) и до 3 млн ₽ по уплаченным процентам
      (390 000 ₽). При цене 5,5 млн ₽ лимиты за покупку используются полностью
      обоими. Вернуть 13% от всей стоимости нельзя: вычет за покупку ограничен
      двумя миллионами на человека.
