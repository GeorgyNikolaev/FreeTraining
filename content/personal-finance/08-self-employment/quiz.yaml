pass_score: 70
questions:
  - question: >
      Самозанятый получил 50 000 ₽ от частного заказчика и 100 000 ₽ от
      компании. Какой налог он заплатит (бонус при регистрации уже израсходован)?
    options:
      - text: "8 000 ₽: 4% с 50 000 ₽ и 6% с 100 000 ₽"
        correct: true
      - text: "9 000 ₽: 6% со всей суммы"
      - text: "6 000 ₽: 4% со всей суммы"
      - text: "19 500 ₽: 13% со всей суммы"
    explanation: >
      Ставка определяется по каждому поступлению отдельно: 4% с доходов от
      физических лиц и 6% от юридических. За один месяц можно заплатить и по той
      и по другой ставке. Ставка 13% — это НДФЛ, он к НПД отношения не имеет.
  - question: >
      Что из перечисленного делать на НПД нельзя? Выберите все.
    options:
      - text: "Перепродавать закупленные товары"
        correct: true
      - text: "Нанять помощника по трудовому договору"
        correct: true
      - text: "Оказывать услуги компании, из которой уволился год назад"
        correct: true
      - text: "Сдавать в аренду свою квартиру"
    explanation: >
      Режим рассчитан на собственный труд: перепродажа чужих товаров и наём
      сотрудников запрещены, а работать на бывшего работодателя нельзя два года
      после увольнения — это закрывает схему «уволиться и вернуться тем же
      исполнителем». Сдавать жилую недвижимость на НПД можно; запрет
      распространяется только на нежилую.
  - question: >
      Годовой доход от юридических лиц — 2 000 000 ₽. Что выгоднее: НПД или ИП
      на УСН «Доходы»?
    options:
      - text: "По деньгам одинаково — 120 000 ₽, но у ИП часть суммы идёт на его пенсию и медстрахование"
        correct: true
      - text: "НПД дешевле примерно на 74 000 ₽ — у ИП есть страховые взносы"
      - text: "ИП дешевле: налог после вычета взносов составит всего 45 610 ₽"
      - text: "Сравнить нельзя: у ИП налог зависит от расходов"
    explanation: >
      На УСН «Доходы» без работников налог уменьшается на всю сумму уплаченных
      взносов, поэтому общий платёж остаётся 6% дохода — те же 120 000 ₽. Но
      74 390 ₽ из них — взносы, за которые начисляется стаж и баллы. Вариант
      «ИП дешевле» учитывает только налог 45 610 ₽ и забывает про взносы,
      вариант «НПД дешевле» — наоборот, складывает взносы с налогом дважды.
      От расходов налог зависит на варианте «Доходы минус расходы», а не здесь.
  - question: >
      При каком годовом доходе ИП на УСН 6% становится дороже НПД?
    options:
      - text: "Ниже примерно 1 090 000 ₽ — фиксированные взносы перестают покрываться налогом"
        correct: true
      - text: "Выше 2 400 000 ₽ — там начинается повышенная ставка"
      - text: "ИП дороже при любом доходе"
      - text: "ИП дешевле при любом доходе за счёт уменьшения налога на взносы"
    explanation: >
      Фиксированные взносы 57 390 ₽ платятся независимо от дохода. Пока 6%
      дохода больше взносов, они полностью зачитываются в налог и общий платёж
      равен 6%. Ниже точки около 1 087 800 ₽ налога не хватает, чтобы покрыть
      взносы, и ИП начинает переплачивать: при доходе 700 000 ₽ разница
      19 390 ₽. Порог 2 400 000 ₽ — это лимит НПД, а не граница выгодности.
  - question: >
      Человек пять лет проработал самозанятым на НПД. Что это дало ему для
      пенсии?
    options:
      - text: "Ничего: стаж не идёт и баллы не начисляются, если не платить добровольные взносы"
        correct: true
      - text: "Пять лет стажа, но без баллов"
      - text: "Баллы пропорционально уплаченному налогу"
      - text: "Полный стаж и баллы — часть налога НПД идёт в пенсионный фонд"
    explanation: >
      Из налога на профессиональный доход пенсионные взносы не платятся, поэтому
      ни стажа, ни баллов эти годы не дают. Часть налога действительно уходит в
      фонд обязательного медицинского страхования — поэтому полис ОМС у
      самозанятого работает, — но на пенсию это не влияет.
  - question: >
      Человеку не хватает двух лет стажа до страховой пенсии, остальные условия
      выполнены. Стоит ли платить добровольные пенсионные взносы?
    options:
      - text: "Да: без этих двух лет страховая пенсия не назначается вовсе, и разница с социальной гораздо больше стоимости взносов"
        correct: true
      - text: "Нет: взносы окупаются только за 37 лет получения пенсии"
      - text: "Да, потому что это выгоднее вклада под 12%"
      - text: "Нет: стаж можно докупить позже, в год выхода на пенсию"
    explanation: >
      Оценка «37 лет окупаемости» верна для дополнительных баллов сверх минимума:
      1,03 балла дают прибавку 161 ₽ в месяц. Но здесь взносы решают другую
      задачу — дают право на страховую пенсию вместо социальной, которая меньше
      и назначается на пять лет позже. Как вложение денег взносы вкладу
      проигрывают; докупать стаж одномоментно в год выхода на пенсию нельзя,
      взносы платятся за каждый год отдельно.
  - question: >
      Человек с зарплаты планирует получить вычет за лечение на 150 000 ₽, но с
      января переходит на самозанятость. Что произойдёт?
    options:
      - text: "Вернуть можно только налог, удержанный с зарплаты; с дохода на НПД вычет не полагается"
        correct: true
      - text: "Ничего не изменится: вычет считается от расходов, а не от дохода"
      - text: "Вычет пересчитают по ставке НПД 6%"
      - text: "Вычет перенесётся на следующие годы до появления НДФЛ"
    explanation: >
      Вычет возвращает уплаченный НДФЛ, а самозанятый его не платит. Вернуть
      получится только то, что удержали с зарплаты за годы работы по найму, и
      только в пределах трёхлетнего срока. Социальный вычет к тому же привязан к
      году расходов и на будущие годы не переносится — в отличие от
      имущественного.
