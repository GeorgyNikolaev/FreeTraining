pass_score: 70
questions:
  - question: >
      Сколько раз в год можно бесплатно получить свою кредитную историю и как?
    options:
      - text: "Дважды в год в каждом БКИ; список бюро запрашивается на Госуслугах бесплатно и без ограничений"
        correct: true
      - text: "Один раз в год, только через МФЦ"
      - text: "Сколько угодно раз — кредитная история всегда бесплатна"
      - text: "Бесплатно нельзя, отчёт стоит около 300 ₽"
    explanation: >
      Закон даёт право на два бесплатных отчёта в год в каждом бюро. Порядок из
      двух шагов: на Госуслугах бесплатно и без ограничений запрашивается список
      БКИ, где хранится ваша история, затем на сайте каждого бюро заказывается
      сам отчёт. Платные сервисы продают то, что доступно бесплатно.
  - question: >
      У человека есть кредитная карта с лимитом 400 000 ₽, которой он не
      пользовался четыре года, задолженность 0 ₽. Как это повлияет на заявку по
      ипотеке?
    options:
      - text: "Скорее всего, уменьшит одобренную сумму: банк учитывает весь лимит как потенциальный долг"
        correct: true
      - text: "Никак: задолженности нет, значит нагрузки нет"
      - text: "Улучшит условия: длинная история без просрочек — плюс"
      - text: "Приведёт к отказу: неиспользуемые карты запрещены при ипотеке"
    explanation: >
      В расчёт долговой нагрузки банки включают одобренный лимит, а не только
      потраченное: вы можете воспользоваться им в любой момент. Поэтому перед
      крупной заявкой такие карты закрывают — расторгают договор и берут справку,
      а не просто перестают пользоваться. Аккуратная история действительно плюс,
      но она не отменяет учёт лимита.
  - question: >
      Какие риски разумно страховать по правилу из урока? Выберите все.
    options:
      - text: "Ответственность перед соседями при заливе квартиры"
        correct: true
      - text: "Ответственность при ДТП сверх лимита ОСАГО"
        correct: true
      - text: "Поломка смартфона"
      - text: "Утеря банковской карты"
    explanation: >
      Страховать стоит редкое и разорительное: залив соседей на 450 000 ₽ при
      полисе за 5 500 ₽ и личный долг после ДТП при ДСАГО за 2 500 ₽. Поломка
      телефона — частый и небольшой ущерб, который дешевле покрыть подушкой;
      ответственность банка при несанкционированном списании с карты и так
      установлена законом.
  - question: >
      Человеку звонят «из службы безопасности банка» и просят перевести деньги
      на безопасный счёт, не сообщая никому о звонке. Что здесь решающее?
    options:
      - text: "Просьба перевести деньги: настоящий банк и правоохранительные органы никогда этого не просят"
        correct: true
      - text: "То, что звонок поступил с незнакомого номера"
      - text: "То, что собеседник не назвал номер отделения"
      - text: "То, что звонят в нерабочее время"
    explanation: >
      Номер подделывается, отделение можно назвать любое, а звонки идут
      круглосуточно — всё это ничего не доказывает. Решающим является сама
      просьба: перевод денег, код из СМС или установка программы. Ни банк, ни
      полиция этого не требуют ни при каких обстоятельствах.
  - question: >
      Что даёт самозапрет на кредиты?
    options:
      - text: "Банки и МФО не могут оформить на вас кредит, пока вы сами не снимете запрет; снятие занимает время"
        correct: true
      - text: "Блокирует уже выданные кредиты и приостанавливает платежи по ним"
      - text: "Запрещает банкам запрашивать вашу кредитную историю"
      - text: "Даёт право не платить по кредиту, оформленному мошенниками"
    explanation: >
      Самозапрет оформляется через Госуслуги или МФЦ, действует на будущие
      договоры и снимается не мгновенно — этой задержки достаточно, чтобы схема
      с оформлением кредита на ваше имя не сработала. Действующих кредитов он не
      касается и запросов истории не блокирует. Право не платить возникает по
      другому основанию — если банк нарушил период охлаждения.
  - question: >
      Заёмщику по микрозайму 20 000 ₽ выставили к возврату 95 000 ₽. Что стоит
      знать?
    options:
      - text: "С 1 апреля 2026 года переплата по займу МФО ограничена 100% суммы долга — больше 40 000 ₽ требовать не вправе"
        correct: true
      - text: "Ограничений нет: проценты МФО не регулируются"
      - text: "Максимальная переплата ограничена ключевой ставкой Банка России"
      - text: "Долг можно не платить, если прошло больше года"
    explanation: >
      Ограничение переплаты в 100% суммы долга действует с 1 апреля 2026 года,
      то есть по займу 20 000 ₽ предел составляет 40 000 ₽. Ключевая ставка к
      предельной переплате по микрозаймам отношения не имеет, а срок давности
      сам по себе долг не отменяет — он лишь ограничивает возможность взыскать
      его через суд.
  - question: >
      Деньги переведены мошенникам полчаса назад. Что делать в первую очередь?
    options:
      - text: "Позвонить в банк по номеру с оборота карты, заблокировать операцию и подать заявление о несогласии не позднее следующего дня"
        correct: true
      - text: "Написать заявление в полицию и ждать результата"
      - text: "Перезвонить на номер, с которого звонили, и потребовать вернуть деньги"
      - text: "Обратиться к юристам, обещающим вернуть переведённые средства"
    explanation: >
      Первые минуты решают: если платёж ещё не исполнен, банк может его
      остановить, а заявление о несогласии с операцией подаётся в жёсткий срок —
      не позднее дня, следующего за уведомлением. Заявление в полицию тоже
      нужно, но вторым шагом. Перезванивать мошенникам бессмысленно и опасно, а
      «возвратные юристы» из интернета — обычно продолжение той же схемы.
