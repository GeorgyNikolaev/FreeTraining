pass_score: 70
questions:
  - question: >
      Семейная ипотека в сентябре 2026 года ограничена суммой 6 млн ₽ в
      большинстве регионов. Вы покупаете квартиру за 12 млн ₽ со взносом 20%.
      Что это означает?
    options:
      - text: "Кредит будет состоять из двух частей: 6 млн ₽ под 6% и 3,6 млн ₽ по рыночной ставке"
        correct: true
      - text: "Квартиру дороже 6 млн ₽ по программе купить нельзя"
      - text: "Вся сумма кредита пойдёт под 6%, лимит касается только стоимости жилья"
      - text: "Придётся увеличить первоначальный взнос до 6 млн ₽"
    explanation: >
      Лимит ограничивает льготную часть кредита, а не цену квартиры. Остаток
      берётся по рыночной ставке, и получается комбинированный кредит: в примере
      урока платёж по рыночной части 3,6 млн ₽ оказался больше, чем по льготной
      части 6 млн ₽. Увеличивать взнос не обязательно, хотя это и уменьшило бы
      дорогую часть.
  - question: >
      Почему при ставке 18,7% за первые 10 лет двадцатилетней ипотеки долг
      уменьшается всего на 0,9 млн ₽ из 6,4 млн ₽?
    options:
      - text: "Проценты начисляются на остаток долга, и при высокой ставке почти весь платёж уходит на них"
        correct: true
      - text: "Банк в первые годы списывает комиссию за обслуживание кредита"
      - text: "Первые годы платежи идут в счёт страховки"
      - text: "Так работает только ипотека; по обычным кредитам долг уменьшается равномерно"
    explanation: >
      Из 12,27 млн ₽, выплаченных за десять лет, 11,4 млн ₽ — проценты. Причина
      в самой формуле аннуитета: проценты за месяц считаются на текущий остаток,
      и при ставке 18,7% они съедают почти весь платёж. Это свойство любого
      аннуитетного кредита, ипотека лишь показывает его нагляднее из-за срока.
  - question: >
      При сравнении аренды и покупки какие величины обязательно учитывать,
      кроме платежа по ипотеке и арендной платы? Выберите все.
    options:
      - text: "Доход, который принёс бы первоначальный взнос, если его вложить"
        correct: true
      - text: "Расходы владения: налог на имущество, страховка, капремонт"
        correct: true
      - text: "Стоимость коммунальных услуг"
      - text: "Размер кешбэка по карте, которой оплачивается аренда"
    explanation: >
      Первоначальный взнос — это деньги, которые в варианте с арендой продолжают
      работать: 1,6 млн ₽ под 12% за десять лет превращаются в 5,28 млн ₽.
      Расходы владения ложатся только на собственника. Коммунальные услуги платят
      в обоих вариантах примерно одинаково, поэтому на сравнение они не влияют.
  - question: >
      Квартиру 55 м² с кадастровой стоимостью 6 000 000 ₽ облагают налогом по
      ставке 0,1%. Какой будет налог за год?
    options:
      - text: "3 818 ₽ — потому что 20 м² не облагаются"
        correct: true
      - text: "6 000 ₽ — 0,1% от кадастровой стоимости"
      - text: "3 818 ₽ — потому что ставка применяется к половине стоимости"
      - text: "Зависит от рыночной цены квартиры на момент расчёта"
    explanation: >
      Из площади квартиры вычитаются 20 м², и налог считается с оставшихся 35 м²:
      6 000 000 × 35/55 × 0,1% = 3 818 ₽. Вариант 6 000 ₽ получается, если
      забыть про вычет по площади, — это самая частая ошибка при проверке
      налогового уведомления. Рыночная цена в расчёте не участвует вообще.
  - question: >
      Квартиру купили за 6 500 000 ₽ и через три года продали за 9 000 000 ₽.
      Она не единственная, документы о покупке сохранились. Какой способ расчёта
      налога выгоднее?
    options:
      - text: "Доходы минус расходы: налог 327 000 ₽ вместо 1 152 000 ₽"
        correct: true
      - text: "Вычет 1 млн ₽: он не требует документов и потому надёжнее"
      - text: "Оба способа дают одинаковый результат"
      - text: "Налога не будет: три года — достаточный срок владения"
    explanation: >
      Вычитание реальных расходов оставляет базу 2,5 млн ₽ против 8 млн ₽ при
      вычете в миллион — разница в налоге 825 000 ₽. Срок в три года достаточен
      только для единственного жилья, наследства, дарения от близких,
      приватизации и ренты; в остальных случаях минимальный срок — пять лет.
  - question: >
      Продавец указал в договоре 5 000 000 ₽, хотя кадастровая стоимость
      квартиры 8 000 000 ₽. Как посчитают доход для налога?
    options:
      - text: "5 600 000 ₽ — 70% кадастровой стоимости, потому что цена договора ниже этой величины"
        correct: true
      - text: "5 000 000 ₽ — налог считается по цене договора"
      - text: "8 000 000 ₽ — берётся полная кадастровая стоимость"
      - text: "3 000 000 ₽ — разница между кадастровой стоимостью и ценой договора"
    explanation: >
      Доход не может быть меньше 70% кадастровой стоимости: 8 000 000 × 0,7 =
      5 600 000 ₽. Так как цена договора ниже, в расчёт идёт именно эта величина,
      и налог выйдет больше, чем если бы считали по договору. Полная кадастровая
      стоимость не применяется никогда — коэффициент 0,7 закреплён в законе.
  - question: >
      Застройщик предлагает квартиру за 10 млн ₽ под 3% годовых вместо рыночных
      8 млн ₽ под 18,7%. В какой ситуации это предложение опасно?
    options:
      - text: "Если квартиру придётся продать в первые год-два: долг окажется больше рыночной цены и взнос будет потерян"
        correct: true
      - text: "Всегда: субсидированная ставка от застройщика невыгодна по определению"
      - text: "Только если ставка по рыночной ипотеке начнёт расти"
      - text: "Только если у покупателя есть право на семейную ипотеку"
    explanation: >
      На двадцати годах низкая ставка перевешивает наценку: 12,78 млн ₽ против
      26,14 млн ₽ полной стоимости. Но долг считается от завышенной цены, и через
      год он составит 8 088 709 ₽ при рыночной цене квартиры 8 000 000 ₽ —
      продажа не покроет долг, а вложенные 2 159 034 ₽ будут потеряны. Готовое
      правило «всегда невыгодно» неверно: ответ зависит от разрыва ставок и
      горизонта владения.
